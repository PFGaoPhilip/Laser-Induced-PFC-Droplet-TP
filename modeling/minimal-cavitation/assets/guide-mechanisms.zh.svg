<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1120 340" role="img" aria-label="有限源通向液体出口与水凝胶壁面的能量路径"><ns0:rect width="1120" height="340" fill="#f7fafc" /><ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M 0 0 L 10 5 L 0 10 z" fill="#526d83" /></ns0:marker></ns0:defs><ns0:g font-family="Microsoft YaHei,Segoe UI,Arial,sans-serif" fill="#183348">
    <ns0:rect x="30" y="100" width="310" height="160" rx="16" fill="#dcebf6" stroke="#8caac2" /><ns0:text x="52" y="136" font-size="22" font-weight="600">有限初始化源</ns0:text><ns0:text x="52" y="172" font-size="18">p0 + 气体体积 → 可用功 E0</ns0:text><ns0:text x="52" y="205" font-size="17">Vg 增大时压力下降</ns0:text><ns0:text x="52" y="238" font-size="17">单次短时激活；初始数据</ns0:text>
    <ns0:rect x="590" y="35" width="490" height="115" rx="16" fill="#e2edf9" stroke="#8caac2" /><ns0:text x="613" y="72" font-size="22" font-weight="600">液体出口 — A 与开放 B</ns0:text><ns0:text x="613" y="106" font-size="18">U → 排出质量、动能 Eout、冲量 Iout</ns0:text><ns0:text x="613" y="135" font-size="16">液柱储存动能 Kjet 单独记录</ns0:text>
    <ns0:rect x="590" y="195" width="490" height="115" rx="16" fill="#eee3f4" stroke="#aa90b7" /><ns0:text x="613" y="231" font-size="22" font-weight="600">凝胶壁面 — 模型 B</ns0:text><ns0:text x="613" y="265" font-size="18">R、Uw → 弹性压力与半球合力</ns0:text><ns0:text x="613" y="294" font-size="16">径向惯性 + 储存弹性功 + 损失</ns0:text>
    <ns0:path d="M340 153 C420 153 420 94 580 94" fill="none" stroke="#526d83" stroke-width="3" marker-end="url(#arrow)" /><ns0:path d="M340 208 C420 208 420 253 580 253" fill="none" stroke="#526d83" stroke-width="3" marker-end="url(#arrow)" />
    <ns0:text x="362" y="71" font-size="16">排出使 Vg 增大</ns0:text><ns0:text x="357" y="298" font-size="16">壁面膨胀使 Vg 增大</ns0:text><ns0:text x="32" y="38" font-size="17" font-weight="600">A：固定壁面　B 开放：两条能量路径　B 密封：壁面路径，零排出</ns0:text></ns0:g></ns0:svg>