<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1279.97 720" role="img">
<title>C4-E06</title>
<defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/></marker></defs>
<rect width="1279.97" height="720" fill="#142632"/>
<text id="o000" font-family="Arial,sans-serif" font-size="25.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="30.72" y="35.1733">C4-E06 · Reduced transient momentum balance with explicit initial/boundary data</tspan>
</text>
<rect id="o001" x="48" y="96" width="595.2" height="508.8" rx="40.704" fill="#1E4A5A" stroke="#2B6678" stroke-width="1.6" opacity="1"/>
<text id="o002" font-family="Arial,sans-serif" font-size="17.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="64.32" y="116.933">Film element: four forces balance inertia</tspan>
</text>
<rect id="o003" x="115.2" y="336" width="460.8" height="28.8" fill="#3A5362" stroke="#B4C7D2" stroke-width="2" opacity="1"/>
<line id="o004" x1="345.6" y1="220.8" x2="345.6" y2="331.2" fill="#FFFFFF" stroke="#F28BA0" stroke-width="5.33333" opacity="1" marker-end="url(#head)"/>
<text id="o005" font-family="Arial,sans-serif" font-size="15.3333" fill="#F28BA0" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="357.12" y="244.893">p_load (pressure)</tspan>
</text>
<line id="o006" x1="211.2" y1="422.4" x2="211.2" y2="369.6" fill="#FFFFFF" stroke="#7FC8F8" stroke-width="4.66667" opacity="1" marker-end="url(#head)"/>
<text id="o007" font-family="Arial,sans-serif" font-size="15.3333" fill="#7FC8F8" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="97.92" y="446.493">D_f∇⁴w − T₀∇²w (elastic)</tspan>
</text>
<line id="o008" x1="480" y1="422.4" x2="480" y2="369.6" fill="#FFFFFF" stroke="#F2B880" stroke-width="4.66667" opacity="1" marker-end="url(#head)"/>
<text id="o009" font-family="Arial,sans-serif" font-size="15.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="385.92" y="446.493">t_coh (cohesive)</tspan>
</text>
<line id="o010" x1="345.6" y1="268.8" x2="345.6" y2="235.2" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="1.33333" opacity="1" stroke-dasharray="6 4"/>
<text id="o011" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="97.92" y="519.587">m_A ẅ + D_f∇⁴w − T₀∇²w = p_load − t_coh</tspan>
</text>
<text id="o012" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="97.92" y="567.04">m_A ẅ is the inertia that is left over.</tspan>
</text>
<rect id="o013" x="662.4" y="96" width="580.8" height="508.8" rx="40.704" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o014" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="675.84" y="118.44">Initial and boundary data</tspan>
</text>
<text id="o015" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="699.84" y="169.187">At rest at t = 0:  w = 0,  ẇ = 0 everywhere.</tspan>
</text>
<ellipse id="o016" cx="684.48" cy="163.933" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o017" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="699.84" y="199.12">Clamped edge:  w = 0 and ∂ₙw = 0 (no deflection, no slope).</tspan>
</text>
<ellipse id="o018" cx="684.48" cy="193.867" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o019" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="699.84" y="229.053">Loading enters only through p_load; cohesive resistance only</tspan>
<tspan x="699.84" y="248.72">through t_coh.</tspan>
</text>
<ellipse id="o020" cx="684.48" cy="223.8" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o021" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="678.72" y="380.387">Without the initial data the equation has many solutions;</tspan>
<tspan x="678.72" y="400.053">without the clamp it cannot be solved.</tspan>
</text>
<text id="o022" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="678.72" y="466.24">Reduced model: small deflection, thin uniform film, tension T₀</tspan>
<tspan x="678.72" y="485.12">prescribed.</tspan>
</text>
<text id="o023" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Reduced transient plate balance of Eq. C4-E06; schematic.</tspan>
</text>
</svg>
