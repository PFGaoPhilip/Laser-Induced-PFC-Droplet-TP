<text id="o009" font-family="Arial,sans-serif" font-size="15.3333" fill="#7FC8F8" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="145.92" y="484.893">sensible</tspan>
<tspan x="145.92" y="502.987">293 → 323 K</tspan>
</text>
<text id="o010" font-family="Arial,sans-serif" font-size="15.3333" fill="#F28BA0" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="342.72" y="331.293">latent step Lᵥ</tspan>
</text>
