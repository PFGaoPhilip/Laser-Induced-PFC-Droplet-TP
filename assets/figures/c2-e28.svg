<ellipse id="o012" cx="326.4" cy="259.2" rx="6.72" ry="6.72" fill="#B4C7D2" stroke="#B4C7D2" stroke-width="1.33333" opacity="1"/>
<text id="o013" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="54.72" y="571.293">Constant-property estimate: heat the liquid to T*, then add one</tspan>
<tspan x="54.72" y="589.387">latent step.</tspan>
</text>
<text id="o014" font-family="Arial,sans-serif" font-size="18.6667" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="654.72" y="118.027">Energy to prepare the PFC (nJ)</tspan>
</text>
<text id="o015" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="654.72" y="180.16">sensible  m cₚ (T* − T₀)</tspan>
</text>
<rect id="o016" x="902.4" y="163.2" width="30.689" height="48" fill="#7FC8F8" stroke="#7FC8F8" stroke-width="1.33333" opacity="0.85"/>
<text id="o017" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="942.689" y="183.04">16.75 nJ</tspan>
</text>
<text id="o018" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="654.72" y="256.96">latent  m Lᵥ</tspan>
</text>
<rect id="o019" x="902.4" y="240" width="148.596" height="48" fill="#F28BA0" stroke="#F28BA0" stroke-width="1.33333" opacity="0.85"/>
<text id="o020" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="1060.6" y="259.84">81.08 nJ</tspan>
</text>
<text id="o021" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="654.72" y="333.76">total  Qₚᵣₑₚ</tspan>
</text>
<rect id="o022" x="902.4" y="316.8" width="179.285" height="48" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="0.85"/>
<text id="o023" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="1091.29" y="336.64">97.82 nJ</tspan>
</text>
<text id="o024" font-family="Arial,sans-serif" font-size="18.6667" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="654.72" y="410.827">16.745 + 81.079 = 97.824 nJ</tspan>
</text>
<text id="o025" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="654.72" y="461.987">Latent heat is 83 % of this estimate, so evaporating the droplet</tspan>
<tspan x="654.72" y="481.653">costs far more than warming it.</tspan>
</text>
<text id="o026" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="97.92" y="638.493">Inputs: m = 0.8535 ng, cₚ = 654 J/(kg K), Lᵥ = 95 kJ/kg, T₀ = 293 K, T* = 323 K (declared, constant-property).</tspan>
</text>
<text id="o027" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Preparation-path estimate of Eq. C2-E28.</tspan>
</text>
</svg>
