<text id="o043" font-family="Arial,sans-serif" font-size="15.3333" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="439.253" y="279.003">R/R_ref = 6:</tspan>
<tspan x="439.253" y="297.097">2.1663 G_g = 43325.6 Pa</tspan>
</text>
<rect id="o044" x="739.2" y="144" width="504" height="384" rx="30.72" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o045" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="752.64" y="166.44">Closed form</tspan>
</text>
<text id="o046" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="755.52" y="206.493">pₑₗ = 2G_g ∫ (1 + q³) dq   (q: R_ref/R → 1)</tspan>
</text>
<text id="o047" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="755.52" y="260.387">= 2G_g [q + q⁴/4]</tspan>
</text>
<text id="o048" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="755.52" y="313.733">= (G_g/2)[5 − 4R_ref/R − (R_ref/R)⁴]</tspan>
</text>
<text id="o049" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="755.52" y="379.84">Obtained from the stretch field, not a guessed constant</tspan>
<tspan x="755.52" y="398.72">pressure.</tspan>
</text>
<text id="o050" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="617.507">Resistance rises steeply at first and saturates near 5G_g/2 when the cavity is many times its reference size.</tspan>
</text>
<text id="o051" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Neo-Hookean elastic resistance of Eq. A-E05 (curve normalised by G_g).</tspan>
</text>
