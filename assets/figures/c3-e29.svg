<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1279.97 720" role="img">
<title>C3-E29</title>
<defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/></marker></defs>
<rect width="1279.97" height="720" fill="#142632"/>
<text id="o000" font-family="Arial,sans-serif" font-size="25.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="30.72" y="35.1733">C3-E29 · Declared optical and mechanical allocation</tspan>
</text>
<text id="o001" font-family="Arial,sans-serif" font-size="18.6667" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="49.92" y="113.227">From 25 µJ of laser light to 2 nJ of jet kinetic energy (nJ, log axis)</tspan>
</text>
<text id="o002" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="49.92" y="171.107">incident laser energy E_L</tspan>
</text>
<rect id="o003" x="585.6" y="153.6" width="509.232" height="43.2" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="0.85"/>
<text id="o004" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="1104.43" y="173.987">25000 nJ</tspan>
</text>
<text id="o005" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="49.92" y="238.307">absorbed E_abs,tot = 0.8 × 0.5 × E_L</tspan>
</text>
<rect id="o006" x="585.6" y="220.8" width="463.155" height="43.2" fill="#7FC8F8" stroke="#7FC8F8" stroke-width="1.33333" opacity="0.85"/>
<text id="o007" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="1058.35" y="241.187">10000 nJ</tspan>
</text>
<text id="o008" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="49.92" y="305.507">per site E_abs,site = E_abs,tot / 25</tspan>
</text>
<rect id="o009" x="585.6" y="288" width="301.289" height="43.2" fill="#F2B880" stroke="#F2B880" stroke-width="1.33333" opacity="0.85"/>
<text id="o010" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="896.489" y="308.387">400 nJ</tspan>
</text>
<text id="o011" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="49.92" y="372.707">to PFC by deadline f_T E_abs,site (f_T = 0.40)</tspan>
</text>
<rect id="o012" x="585.6" y="355.2" width="255.212" height="43.2" fill="#F28BA0" stroke="#F28BA0" stroke-width="1.33333" opacity="0.85"/>
<text id="o013" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="850.412" y="375.587">160 nJ</tspan>
</text>
<text id="o014" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="49.92" y="439.907">jet kinetic energy Eⱼ = ηⱼ E_abs,site</tspan>
</text>
<rect id="o015" x="585.6" y="422.4" width="34.8559" height="43.2" fill="#A8E6A1" stroke="#A8E6A1" stroke-width="1.33333" opacity="0.85"/>
<text id="o016" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="630.056" y="442.787">2 nJ</tspan>
</text>
<rect id="o017" x="48" y="470.4" width="576" height="139.2" rx="11.136" fill="#213E4B" stroke="#B4C7D2" stroke-width="2.13333" opacity="1"/>
<text id="o018" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="64.32" y="495.587">Efficiencies are stipulated: f_geo = 0.8, A_λ = 0.5, f_T =</tspan>
<tspan x="64.32" y="515.253">0.40, ηⱼ = 0.005.</tspan>
</text>
<text id="o019" font-family="Arial,sans-serif" font-size="16.6667" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="64.32" y="548.387">N_d = 25 sites share the energy equally.</tspan>
</text>
<rect id="o020" x="643.2" y="470.4" width="595.2" height="139.2" rx="11.136" fill="#213E4B" stroke="#F2B880" stroke-width="2.13333" opacity="1"/>
<text id="o021" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="656.64" y="492.293">Total jet energy</tspan>
</text>
<text id="o022" font-family="Arial,sans-serif" font-size="18.6667" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="659.52" y="535.627">Eⱼ,tot = N_d Eⱼ = 25 × 2.00 nJ = 50.0 nJ</tspan>
</text>
<text id="o023" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Allocation chain of Eq. C3-E29: each stage uses only the energy left by the previous one (no double counting).</tspan>
</text>
</svg>
