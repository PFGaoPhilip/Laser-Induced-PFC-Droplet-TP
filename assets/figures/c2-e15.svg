</text>
<rect id="o046" x="768" y="144" width="475.2" height="384" rx="30.72" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o047" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="781.44" y="166.44">Setting dW/drₙ = 0</tspan>
</text>
<text id="o048" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="784.32" y="208.133">dW/drₙ = 4π rₙ (2σᵥₚ − Δpₙ rₙ)</tspan>
</text>
<text id="o049" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="784.32" y="260.933">r* = 2σᵥₚ / Δpₙ   (Δpₙ &gt; 0)</tspan>
</text>
<text id="o050" font-family="Arial,sans-serif" font-size="17.3333" fill="#F28BA0" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="784.32" y="313.733">d²W/drₙ² at r* = −8πσᵥₚ &lt; 0</tspan>
</text>
<text id="o051" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="784.32" y="375.04">Negative curvature means a maximum, not a stable</tspan>
<tspan x="784.32" y="393.92">nucleus: larger superheat only moves the peak to</tspan>
<tspan x="784.32" y="412.8">smaller r.</tspan>
</text>
<text id="o052" font-family="Arial,sans-serif" font-size="16.6667" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="97.92" y="617.507">Illustrative σᵥₚ = 0.010 N/m (assumed). Doubling Δpₙ halves r* and cuts the barrier by four.</tspan>
</text>
<text id="o053" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Critical radius and branch check of Eq. C2-E15.</tspan>
