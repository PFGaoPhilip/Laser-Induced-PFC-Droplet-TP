</text>
<rect id="o026" x="76.8" y="384" width="566.4" height="249.6" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.66667" opacity="1"/>
<text id="o027" font-family="Arial,sans-serif" font-size="20" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="94.08" y="412.6">Inside the model</tspan>
</text>
<text id="o028" font-family="Arial,sans-serif" font-size="18" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="98.88" y="460.14">•  Liquid only, barotropic stiffened-gas law</tspan>
</text>
<text id="o029" font-family="Arial,sans-serif" font-size="18" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="98.88" y="508.14">•  Rigid flat slip wall, free jet side</tspan>
</text>
<text id="o030" font-family="Arial,sans-serif" font-size="18" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="98.88" y="556.14">•  First arrival, τ = c_0 t / a ≤ 1</tspan>
</text>
<text id="o031" font-family="Arial,sans-serif" font-size="18" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="98.88" y="604.14">•  Jet radius 0.5 to 2 µm</tspan>
</text>
<rect id="o032" x="672" y="384" width="566.4" height="249.6" fill="#213E4B" stroke="#F2B880" stroke-width="2.66667" opacity="1"/>
<text id="o033" font-family="Arial,sans-serif" font-size="20" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="689.28" y="412.6">Outside the model</tspan>
</text>
<text id="o034" font-family="Arial,sans-serif" font-size="18" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="694.08" y="460.14">•  Gas cushion, splash, cavitation</tspan>
</text>
<text id="o035" font-family="Arial,sans-serif" font-size="18" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="694.08" y="508.14">•  Elastic wall; pressure after τ ≈ 1</tspan>
</text>
<text id="o036" font-family="Arial,sans-serif" font-size="18" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="694.08" y="556.14">•  Bubble-to-jet physics upstream</tspan>
</text>
<text id="o037" font-family="Arial,sans-serif" font-size="18" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="694.08" y="604.14">•  Any experiment: not established</tspan>
</text>
