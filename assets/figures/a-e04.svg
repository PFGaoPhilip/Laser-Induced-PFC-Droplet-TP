</text>
<text id="o050" font-family="Arial,sans-serif" font-size="14.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="875.52" y="205.947">q³ = 1 − (R³ − R_ref³)/r³</tspan>
</text>
<text id="o051" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="875.52" y="264.093">dr/r = q² dq / (1 − q³)</tspan>
</text>
<text id="o052" font-family="Arial,sans-serif" font-size="16" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="875.52" y="322.24">(q⁻² − q⁴) dr/r = (1 + q³) dq</tspan>
</text>
<text id="o053" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="875.52" y="398.493">A messy spatial integral becomes a</tspan>
<tspan x="875.52" y="416.587">polynomial.</tspan>
</text>
<text id="o054" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="591.587">Check: (q⁻² − q⁴) q²/(1 − q³) = 1 + q³ on the whole range (max difference 1.3e-14).</tspan>
</text>
<text id="o055" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
