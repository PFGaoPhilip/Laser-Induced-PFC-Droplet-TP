<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1279.97 720" role="img">
<title>C1-E31</title>
<defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/></marker></defs>
<rect width="1279.97" height="720" fill="#142632"/>
<text id="o000" font-family="Arial,sans-serif" font-size="25.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="30.72" y="35.1733">C1-E31 · Original formulas quoted for defense 1</tspan>
</text>
<rect id="o001" x="48" y="134.4" width="262.8" height="163.2" rx="13.056" fill="#213E4B" stroke="#F2B880" stroke-width="2.13333" opacity="1"/>
<text id="o002" font-family="Arial,sans-serif" font-size="18" fill="#F2B880" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="179.4" y="156.84">Source pressure</tspan>
</text>
<text id="o003" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="179.4" y="184.427">p_b from the contents (E08),</tspan>
<tspan x="179.4" y="204.093">not from R alone</tspan>
</text>
<line id="o004" x1="313.68" y1="216" x2="351.12" y2="216" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="2.93333" opacity="1" marker-end="url(#head)"/>
<rect id="o005" x="354" y="134.4" width="262.8" height="163.2" rx="13.056" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o006" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="485.4" y="156.84">Radius motion</tspan>
</text>
<text id="o007" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="485.4" y="184.427">Rayleigh–Plesset: p_b − p∞ −</tspan>
<tspan x="485.4" y="204.093">2σ/R − 4μṘ/R (E07)</tspan>
</text>
<line id="o008" x1="619.68" y1="216" x2="657.12" y2="216" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="2.93333" opacity="1" marker-end="url(#head)"/>
<rect id="o009" x="660" y="134.4" width="262.8" height="163.2" rx="13.056" fill="#213E4B" stroke="#7FC8F8" stroke-width="2.13333" opacity="1"/>
<text id="o010" font-family="Arial,sans-serif" font-size="18" fill="#7FC8F8" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="791.4" y="156.84">Liquid response</tspan>
</text>
<text id="o011" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="791.4" y="184.427">inertia stores the work;</tspan>
<tspan x="791.4" y="204.093">impulse Π gives early speed</tspan>
<tspan x="791.4" y="223.76">(E05, E21)</tspan>
</text>
<line id="o012" x1="925.68" y1="216" x2="963.12" y2="216" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="2.93333" opacity="1" marker-end="url(#head)"/>
<rect id="o013" x="966" y="134.4" width="262.8" height="163.2" rx="13.056" fill="#213E4B" stroke="#F28BA0" stroke-width="2.13333" opacity="1"/>
<text id="o014" font-family="Arial,sans-serif" font-size="18" fill="#F28BA0" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="1097.4" y="156.84">Geometry</tspan>
</text>
<text id="o015" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="1097.4" y="184.427">stand-off and walls decide</tspan>
<tspan x="1097.4" y="204.093">direction (E26–E29)</tspan>
</text>
<rect id="o016" x="48" y="336" width="1180.8" height="148.8" rx="11.904" fill="#213E4B" stroke="#B4C7D2" stroke-width="2.13333" opacity="1"/>
<text id="o017" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="64.32" y="360.36">Reference formulas of the defence answer</tspan>
</text>
<text id="o018" font-family="Arial,sans-serif" font-size="18.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="64.32" y="401.227">ρ(RR̈ + 3Ṙ²/2) = p_b − p∞ − 2σ/R − 4μṘ/R</tspan>
<tspan x="64.32" y="423.253">p_b = pᵥ,PFC + pᵥ,w + p_g</tspan>
</text>
<text id="o019" font-family="Arial,sans-serif" font-size="18" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="49.92" y="525.48">The source pressure moves carrier liquid. Whether that motion becomes a useful jet is decided by geometry, not by the</tspan>
<tspan x="49.92" y="546.72">pressure alone.</tspan>
</text>
<text id="o020" font-family="Arial,sans-serif" font-size="16.6667" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="49.92" y="581.987">Every term of the radius equation is a pressure (Pa); every term of the composition is a partial pressure.</tspan>
</text>
<text id="o021" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Summary of Eqs. C1-E07 and C1-E08.</tspan>
</text>
</svg>
