<tspan x="202.178" y="319.789">5.527 nJ at v_CM</tspan>
</text>
<text id="o033" font-family="Arial,sans-serif" font-size="15.3333" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="131.2" y="217.053">E_solid = 10 nJ</tspan>
</text>
<text id="o034" font-family="Arial,sans-serif" font-size="15.3333" fill="#F28BA0" text-anchor="start" opacity="1">
<tspan x="451.778" y="474.093">v_CM = Iₙₑₜ/m_f = 0.6724 m/s</tspan>
</text>
<rect id="o035" x="739.2" y="153.6" width="504" height="374.4" rx="29.952" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
