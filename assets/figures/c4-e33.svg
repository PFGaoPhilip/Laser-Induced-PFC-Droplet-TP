<tspan x="752.64" y="176.04">Implied speed and energy</tspan>
</text>
<text id="o037" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="755.52" y="216.64">v_CM = Iₙₑₜ / m_f = 0.672378829 m/s</tspan>
</text>
<text id="o038" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="755.52" y="269.44">K_CM = Iₙₑₜ² / (2 m_f) = 0.526688683 nJ</tspan>
</text>
<text id="o039" font-family="Arial,sans-serif" font-size="16" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="755.52" y="322.24">Γ A_f + K_CM = 5.526688683 nJ  &lt;  E_solid</tspan>
</text>
<text id="o040" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="755.52" y="394.24">Check: the impulse budget and low-Γ energy budget agree</tspan>
<tspan x="755.52" y="413.12">at the implied speed.</tspan>
</text>
<text id="o041" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="591.587">Compatibility is a screen: it shows the two budgets do not contradict each other, not that the film actually leaves.</tspan>
</text>
<text id="o042" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Energy–momentum compatibility of Eq. C4-E33.</tspan>
</text>
