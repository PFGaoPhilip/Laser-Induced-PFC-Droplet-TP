</text>
<line id="o008" x1="543.086" y1="307.2" x2="543.086" y2="313.92" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="1.33333" opacity="1"/>
<text id="o009" font-family="Arial,sans-serif" font-size="14.6667" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="543.086" y="333.613">0.6</tspan>
</text>
<line id="o010" x1="685.714" y1="307.2" x2="685.714" y2="313.92" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="1.33333" opacity="1"/>
<text id="o011" font-family="Arial,sans-serif" font-size="14.6667" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="685.714" y="333.613">0.8</tspan>
</text>
<line id="o012" x1="828.343" y1="307.2" x2="828.343" y2="313.92" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="1.33333" opacity="1"/>
<text id="o013" font-family="Arial,sans-serif" font-size="14.6667" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="828.343" y="333.613">1</tspan>
</text>
<line id="o014" x1="970.971" y1="307.2" x2="970.971" y2="313.92" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="1.33333" opacity="1"/>
<text id="o015" font-family="Arial,sans-serif" font-size="14.6667" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="970.971" y="333.613">1.2</tspan>
</text>
<line id="o016" x1="1113.6" y1="307.2" x2="1113.6" y2="313.92" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="1.33333" opacity="1"/>
<text id="o017" font-family="Arial,sans-serif" font-size="14.6667" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="1113.6" y="333.613">1.4</tspan>
</text>
<text id="o018" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="614.4" y="368.633">Time from first contact (ns)</tspan>
</text>
<rect id="o019" x="115.2" y="220.8" width="713.143" height="57.6" fill="#2B5560" stroke="#8EDBD4" stroke-width="2.66667" opacity="1"/>
<text id="o020" font-family="Arial,sans-serif" font-size="18.6667" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="471.771" y="253.893">incident window t_w = 1 ns</tspan>
</text>
<line id="o021" x1="973.447" y1="182.4" x2="973.447" y2="307.2" fill="#FFFFFF" stroke="#F2B880" stroke-width="4" opacity="1"/>
<text id="o022" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="middle" opacity="1">
<tspan x="973.447" y="162.233">reflected shock returns to z = 2a at about 1.20 ns</tspan>
</text>
<rect id="o023" x="86.4" y="422.4" width="537.6" height="163.2" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.66667" opacity="1"/>
<text id="o024" font-family="Arial,sans-serif" font-size="18.6667" fill="#8EDBD4" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="355.2" y="450.693">Flux through the plane z = 2a</tspan>
</text>
<text id="o025" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="355.2" y="493.433">mass flow  ṁ = ρ_j U π a² = 3.1053 × 10⁻⁷ kg/s</tspan>
</text>
<text id="o026" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="355.2" y="531.833">energy flux  K̇ = ½ ρ_j U³ π a² = 1.5226 mW</tspan>
</text>
<text id="o027" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="355.2" y="570.233">K (1 ns) = K̇ · 1 ns = 1.5226 pJ</tspan>
</text>
<rect id="o028" x="672" y="422.4" width="537.6" height="163.2" fill="#213E4B" stroke="#F2B880" stroke-width="2.66667" opacity="1"/>
<text id="o029" font-family="Arial,sans-serif" font-size="18.6667" fill="#F2B880" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="940.8" y="450.693">What the flux is not</tspan>
</text>
<text id="o030" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="940.8" y="511.533">Liquid energy crossing a plane.</tspan>
<tspan x="940.8" y="531.987">A rigid wall does not move,</tspan>
<tspan x="940.8" y="552.44">so it receives no work.</tspan>
</text>
<text id="o031" font-family="Arial,sans-serif" font-size="14" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="36.48" y="697.3">Numbers for a = 1 µm and U = 99.02724 m/s.</tspan>
</text>
</svg>
