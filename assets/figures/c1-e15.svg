</text>
<text id="o039" font-family="Arial,sans-serif" font-size="15.3333" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="130.169" y="411.293">dashed: ∝ R^(−3/2) as R → 0</tspan>
</text>
<rect id="o040" x="758.4" y="144" width="484.8" height="393.6" rx="31.488" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o041" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="771.84" y="166.44">Reading the solution</tspan>
</text>
<text id="o042" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="774.72" y="208.133">Ṙ = −√{ (2Δp_c/3ρ) [ (Rₘₐₓ/R)³ − 1 ] }</tspan>
</text>
<text id="o043" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="795.84" y="279.587">The start R = Rₘₐₓ at rest fixes the constant: Ṙ</tspan>
<tspan x="795.84" y="299.253">= 0 there.</tspan>
</text>
<ellipse id="o044" cx="780.48" cy="274.333" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o045" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="795.84" y="329.853">The minus sign selects the inward branch</tspan>
<tspan x="795.84" y="349.52">(collapse).</tspan>
</text>
<ellipse id="o046" cx="780.48" cy="324.6" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o047" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="795.84" y="380.12">As R → 0, |Ṙ| grows without bound: this is the</tspan>
<tspan x="795.84" y="399.787">model&#x27;s singularity, not a physical speed limit.</tspan>
</text>
<ellipse id="o048" cx="780.48" cy="374.867" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o049" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="795.84" y="430.387">Real collapse is stopped by gas, viscosity,</tspan>
<tspan x="795.84" y="450.053">tension and compressibility long before.</tspan>
</text>
<ellipse id="o050" cx="780.48" cy="425.133" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o051" font-family="Arial,sans-serif" font-size="16.6667" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="107.52" y="617.507">Teaching inputs: Rₘₐₓ = 30 µm, ρ = 1000 kg/m³, Δp_c = 100 kPa.</tspan>
</text>
<text id="o052" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Wall speed from Eq. C1-E15 (log–log axes).</tspan>
</text>
</svg>
