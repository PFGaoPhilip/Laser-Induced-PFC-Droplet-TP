<text id="o032" font-family="Arial,sans-serif" font-size="16" fill="#8EDBD4" text-anchor="start" opacity="1">
<tspan x="123.088" y="482.744">|p̄| = p₀ τ_eq/τₒ  (actual mean)</tspan>
</text>
<text id="o033" font-family="Arial,sans-serif" font-size="16" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="250.27" y="200.931">bound √(Zₗ E_w / A_oτₒ) = p₀ √(τ_eq/τₒ)</tspan>
</text>
<rect id="o034" x="758.4" y="144" width="484.8" height="374.4" rx="29.952" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o035" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="771.84" y="166.44">Finite window, finite energy</tspan>
</text>
<text id="o036" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="774.72" y="207.587">E_w = ∫∫ p′²/Zₗ dA dt</tspan>
</text>
<text id="o037" font-family="Arial,sans-serif" font-size="16" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="774.72" y="255.04">|p̄|² ≤ (1/A_oτₒ) ∫∫ p′² dA dt = Zₗ E_w/(A_oτₒ)</tspan>
</text>
<text id="o038" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="795.84" y="322.24">Mean ≤ root-mean-square (Cauchy–Schwarz).</tspan>
</text>
<ellipse id="o039" cx="780.48" cy="317.12" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o040" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="795.84" y="351.36">The bound uses the one-way wave relation u′ =</tspan>
<tspan x="795.84" y="370.24">p′/Zₗ.</tspan>
</text>
<ellipse id="o041" cx="780.48" cy="346.24" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o042" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="795.84" y="400">A point spike with no measured area or time cannot</tspan>
<tspan x="795.84" y="418.88">stand for delivered loading.</tspan>
</text>
<ellipse id="o043" cx="780.48" cy="394.88" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o044" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="591.587">For a window longer than the pulse the true mean falls as 1/x while the energy bound falls only as 1/√x: the bound is safe, not</tspan>
<tspan x="97.92" y="611.253">tight.</tspan>
</text>
<text id="o045" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">One-way-wave energy bound of Eq. C3-E27 evaluated for a rectangular pulse of amplitude p₀ and duration τ_eq.</tspan>
</text>
</svg>
