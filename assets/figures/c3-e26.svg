<tspan x="357.6" y="484.226">τₒ = 100 ns: bound = 0.34</tspan>
</text>
<rect id="o037" x="796.8" y="144" width="446.4" height="374.4" rx="29.952" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o038" font-family="Arial,sans-serif" font-size="17.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="810.24" y="165.893">A maximum needs an observer</tspan>
</text>
<text id="o039" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="813.12" y="207.04">p_obs(t) = (1/A_oτₒ) ∫∫ (p − p_ref) dA dξ</tspan>
</text>
<text id="o040" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="813.12" y="265.733">0 ≤ p_obs ≤ J_rec / (Aₒ τₒ)</tspan>
</text>
<text id="o041" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="813.12" y="321.693">valid for nonnegative excess pressure, negligible</tspan>
<tspan x="813.12" y="339.787">normal viscous stress and the full-event footprint</tspan>
<tspan x="813.12" y="357.88">impulse J_rec</tspan>
</text>
<text id="o042" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="813.12" y="437.44">Same pulse, three observers: the reported peak</tspan>
<tspan x="813.12" y="456.32">changes by a factor 3 with the window alone.</tspan>
</text>
<text id="o043" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="591.04">Dashed horizontal lines are the bound J_rec/(A_oτₒ) for each window (the 10 ns bound lies above the plot). Quote location, footprint</tspan>
<tspan x="97.92" y="609.92">and window with any value.</tspan>
</text>
<text id="o044" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Observer and bound of Eq. C3-E26 for the declared rectangular pulse.</tspan>
</text>
