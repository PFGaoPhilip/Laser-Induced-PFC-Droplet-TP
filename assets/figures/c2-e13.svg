<tspan x="829.44" y="166.44">A reference, not a reservoir</tspan>
</text>
<text id="o051" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="853.44" y="207.587">Water is the matched-temperature</tspan>
<tspan x="853.44" y="227.253">comparison: 0.12 bar at 323 K against 2.05</tspan>
<tspan x="853.44" y="246.92">bar for PFP.</tspan>
</text>
<ellipse id="o052" cx="838.08" cy="202.333" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o053" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="853.44" y="278.187">Each water branch is valid only inside its</tspan>
<tspan x="853.44" y="297.853">own interval, 273–303 K and 304–333 K.</tspan>
</text>
<ellipse id="o054" cx="838.08" cy="272.933" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o055" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="853.44" y="328.453">The formulas give equilibrium values; they</tspan>
<tspan x="853.44" y="348.12">do not promise that vapor is available.</tspan>
</text>
<ellipse id="o056" cx="838.08" cy="323.2" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o057" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="617.507">Both correlations use log₁₀(p / 10⁵ Pa) = A − B / (T − C) with different A, B, C for each substance and branch.</tspan>
</text>
<text id="o058" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Correlations of Eqs. C2-E12 and C2-E13 (log scale).</tspan>
</text>
