<tspan x="265.92" y="360.501">1/e at t = τ_KV</tspan>
</text>
<rect id="o038" x="739.2" y="144" width="504" height="384" rx="30.72" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o039" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="752.64" y="166.44">Kelvin–Voigt dashpot in shear</tspan>
</text>
<text id="o040" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="755.52" y="208.133">Tₛₕ = G_g γ + η_g γ̇</tspan>
</text>
<text id="o041" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="755.52" y="260.387">Tₛₕ = 0:  γ̇ = −(G_g/η_g) γ</tspan>
</text>
<text id="o042" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="755.52" y="313.187">γ = γ₀ exp(−t/τ_KV),   τ_KV = η_g/G_g</tspan>
</text>
<text id="o043" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="755.52" y="371.333">τ_KV = 0.010 / 20 000 = 0.50 µs</tspan>
</text>
<text id="o044" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="755.52" y="427.293">This is the recovery time after unloading; it is not a</tspan>
<tspan x="755.52" y="445.387">relaxation time for stress under constant strain.</tspan>
</text>
<text id="o045" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="617.507">A Kelvin–Voigt solid recovers strain exponentially; it cannot relax stress at constant strain, so τ_KV must not be reused as τᵣₑₗ.</tspan>
</text>
<text id="o046" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Linear constitutive check of Eq. A-E17 (G_g = 20 kPa, η_g = 0.010 Pa s).</tspan>
</text>
</svg>
