<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1279.97 720" role="img">
<title>C3-E30</title>
<defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/></marker></defs>
<rect width="1279.97" height="720" fill="#142632"/>
<text id="o000" font-family="Arial,sans-serif" font-size="25.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="30.72" y="35.1733">C3-E30 · Worked finite jet mass, speed and pressure scales</tspan>
</text>
<text id="o001" font-family="Arial,sans-serif" font-size="18.6667" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="49.92" y="113.227">The declared jet drawn to scale (10 µm diameter, 50 µm long)</tspan>
</text>
<rect id="o002" x="76.8" y="172.8" width="480" height="96" fill="#1E4A5A" stroke="#8EDBD4" stroke-width="3.2" opacity="1"/>
<line id="o003" x1="566.4" y1="220.8" x2="662.4" y2="220.8" fill="#FFFFFF" stroke="#F2B880" stroke-width="5.33333" opacity="1" marker-end="url(#head)"/>
<text id="o004" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="577.92" y="193.733">Uⱼ</tspan>
</text>
<line id="o005" x1="76.8" y1="302.4" x2="556.8" y2="302.4" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="1.73333" opacity="1"/>
<line id="o006" x1="76.8" y1="295.68" x2="76.8" y2="309.12" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="1.73333" opacity="1"/>
<line id="o007" x1="556.8" y1="295.68" x2="556.8" y2="309.12" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="1.73333" opacity="1"/>
<text id="o008" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="316.8" y="288.64">Lⱼ = 50 µm</tspan>
</text>
<line id="o009" x1="62.4" y1="172.8" x2="62.4" y2="268.8" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="1.73333" opacity="1"/>
<text id="o010" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="78.72" y="148.893">dⱼ = 10 µm (cylinder height)</tspan>
</text>
<rect id="o011" x="48" y="355.2" width="225.6" height="240" rx="18.048" fill="#213E4B" stroke="#7FC8F8" stroke-width="2.13333" opacity="1"/>
<text id="o012" font-family="Arial,sans-serif" font-size="16.6667" fill="#7FC8F8" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="161.28" y="378.467">mass</tspan>
</text>
<text id="o013" font-family="Arial,sans-serif" font-size="14.6667" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="161.28" y="426.747">mⱼ = ρ π dⱼ² Lⱼ / 4</tspan>
</text>
<text id="o014" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="161.28" y="514.787">3.927 ng</tspan>
</text>
<rect id="o015" x="288" y="355.2" width="225.6" height="240" rx="18.048" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o016" font-family="Arial,sans-serif" font-size="16.6667" fill="#8EDBD4" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="401.28" y="378.467">speed</tspan>
</text>
<text id="o017" font-family="Arial,sans-serif" font-size="14.6667" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="401.28" y="426.747">Uⱼ = √(2Eⱼ/mⱼ), Eⱼ = 2 nJ</tspan>
</text>
<text id="o018" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="401.28" y="514.787">31.915 m/s</tspan>
</text>
<rect id="o019" x="528" y="355.2" width="225.6" height="240" rx="18.048" fill="#213E4B" stroke="#F2B880" stroke-width="2.13333" opacity="1"/>
<text id="o020" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="641.28" y="378.467">dynamic pressure</tspan>
</text>
<text id="o021" font-family="Arial,sans-serif" font-size="14.6667" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="641.28" y="426.747">qⱼ = ½ρUⱼ²</tspan>
</text>
<text id="o022" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="641.28" y="514.787">0.5093 MPa</tspan>
</text>
<rect id="o023" x="768" y="355.2" width="225.6" height="240" rx="18.048" fill="#213E4B" stroke="#F28BA0" stroke-width="2.13333" opacity="1"/>
<text id="o024" font-family="Arial,sans-serif" font-size="16.6667" fill="#F28BA0" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="881.28" y="378.467">early rigid contact</tspan>
</text>
<text id="o025" font-family="Arial,sans-serif" font-size="14.6667" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="881.28" y="426.747">ρ c Uⱼ (c = 1480 m/s)</tspan>
</text>
<text id="o026" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="881.28" y="514.787">47.23 MPa</tspan>
</text>
<rect id="o027" x="1008" y="355.2" width="225.6" height="240" rx="18.048" fill="#213E4B" stroke="#A8E6A1" stroke-width="2.13333" opacity="1"/>
<text id="o028" font-family="Arial,sans-serif" font-size="16.6667" fill="#A8E6A1" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="1121.28" y="378.467">momentum</tspan>
</text>
<text id="o029" font-family="Arial,sans-serif" font-size="14.6667" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="1121.28" y="426.747">Pⱼ = mⱼ Uⱼ;  25 jets: 25 Pⱼ</tspan>
</text>
<text id="o030" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="1121.28" y="514.787">1.2533×10⁻¹⁰ N s;</tspan>
<tspan x="1121.28" y="534.453">3.1333×10⁻⁹ N s</tspan>
</text>
<text id="o031" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="731.52" y="198.533">The state carried into Chapter 4 includes mass, energy</tspan>
<tspan x="731.52" y="218.987">and momentum, not a pressure peak alone.</tspan>
</text>
<text id="o032" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Worked finite jet of Eq. C3-E30 (ρ = 1000 kg/m³, uniform direction, full activation, independent cells).</tspan>
</text>
</svg>
