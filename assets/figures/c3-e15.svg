<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1279.97 720" role="img">
<title>C3-E15</title>
<defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/></marker></defs>
<rect width="1279.97" height="720" fill="#142632"/>
<text id="o000" font-family="Arial,sans-serif" font-size="25.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="30.72" y="35.1733">C3-E15 · Normal stress and material Bernoulli condition</tspan>
</text>
<rect id="o001" x="38.4" y="96" width="384" height="422.4" rx="30.72" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o002" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="51.84" y="118.44">Cavity (gas inside liquid)</tspan>
</text>
<ellipse id="o003" cx="230.4" cy="297.6" rx="81.6" ry="81.6" fill="#0C1820" stroke="#F2B880" stroke-width="2.93333" opacity="1"/>
<line id="o004" x1="292.909" y1="245.149" x2="252.462" y2="279.088" fill="#FFFFFF" stroke="#F28BA0" stroke-width="4" opacity="1" marker-end="url(#head)"/>
<line id="o005" x1="167.891" y1="245.149" x2="208.338" y2="279.088" fill="#FFFFFF" stroke="#F28BA0" stroke-width="4" opacity="1" marker-end="url(#head)"/>
<line id="o006" x1="202.491" y1="374.279" x2="220.55" y2="324.663" fill="#FFFFFF" stroke="#F28BA0" stroke-width="4" opacity="1" marker-end="url(#head)"/>
<text id="o007" font-family="Arial,sans-serif" font-size="16" fill="#F28BA0" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="59.52" y="418.24">n points into the gas</tspan>
</text>
<text id="o008" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="59.52" y="461.987">κ = −2/R,  pₗ = p_g − 2σ/R</tspan>
</text>
<text id="o009" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="59.52" y="499.84">R = 10 µm: −2σ/R = -14.4 kPa</tspan>
</text>
<rect id="o010" x="441.6" y="96" width="384" height="422.4" rx="30.72" fill="#213E4B" stroke="#F2B880" stroke-width="2.13333" opacity="1"/>
<text id="o011" font-family="Arial,sans-serif" font-size="18" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="455.04" y="118.44">Liquid jet (liquid inside gas)</tspan>
</text>
<rect id="o012" x="537.6" y="182.4" width="192" height="163.2" fill="#1E4A5A" stroke="#8EDBD4" stroke-width="3.2" opacity="1"/>
<line id="o013" x1="537.6" y1="345.6" x2="729.6" y2="345.6" fill="#FFFFFF" stroke="#8EDBD4" stroke-width="3.2" opacity="1"/>
<line id="o014" x1="576" y1="182.4" x2="576" y2="129.6" fill="#FFFFFF" stroke="#F28BA0" stroke-width="4" opacity="1" marker-end="url(#head)"/>
<line id="o015" x1="691.2" y1="182.4" x2="691.2" y2="129.6" fill="#FFFFFF" stroke="#F28BA0" stroke-width="4" opacity="1" marker-end="url(#head)"/>
<text id="o016" font-family="Arial,sans-serif" font-size="16" fill="#F28BA0" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="462.72" y="418.24">n points out into the gas</tspan>
</text>
<text id="o017" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="462.72" y="461.987">κ = +1/aⱼ,  pₗ = p_g + σ/aⱼ</tspan>
</text>
<text id="o018" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="462.72" y="499.84">aⱼ = 5 µm: +σ/aⱼ = +14.4 kPa</tspan>
</text>
<rect id="o019" x="844.8" y="96" width="398.4" height="422.4" rx="31.872" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o020" font-family="Arial,sans-serif" font-size="17.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="858.24" y="117.893">Dynamic condition on Γ</tspan>
</text>
<text id="o021" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="861.12" y="159.587">pₗ = p_g + σκ,   κ = ∇ₛ·n</tspan>
</text>
<text id="o022" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="861.12" y="226.787">Dφ_Γ/Dt = ½|∇φ|² + (p∞ − p_g − σκ)/ρ</tspan>
</text>
<text id="o023" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="861.12" y="322.24">D/Dt = ∂ₜ + u·∇ follows the moving surface</tspan>
<tspan x="861.12" y="341.12">point.</tspan>
</text>
<text id="o024" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="861.12" y="399.04">A wrong sign of κ reverses the capillary</tspan>
<tspan x="861.12" y="417.92">pressure and the surface evolution.</tspan>
</text>
<text id="o025" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="49.92" y="563.333">Same σ, opposite signs: a concave-to-liquid cavity lowers the liquid pressure; a liquid cylinder raises it.</tspan>
</text>
<text id="o026" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Signed curvature and material Bernoulli condition of Eq. C3-E15 (σ = 0.072 N/m for the example).</tspan>
</text>
</svg>
