<tspan x="935.04" y="165.893">Formulas</tspan>
</text>
<text id="o048" font-family="Arial,sans-serif" font-size="14" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="933.12" y="205.4">pₑₗ = (G_g/2)[5 − 4R_ref/R − (R_ref/R)⁴]</tspan>
</text>
<text id="o049" font-family="Arial,sans-serif" font-size="14" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="933.12" y="301.4">W_g = 2πG_g[5R³/3 − 2R_refR² + R_ref⁴/R</tspan>
<tspan x="933.12" y="317.92">− 2R_ref³/3]</tspan>
</text>
<text id="o050" font-family="Arial,sans-serif" font-size="14.6667" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="933.12" y="426.747">pressure saturates; work keeps growing</tspan>
<tspan x="933.12" y="444.053">as R³</tspan>
</text>
<text id="o051" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="591.587">Defence 2: resistance pressure and elastic work answer different parts of the feasibility question: a modest pressure can still</tspan>
<tspan x="97.92" y="611.253">cost a finite work.</tspan>
</text>
