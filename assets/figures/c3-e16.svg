<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1279.97 720" role="img">
<title>Scientific schematic</title>
<defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/></marker></defs>
<rect width="1279.97" height="720" fill="#142632"/>
<text id="o000" font-family="Arial,sans-serif" font-size="28" fill="#8EDBD4" text-anchor="start" opacity="1">
<tspan x="31.68" y="40.04">C3-E16 · Pressure-impulse control and distinct focusing budgets</tspan>
</text>
<rect id="o001" x="105.6" y="148.8" width="960" height="105.6" fill="#213E4B" stroke="#B4C7D2" stroke-width="2" opacity="1"/>
<line id="o002" x1="134.4" y1="201.6" x2="1036.8" y2="201.6" fill="#FFFFFF" stroke="#8EDBD4" stroke-width="2.66667" opacity="1" marker-end="url(#head)"/>
<text id="o003" font-family="Arial,sans-serif" font-size="25.3333" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="108.48" y="121.027">z = 0: Π = Π₀</tspan>
</text>
<text id="o004" font-family="Arial,sans-serif" font-size="25.3333" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="799.68" y="121.027">z = L: Π = 0</tspan>
</text>
<text id="o005" font-family="Arial,sans-serif" font-size="24" fill="#8EDBD4" text-anchor="start" opacity="1">
<tspan x="252.48" y="322.32">Δu = −∇Π/ρ; Π decreases in the launch direction.</tspan>
</text>
<line id="o006" x1="28.8" y1="417.6" x2="1248" y2="417.6" fill="#FFFFFF" stroke="#405967" stroke-width="1.33333" opacity="1"/>
<text id="o007" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="36.48" y="446.567">• Π₀ at z = 0 source</tspan>
</text>
<text id="o008" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="655.68" y="446.567">• Π = 0 at z = L free end</tspan>
</text>
<text id="o009" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="36.48" y="471.047">• A column area; L length</tspan>
</text>
<text id="o010" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="655.68" y="471.047">• Π(z), ∇Π → Δu</tspan>
</text>
<text id="o011" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="36.48" y="495.527">• U = Π₀/(ρL)</tspan>
</text>
<text id="o012" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="655.68" y="495.527">• m = ρAL; J = Π₀A</tspan>
</text>
<text id="o013" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="36.48" y="520.007">• E, fixed J vs fixed E</tspan>
</text>
<text id="o014" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="655.68" y="520.007">• p, p_ref, x, t₀, τ_p, t</tspan>
</text>
<text id="o015" font-family="Arial,sans-serif" font-size="15.3333" fill="#8EDBD4" text-anchor="start" opacity="1">
<tspan x="36.48" y="606.407">Fixed impulse per area is not fixed total impulse</tspan>
</text>
<text id="o016" font-family="Arial,sans-serif" font-size="15.3333" fill="#8EDBD4" text-anchor="start" opacity="1">
<tspan x="36.48" y="635.207">At fixed total impulse, lower mass needs more energy</tspan>
</text>
<text id="o017" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="36.48" y="696.187">Model schematic; geometry is not to scale.</tspan>
</text>
</svg>
