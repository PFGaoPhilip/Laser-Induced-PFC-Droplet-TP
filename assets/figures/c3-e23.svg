<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" role="img" aria-labelledby="title desc">
<title id="title">C3-E23 — Steady force follows from momentum flux, rather than assigning dynamic pressure everywhere.</title>
<desc id="desc">U_j incident jet speed; A_j incident area; ρ liquid; ṁ = ρA_jU_j; q_j dynamic-pressure scale; F_steady receiver force; Lateral outlet carries zero axial momentum; q_j is a scale, not a universal mean or local traction; A moving receiver changes relative speed and force</desc>
