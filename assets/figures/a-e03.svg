<text id="o038" font-family="Arial,sans-serif" font-size="15.3333" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="228.48" y="196.838">area to ∞ = 1.0831  ⇒  pₑₗ = 2G_g·area = 43.326 kPa</tspan>
</text>
<rect id="o039" x="739.2" y="144" width="504" height="384" rx="30.72" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o040" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="752.64" y="166.44">Radial force balance</tspan>
</text>
<text id="o041" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="755.52" y="208.133">dTᵣᵣ/dr = (2/r)(T_θθ − Tᵣᵣ)</tspan>
</text>
<text id="o042" font-family="Arial,sans-serif" font-size="16" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="755.52" y="259.84">Tᵣᵣ(∞) = −p_∞,   Tᵣᵣ(R) = −p_b + 2σ/R</tspan>
</text>
<text id="o043" font-family="Arial,sans-serif" font-size="16" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="755.52" y="312.64">pₑₗ = p_b − p_∞ − 2σ/R = 2G_g ∫_R^∞ [...] dr/r</tspan>
</text>
<text id="o044" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="755.52" y="384.64">Integrating the balance from the wall to infinity</tspan>
<tspan x="755.52" y="403.52">collects all the elastic resistance.</tspan>
</text>
<text id="o045" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="617.507">The shaded area is the accumulated resistance; later figures evaluate it in closed form.</tspan>
</text>
<text id="o046" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Static balance of Eq. A-E03, integral evaluated numerically to 400R; closed form 43.326 kPa.</tspan>
</text>
</svg>
