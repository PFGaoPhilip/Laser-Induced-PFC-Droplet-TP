<text id="o009" font-family="Arial,sans-serif" font-size="16" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="136.32" y="166.022">liquid: steep gradient</tspan>
<tspan x="136.32" y="184.902">(larger qₗ)</tspan>
</text>
<text id="o010" font-family="Arial,sans-serif" font-size="16" fill="#8EDBD4" text-anchor="start" opacity="1">
<tspan x="458.88" y="166.022">vapor: gentle gradient</tspan>
<tspan x="458.88" y="184.902">(smaller qᵥ)</tspan>
</text>
<line id="o011" x1="249.6" y1="425.891" x2="387.84" y2="425.891" fill="#FFFFFF" stroke="#F2B880" stroke-width="4.66667" opacity="1" marker-end="url(#head)"/>
<line id="o012" x1="418.56" y1="425.891" x2="556.8" y2="425.891" fill="#FFFFFF" stroke="#8EDBD4" stroke-width="2.66667" opacity="1" marker-end="url(#head)"/>
<text id="o013" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="243.84" y="405.347">qₗ·n</tspan>
</text>
<text id="o014" font-family="Arial,sans-serif" font-size="16.6667" fill="#8EDBD4" text-anchor="start" opacity="1">
<tspan x="458.88" y="405.347">qᵥ·n</tspan>
</text>
<rect id="o015" x="739.2" y="144" width="504" height="364.8" rx="29.184" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o016" font-family="Arial,sans-serif" font-size="17.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="752.64" y="165.893">Heat that is not passed on becomes latent heat</tspan>
</text>
<text id="o017" font-family="Arial,sans-serif" font-size="18.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="755.52" y="209.227">jₛ Lᵥ,s = (qₗ − qᵥ)·n</tspan>
</text>
<text id="o018" font-family="Arial,sans-serif" font-size="16.6667" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="755.52" y="265.187">Lᵥ,s = hᵥ,s − hₗ,s &gt; 0 (J/kg)</tspan>
</text>
<text id="o019" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="755.52" y="318.813">qₗ·n arriving</tspan>
</text>
<rect id="o020" x="945.6" y="302.4" width="144" height="30.72" fill="#F2B880" stroke="#F2B880" stroke-width="1.33333" opacity="0.85"/>
<text id="o021" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="1099.2" y="321.693">1000 W/m²</tspan>
</text>
<text id="o022" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="755.52" y="362.973">qᵥ·n leaving</tspan>
</text>
<rect id="o023" x="945.6" y="346.56" width="28.8" height="30.72" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="0.85"/>
<text id="o024" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="984" y="365.853">200 W/m²</tspan>
</text>
<text id="o025" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="755.52" y="407.133">j Lᵥ = difference</tspan>
</text>
<rect id="o026" x="945.6" y="390.72" width="115.2" height="30.72" fill="#F28BA0" stroke="#F28BA0" stroke-width="1.33333" opacity="0.85"/>
<text id="o027" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="1070.4" y="410.013">800 W/m²</tspan>
</text>
<text id="o028" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="586.787">Fourier law on each side: q_η = −k_η ∇T_η, η = l, v. Signs are fixed by n pointing liquid → vapor.</tspan>
</text>
<text id="o029" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="97.92" y="634.787">Example: 800 W/m² of unbalanced heat with Lᵥ = 95 kJ/kg evaporates j = 8.4 g m⁻² s⁻¹. Fluxes shown are illustrative.</tspan>
</text>
<text id="o030" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Reduced energy jump of Eq. C2-E21.</tspan>
</text>
</svg>
