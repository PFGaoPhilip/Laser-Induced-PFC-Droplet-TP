<tspan x="733.44" y="166.44">From potential to G</tspan>
</text>
<text id="o037" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="736.32" y="202.787">A_c = π b²,   dA_c/db = 2π b</tspan>
</text>
<text id="o038" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="736.32" y="255.587">(d𝒫/db)_{p₀} = −6π p₀² b⁵ / (384 D_f)</tspan>
</text>
<text id="o039" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="736.32" y="308.387">G = −(d𝒫/db) / (dA_c/db)</tspan>
</text>
<text id="o040" font-family="Arial,sans-serif" font-size="20" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="736.32" y="368.72">Gₚ₀ = p₀² b⁴ / (128 D_f)</tspan>
</text>
<text id="o041" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="736.32" y="437.44">Pressure squared times radius to the fourth.</tspan>
</text>
<text id="o042" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="591.587">𝒫 ∝ b⁶ falls faster as the blister grows: at fixed pressure each increment of area releases more energy.</tspan>
</text>
<text id="o043" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Energy-release rate of Eq. C4-E20 (curve is −b⁶ normalised, schematic of the b⁶ dependence).</tspan>
</text>
