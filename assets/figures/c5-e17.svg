<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 616" role="img" aria-labelledby="title desc">
<title id="title">C5-E17 — Kelvin–Voigt strain recovery illustrates what its parameter ratio means and what it does not mean.</title>
<desc id="desc">Tsh = 0 after unloading; γ₀ → γ(t); Gg, ηg; τKV = ηg/Gg; γ̇, t; Zero-stress strain recovery is not held-strain stress relaxation; No periodic forcing is assumed</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#8edbd4"/></marker></defs>
<rect width="980" height="616" rx="8" fill="#142632"/>
<style>text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#e7f0f3;font-size:20px}.muted{fill:#b4c7d2;font-size:17px}.accent{fill:#8edbd4}.line{fill:none;stroke:#8edbd4;stroke-width:3}.thin{fill:none;stroke:#b4c7d2;stroke-width:2}.arrow{fill:none;stroke:#8edbd4;stroke-width:3;marker-end:url(#arrow)}.area{fill:#213e4b;stroke:#b4c7d2;stroke-width:2}</style>
<text x="28" y="36" class="accent">C5-E17 · Physical variable map / 物理变量图</text>
<text x="99" y="98" class="">Time definitions / 时间定义</text>
<rect x="109" y="117" width="560" height="38" class="area"/>
<text x="129" y="142" class="">τKV = ηg/Gg</text>
<path d="M109 167 H669" class="thin"/>
<text x="110" y="334" class="muted">Equal boxes identify definitions, not a time ratio / 等宽框列定义，不代表时间比</text>
<path d="M28 356 H952" stroke="#405967"/>
<text x="30" y="382" class="muted">Variables in this equation / 本式变量</text>
<text x="30" y="409" class="muted">• Tsh = 0 after unloading</text>
<text x="30" y="433" class="muted">• γ₀ → γ(t)</text>
<text x="30" y="457" class="muted">• Gg, ηg</text>
<text x="30" y="481" class="muted">• τKV = ηg/Gg</text>
<text x="30" y="505" class="muted">• γ̇, t</text>
<text x="30" y="547" class="muted">Zero-stress strain recovery is not held-strain stress relaxation</text>
<text x="30" y="570" class="muted">No periodic forcing is assumed</text>
</svg>
