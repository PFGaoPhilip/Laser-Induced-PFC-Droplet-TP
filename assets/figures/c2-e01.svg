<text id="o065" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="871.593" y="443.542">r = w:  F = F₀ e⁻² = 0.135 F₀</tspan>
</text>
<text id="o066" font-family="Arial,sans-serif" font-size="17.3333" fill="#8EDBD4" text-anchor="start" opacity="1">
