<tspan x="175.68" y="221.213">j: source</tspan>
</text>
<text id="o004" font-family="Arial,sans-serif" font-size="22.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="857.28" y="221.213">i: receiver</tspan>
</text>
