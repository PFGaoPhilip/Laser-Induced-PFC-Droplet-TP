<text id="o026" font-family="Arial,sans-serif" font-size="17.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="808.32" y="116.933">P² ≤ 2mE: the allowed region</tspan>
</text>
<rect id="o027" x="38.4" y="96" width="739.2" height="182.4" rx="14.592" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o028" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="51.84" y="118.44">Bounds from finite mass</tspan>
</text>
<text id="o029" font-family="Arial,sans-serif" font-size="18.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="54.72" y="161.227">Uᵣₘₛ ≤ √(2Eₐᵥₐᵢₗ / mⱼ),    Pⱼ² ≤ 2 mⱼ Eⱼ</tspan>
</text>
<rect id="o030" x="38.4" y="297.6" width="739.2" height="163.2" rx="13.056" fill="#213E4B" stroke="#F2B880" stroke-width="2.13333" opacity="1"/>
<text id="o031" font-family="Arial,sans-serif" font-size="18" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="51.84" y="320.04">Growth during flight</tspan>
</text>
<text id="o032" font-family="Arial,sans-serif" font-size="18.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="54.72" y="362.827">δₐᵣᵣ / a₀ = (δ₀/a₀) exp(gₘₐₓ H / Uⱼ)</tspan>
</text>
<text id="o033" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="54.72" y="418.24">gₘₐₓ is the fastest inviscid growth rate of a cylinder.</tspan>
</text>
<text id="o034" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="40.32" y="529.733">Speed, focusing and survival must all refer to the same emitted liquid state: the same mⱼ, Eⱼ and Uⱼ.</tspan>
</text>
<text id="o035" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="40.32" y="586.787">Teaching case: mⱼ = 3.927 ng, Eⱼ = 2 nJ gives Uᵣₘₛ ≤ 31.9 m/s and Pⱼ ≤ 1.253×10⁻¹⁰ N s; flight 3.13 µs → δ/a₀ grows from 1 % to 2.26 %.</tspan>
</text>
<text id="o036" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Reference formulas of the Defence 2 answer: Eqs. C3-E18, E21, E22.</tspan>
</text>
</svg>
