<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1279.97 720" role="img">
<title>A-E21</title>
<defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/></marker></defs>
<rect width="1279.97" height="720" fill="#142632"/>
<text id="o000" font-family="Arial,sans-serif" font-size="25.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="30.72" y="35.1733">A-E21 · Original radial control recalled</tspan>
</text>
<text id="o001" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="49.92" y="112.68">Recalled radial control: expansion and resistance, not an outlet</tspan>
</text>
<text id="o002" font-family="Arial,sans-serif" font-size="21.3333" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="638.4" y="163.413">ρ_g(RR̈ + 3Ṙ²/2) = p_b − p_∞ − 2σ/R − pₑₗ(R) − 4η_gṘ/R</tspan>
</text>
<rect id="o003" x="48" y="240" width="225.6" height="163.2" rx="13.056" fill="#213E4B" stroke="#7FC8F8" stroke-width="2.13333" opacity="1"/>
<text id="o004" font-family="Arial,sans-serif" font-size="17.3333" fill="#7FC8F8" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="61.44" y="261.893">inertia</tspan>
</text>
<text id="o005" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="161.28" y="316.893">ρ_g(RR̈ + 3Ṙ²/2)</tspan>
</text>
<rect id="o006" x="288" y="240" width="225.6" height="163.2" rx="13.056" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o007" font-family="Arial,sans-serif" font-size="17.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="301.44" y="261.893">driving</tspan>
</text>
<text id="o008" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="401.28" y="316.893">p_b − p_∞</tspan>
</text>
<rect id="o009" x="528" y="240" width="225.6" height="163.2" rx="13.056" fill="#213E4B" stroke="#F2B880" stroke-width="2.13333" opacity="1"/>
<text id="o010" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="541.44" y="261.893">capillary</tspan>
</text>
<text id="o011" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="641.28" y="316.893">2σ/R</tspan>
</text>
<rect id="o012" x="768" y="240" width="225.6" height="163.2" rx="13.056" fill="#213E4B" stroke="#F28BA0" stroke-width="2.13333" opacity="1"/>
<text id="o013" font-family="Arial,sans-serif" font-size="17.3333" fill="#F28BA0" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="781.44" y="261.893">elastic</tspan>
</text>
<text id="o014" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="881.28" y="316.893">pₑₗ(R)</tspan>
</text>
<rect id="o015" x="1008" y="240" width="225.6" height="163.2" rx="13.056" fill="#213E4B" stroke="#A8E6A1" stroke-width="2.13333" opacity="1"/>
<text id="o016" font-family="Arial,sans-serif" font-size="17.3333" fill="#A8E6A1" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="1021.44" y="261.893">viscous</tspan>
</text>
<text id="o017" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="1121.28" y="316.893">4η_gṘ/R</tspan>
</text>
<rect id="o018" x="48" y="432" width="576" height="168" rx="13.44" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o019" font-family="Arial,sans-serif" font-size="17.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="61.44" y="453.893">What it describes</tspan>
</text>
<text id="o020" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="64.32" y="495.04">Spherical expansion of a cavity and the resistance of the gel to</tspan>
<tspan x="64.32" y="513.92">it.</tspan>
</text>
<rect id="o021" x="652.8" y="432" width="576" height="168" rx="13.44" fill="#213E4B" stroke="#F28BA0" stroke-width="2.13333" opacity="1"/>
<text id="o022" font-family="Arial,sans-serif" font-size="17.3333" fill="#F28BA0" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="666.24" y="453.893">What it cannot do</tspan>
</text>
<text id="o023" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="669.12" y="495.04">It does not manufacture an outlet: no hole, no jet exit, no</tspan>
<tspan x="669.12" y="513.92">directional flow.</tspan>
</text>
<text id="o024" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Original answer recalled: Eq. A-E11 (Defence 1).</tspan>
</text>
</svg>
