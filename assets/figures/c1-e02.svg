<tspan x="805.76" y="451.973">u(2R) = Ṙ/4</tspan>
</text>
<text id="o050" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="636.16" y="171.299">r²u / (R²Ṙ) = 1 on every shell</tspan>
</text>
<text id="o051" font-family="Arial,sans-serif" font-size="17.3333" fill="#8EDBD4" text-anchor="start" opacity="1">
<tspan x="902.4" y="358.585">u / Ṙ = (R/r)²</tspan>
</text>
<text id="o052" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="587.52" y="635.333">From ∇·u = 0: r²u = C(t). The wall condition u(R) = Ṙ gives C =</tspan>
<tspan x="587.52" y="655.787">R²Ṙ.</tspan>
</text>
<text id="o053" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
