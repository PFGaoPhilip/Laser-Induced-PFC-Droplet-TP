<text id="o046" font-family="Arial,sans-serif" font-size="14.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="961.92" y="205.947">w = p₀(b² − r²)² / (64 D_f)</tspan>
</text>
<text id="o047" font-family="Arial,sans-serif" font-size="14.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
