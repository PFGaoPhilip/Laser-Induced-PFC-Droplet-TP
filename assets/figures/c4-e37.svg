</text>
<text id="o048" font-family="Arial,sans-serif" font-size="14.6667" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="961.92" y="340.347">p₀,crit = √(128 D_f Γ) / b²</tspan>
</text>
<text id="o049" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="591.587">Defence 2: the 156 kPa threshold belongs to this plate, this clamp, this interface energy and a maintained-pressure source.</tspan>
</text>
<text id="o050" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="97.92" y="639.04">Change the loading control (fixed volume) or the geometry and the threshold changes.</tspan>
</text>
