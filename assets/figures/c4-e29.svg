<title id="title">C4-E29 — Declared coupling converts incoming jet budgets into conditional payload budgets.</title>
<desc id="desc">A_f = 1 mm² — intended release; h_f = 1 μm — payload thickness; ρ_f = 2330 kg/m³ → m_f = 2.33 μg; η_E = 0.20 → E_solid = 10 nJ; η_I = 0.50 → I_net = 1.5666×10⁻⁹ N s; E_in, I_in — incoming array; Load-path coupling fractions are assumptions.; This payload differs from the blister benchmark.</desc>
