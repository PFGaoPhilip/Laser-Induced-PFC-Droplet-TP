<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1279.97 720" role="img">
<title>C4-E29</title>
<defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/></marker></defs>
<rect width="1279.97" height="720" fill="#142632"/>
<text id="o000" font-family="Arial,sans-serif" font-size="25.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="30.72" y="35.1733">C4-E29 · Explicit conditional solid-coupling allocation</tspan>
</text>
<text id="o001" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="49.92" y="112.68">Declared coupling turns jet budgets into payload budgets</tspan>
</text>
<rect id="o002" x="48" y="153.6" width="244.8" height="105.6" rx="8.448" fill="#213E4B" stroke="#F2B880" stroke-width="2.13333" opacity="1"/>
<text id="o003" font-family="Arial,sans-serif" font-size="18" fill="#F2B880" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="170.4" y="176.04">jet energy</tspan>
</text>
<text id="o004" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="170.4" y="203.627">Eᵢₙ = 50 nJ</tspan>
</text>
<line id="o005" x1="295.68" y1="206.4" x2="376.32" y2="206.4" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="2.93333" opacity="1" marker-end="url(#head)"/>
<rect id="o006" x="379.2" y="153.6" width="244.8" height="105.6" rx="8.448" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o007" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="501.6" y="176.04">× η_E = 0.20</tspan>
</text>
<text id="o008" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="501.6" y="203.627">E_solid = 10.0 nJ</tspan>
</text>
<rect id="o009" x="662.4" y="153.6" width="244.8" height="105.6" rx="8.448" fill="#213E4B" stroke="#F28BA0" stroke-width="2.13333" opacity="1"/>
<text id="o010" font-family="Arial,sans-serif" font-size="18" fill="#F28BA0" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="784.8" y="176.04">jet impulse</tspan>
</text>
<text id="o011" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="784.8" y="203.627">Iᵢₙ = 3.1333 nN s</tspan>
</text>
<line id="o012" x1="910.08" y1="206.4" x2="990.72" y2="206.4" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="2.93333" opacity="1" marker-end="url(#head)"/>
<rect id="o013" x="993.6" y="153.6" width="244.8" height="105.6" rx="8.448" fill="#213E4B" stroke="#7FC8F8" stroke-width="2.13333" opacity="1"/>
<text id="o014" font-family="Arial,sans-serif" font-size="18" fill="#7FC8F8" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="1116" y="176.04">× η_I = 0.50</tspan>
</text>
<text id="o015" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="1116" y="203.627">Iₙₑₜ = 1.5666 nN s</tspan>
</text>
<rect id="o016" x="48" y="307.2" width="576" height="220.8" rx="17.664" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o017" font-family="Arial,sans-serif" font-size="17.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="61.44" y="329.093">The film mass</tspan>
</text>
<rect id="o018" x="96" y="393.6" width="192" height="21.12" fill="#3A5362" stroke="#B4C7D2" stroke-width="1.86667" opacity="1"/>
<text id="o019" font-family="Arial,sans-serif" font-size="14.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="309.12" y="373.947">A_f = 1.00 mm² = 1.00×10⁻⁶ m²</tspan>
<tspan x="309.12" y="391.253">h_f = 1.00 µm, ρ_f = 2330 kg/m³</tspan>
</text>
<text id="o020" font-family="Arial,sans-serif" font-size="15.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="64.32" y="475.293">m_f = ρ_f A_f h_f = (2330)(1.00×10⁻⁶)(1.00×10⁻⁶) = 2.33×10⁻⁹ kg</tspan>
</text>
<rect id="o021" x="652.8" y="307.2" width="576" height="220.8" rx="17.664" fill="#213E4B" stroke="#F2B880" stroke-width="2.13333" opacity="1"/>
<text id="o022" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="666.24" y="329.093">What the factors mean</tspan>
</text>
<text id="o023" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="690.24" y="370.24">η_E, η_I are declared fractions of energy and impulse that</tspan>
<tspan x="690.24" y="389.12">reach the film.</tspan>
</text>
<ellipse id="o024" cx="674.88" cy="365.12" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o025" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="690.24" y="418.88">They are assumptions, not predictions of the model.</tspan>
</text>
<ellipse id="o026" cx="674.88" cy="413.76" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o027" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="49.92" y="572.933">Conditional budgets: every later pass or fail depends on η_E = 0.20 and η_I = 0.50.</tspan>
</text>
<text id="o028" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Coupling allocation of Eq. C4-E29 (declared teaching values).</tspan>
</text>
</svg>
