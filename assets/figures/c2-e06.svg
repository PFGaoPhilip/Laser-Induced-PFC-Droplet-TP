<rect id="o034" x="816" y="144" width="427.2" height="384" rx="30.72" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o035" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="829.44" y="166.44">Each factor acts once</tspan>
</text>
<text id="o036" font-family="Arial,sans-serif" font-size="16.6667" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="832.32" y="207.587">f_geo = 1 − e^(−2(10/20)²) = 0.3935</tspan>
</text>
<text id="o037" font-family="Arial,sans-serif" font-size="16.6667" fill="#7FC8F8" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="832.32" y="260.387">A_λ = (1 − 0.10)(1 − e^(−1)) = 0.5689</tspan>
</text>
<text id="o038" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="832.32" y="313.733">E_abs = f_geo A_λ E_L = 223.8 nJ</tspan>
</text>
<text id="o039" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="832.32" y="379.84">Interception, front-face reflection and</tspan>
<tspan x="832.32" y="398.72">internal absorption are separate, multiplied</tspan>
<tspan x="832.32" y="417.6">losses; none is counted twice.</tspan>
</text>
<text id="o040" font-family="Arial,sans-serif" font-size="16.6667" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="97.92" y="617.507">Energy accounting for E_L = 1 µJ, aperture 10 µm, beam radius 20 µm, μₐ hₐ = 1, R_λ = 0.10 (declared inputs).</tspan>
</text>
<text id="o041" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Energy balance of Eq. C2-E06, numbers as in Eq. C2-E31.</tspan>
