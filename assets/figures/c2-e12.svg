<text id="o044" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="829.44" y="166.44">What the curve says</tspan>
</text>
<text id="o045" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="832.32" y="207.587">log₁₀(p/10⁵ Pa) = 4.2063 − 1103.454 K/(T −</tspan>
<tspan x="832.32" y="227.253">39.77 K)</tspan>
</text>
<text id="o046" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="853.44" y="293.987">Valid only for 282.82 K ≤ T ≤ 337.94 K.</tspan>
</text>
<ellipse id="o047" cx="838.08" cy="288.733" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o048" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="853.44" y="323.92">It gives the equilibrium vapor pressure of</tspan>
<tspan x="853.44" y="343.587">bulk liquid.</tspan>
</text>
<ellipse id="o049" cx="838.08" cy="318.667" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o050" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="853.44" y="374.187">Reaching it does not by itself start a</tspan>
<tspan x="853.44" y="393.853">bubble: nucleation is a separate step.</tspan>
</text>
<ellipse id="o051" cx="838.08" cy="368.933" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o052" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="617.507">At 293 K the saturation pressure is below 1 bar; the liquid is superheated only when the surroundings or the liquid pressure sit</tspan>
<tspan x="97.92" y="637.173">below the curve.</tspan>
</text>
<text id="o053" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Empirical PFP correlation of Eq. C2-E12 (log scale).</tspan>
</text>
