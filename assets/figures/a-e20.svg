</text>
<text id="o035" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="346.463" y="190.493">slope 2: t ∝ L_g²</tspan>
</text>
<rect id="o036" x="739.2" y="144" width="504" height="384" rx="30.72" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o037" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="752.64" y="166.44">Darcy flow and diffusion</tspan>
</text>
<text id="o038" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="755.52" y="207.587">jₗ = −(k/μₗ) ∇pₚₒᵣₑ</tspan>
</text>
<text id="o039" font-family="Arial,sans-serif" font-size="16" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="755.52" y="255.04">∂p/∂t = Dₚₒᵣₒ ∇²p,   Dₚₒᵣₒ = k M_d / μₗ</tspan>
</text>
<text id="o040" font-family="Arial,sans-serif" font-size="16" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="755.52" y="307.84">tₚₒᵣₒ ~ L_g² / Dₚₒᵣₒ = μₗ L_g² / (k M_d)</tspan>
</text>
<text id="o041" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="755.52" y="364.893">k = 10⁻¹⁷ m², M_d = 60 kPa, μₗ = 1 mPa s (prescribed</tspan>
<tspan x="755.52" y="382.987">teaching values).</tspan>
</text>
<text id="o042" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="755.52" y="432.093">A 3 µs event is approximately undrained at 30 µm; local</tspan>
<tspan x="755.52" y="450.187">solvent motion remains possible.</tspan>
</text>
<text id="o043" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="617.507">Permeability and modulus are inputs from characterisation; only the quadratic scaling with length is a result of the model.</tspan>
</text>
<text id="o044" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Darcy/storage drainage time of Eq. A-E20.</tspan>
</text>
