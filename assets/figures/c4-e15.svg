</text>
<text id="o044" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="59.52" y="528.64">Right: the three terms (solid) add up to the final profile (dashed), using the constants found in Eq. C4-E16.</tspan>
</text>
<text id="o045" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Radial integration of Eq. C4-E15; pieces drawn for C₂ = −p₀b²/(8D_f) and C₄ = p₀b⁴/(64D_f) (preview of Eq. C4-E16).</tspan>
