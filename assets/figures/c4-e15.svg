<title>C4-E15</title>
<defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/></marker></defs>
<rect width="1279.97" height="720" fill="#142632"/>
<text id="o000" font-family="Arial,sans-serif" font-size="25.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="30.72" y="35.1733">C4-E15 · Derived second pair of radial integrations</tspan>
</text>
<text id="o001" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="49.92" y="112.68">Second pair of integrations: build w(r)</tspan>
</text>
<text id="o002" font-family="Arial,sans-serif" font-size="16" fill="#7FC8F8" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="59.52" y="163.84">start</tspan>
</text>
<text id="o003" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="366.72" y="164.387">d/dr (r w′) = r g = p₀ r³ / (4D_f) + C₂ r</tspan>
</text>
<text id="o004" font-family="Arial,sans-serif" font-size="16" fill="#7FC8F8" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="59.52" y="232.96">integrate</tspan>
</text>
<text id="o005" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="366.72" y="233.507">r w′ = p₀ r⁴ / (16D_f) + C₂ r² / 2 + C₃</tspan>
</text>
<text id="o006" font-family="Arial,sans-serif" font-size="16" fill="#F28BA0" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="59.52" y="302.08">C₃ = 0 (regular)</tspan>
</text>
<text id="o007" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="366.72" y="302.627">w′ = p₀ r³ / (16D_f) + C₂ r / 2</tspan>
</text>
<text id="o008" font-family="Arial,sans-serif" font-size="16" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="59.52" y="371.2">integrate</tspan>
</text>
<text id="o009" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="366.72" y="371.747">w = p₀ r⁴ / (64D_f) + C₂ r² / 4 + C₄</tspan>
</text>
