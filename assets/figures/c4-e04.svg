<tspan x="49.92" y="572.387">Bending is stored by curvature, tension by slope, kinetic energy by velocity: three separate integrals over the same film Ω_f.</tspan>
</text>
<text id="o028" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
