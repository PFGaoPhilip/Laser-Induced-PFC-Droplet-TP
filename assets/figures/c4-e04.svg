<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1279.97 720" role="img">
<title>Scientific schematic</title>
<defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/></marker></defs>
<rect width="1279.97" height="720" fill="#142632"/>
<text id="o000" font-family="Arial,sans-serif" font-size="28" fill="#8EDBD4" text-anchor="start" opacity="1">
<tspan x="31.68" y="40.04">C4-E04 · Linear-plate energy model</tspan>
</text>
<rect id="o001" x="124.8" y="124.8" width="720" height="225.6" fill="none" stroke="#B4C7D2" stroke-width="2" opacity="1"/>
<text id="o002" font-family="Arial,sans-serif" font-size="26.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="290.88" y="211.2">Reference film plane Ω_f</tspan>
<tspan x="290.88" y="242.667">w(x,y,t), variation δw</tspan>
</text>
<line id="o003" x1="849.6" y1="235.2" x2="969.6" y2="235.2" fill="#FFFFFF" stroke="#8EDBD4" stroke-width="2.66667" opacity="1" marker-end="url(#head)"/>
<text id="o004" font-family="Arial,sans-serif" font-size="21.3333" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="991.68" y="232.32">n: outward</tspan>
<tspan x="991.68" y="257.493">in-plane normal</tspan>
</text>
<line id="o005" x1="144" y1="369.6" x2="336" y2="369.6" fill="#FFFFFF" stroke="#8EDBD4" stroke-width="2.66667" opacity="1" marker-end="url(#head)"/>
<text id="o006" font-family="Arial,sans-serif" font-size="22.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="358.08" y="374.813">x</tspan>
</text>
<line id="o007" x1="144" y1="369.6" x2="144" y2="278.4" fill="#FFFFFF" stroke="#8EDBD4" stroke-width="2.66667" opacity="1" marker-end="url(#head)"/>
<text id="o008" font-family="Arial,sans-serif" font-size="22.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="79.68" y="317.213">y</tspan>
</text>
<text id="o009" font-family="Arial,sans-serif" font-size="25.3333" fill="#8EDBD4" text-anchor="start" opacity="1">
<tspan x="194.88" y="99.4267">Fixed boundary: δw = 0; ∂ₙδw = 0</tspan>
</text>
<text id="o010" font-family="Arial,sans-serif" font-size="22.6667" fill="#8EDBD4" text-anchor="start" opacity="1">
<tspan x="511.68" y="389.213">Curvature stores U_b; slope stores U_T.</tspan>
</text>
<line id="o011" x1="28.8" y1="417.6" x2="1248" y2="417.6" fill="#FFFFFF" stroke="#405967" stroke-width="1.33333" opacity="1"/>
<text id="o012" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="36.48" y="446.567">• Ω_f, dA — film plane</tspan>
</text>
<text id="o013" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="655.68" y="446.567">• x, y — in-plane directions</tspan>
</text>
<text id="o014" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="36.48" y="471.047">• w, ẇ, t — film motion</tspan>
</text>
<text id="o015" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="655.68" y="471.047">• w_xx, w_yy, w_xy — curvature</tspan>
</text>
<text id="o016" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="36.48" y="495.527">• D_f, ν_f — bending</tspan>
</text>
<text id="o017" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="655.68" y="495.527">• m_A → K_f</tspan>
</text>
<text id="o018" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="36.48" y="520.007">• T₀ → U_T</tspan>
</text>
<text id="o019" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="655.68" y="520.007">• U_b — shape energy</tspan>
</text>
<text id="o020" font-family="Arial,sans-serif" font-size="15.3333" fill="#8EDBD4" text-anchor="start" opacity="1">
<tspan x="36.48" y="606.407">Clamped edge: displacement and normal slope fixed.</tspan>
</text>
<text id="o021" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="36.48" y="696.187">Model schematic; geometry is not to scale.</tspan>
</text>
</svg>
