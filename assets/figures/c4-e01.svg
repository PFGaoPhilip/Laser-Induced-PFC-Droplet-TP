<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1279.97 720" role="img">
<title>Scientific schematic</title>
<defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/></marker></defs>
<rect width="1279.97" height="720" fill="#142632"/>
<text id="o000" font-family="Arial,sans-serif" font-size="28" fill="#8EDBD4" text-anchor="start" opacity="1">
<tspan x="31.68" y="40.04">C4-E01 · Constitutive assumption and traction identity</tspan>
</text>
<rect id="o001" x="105.6" y="134.4" width="960" height="38.4" fill="#213E4B" stroke="#B4C7D2" stroke-width="2" opacity="1"/>
<line id="o002" x1="288" y1="297.6" x2="288" y2="182.4" fill="#FFFFFF" stroke="#8EDBD4" stroke-width="2.66667" opacity="1" marker-end="url(#head)"/>
<line id="o003" x1="576" y1="297.6" x2="576" y2="182.4" fill="#FFFFFF" stroke="#8EDBD4" stroke-width="2.66667" opacity="1" marker-end="url(#head)"/>
<line id="o004" x1="864" y1="297.6" x2="864" y2="182.4" fill="#FFFFFF" stroke="#8EDBD4" stroke-width="2.66667" opacity="1" marker-end="url(#head)"/>
<line id="o005" x1="1008" y1="177.6" x2="1008" y2="268.8" fill="#FFFFFF" stroke="#8EDBD4" stroke-width="2.66667" opacity="1" marker-end="url(#head)"/>
<text id="o006" font-family="Arial,sans-serif" font-size="21.3333" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="1034.88" y="232.32">n_f ↓</tspan>
<tspan x="1034.88" y="257.493">solid → liquid</tspan>
</text>
<text id="o007" font-family="Arial,sans-serif" font-size="24" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="108.48" y="101.52">Film / solid; positive departure and velocity v_f ↑</tspan>
</text>
<text id="o008" font-family="Arial,sans-serif" font-size="24" fill="#8EDBD4" text-anchor="start" opacity="1">
<tspan x="127.68" y="355.92">Liquid below: t_l = T_l n_f; pressure traction opposes n_f.</tspan>
</text>
<line id="o009" x1="28.8" y1="417.6" x2="1248" y2="417.6" fill="#FFFFFF" stroke="#405967" stroke-width="1.33333" opacity="1"/>
<text id="o010" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="36.48" y="446.567">• film surface</tspan>
</text>
<text id="o011" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="655.68" y="446.567">• n_f ↓ solid → liquid</tspan>
</text>
<text id="o012" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="36.48" y="471.047">• p → compressive load</tspan>
</text>
<text id="o013" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="655.68" y="471.047">• u, x, t in liquid</tspan>
</text>
<text id="o014" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="36.48" y="495.527">• μ, D_u — shear</tspan>
</text>
<text id="o015" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="655.68" y="495.527">• T_l, t_l at exposed face</tspan>
</text>
<text id="o016" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="36.48" y="520.007">• I — identity tensor</tspan>
</text>
<text id="o017" font-family="Arial,sans-serif" font-size="15.3333" fill="#8EDBD4" text-anchor="start" opacity="1">
<tspan x="36.48" y="606.407">Positive opening direction ↑</tspan>
</text>
<text id="o018" font-family="Arial,sans-serif" font-size="15.3333" fill="#8EDBD4" text-anchor="start" opacity="1">
<tspan x="36.48" y="635.207">The release interface is a separate surface.</tspan>
</text>
<text id="o019" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="36.48" y="696.187">Model schematic; geometry is not to scale.</tspan>
</text>
</svg>
