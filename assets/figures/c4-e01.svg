<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1279.97 720" role="img">
<title>C4-E01</title>
<defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/></marker></defs>
<rect width="1279.97" height="720" fill="#142632"/>
<text id="o000" font-family="Arial,sans-serif" font-size="25.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="30.72" y="35.1733">C4-E01 · Constitutive assumption and traction identity</tspan>
</text>
<rect id="o001" x="38.4" y="96" width="710.4" height="508.8" rx="40.704" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o002" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="51.84" y="118.44">Traction on the exposed film face</tspan>
</text>
<rect id="o003" x="76.8" y="328.32" width="633.6" height="113.28" fill="#1E4A5A" stroke="#2B6678" stroke-width="1.33333" opacity="1"/>
<rect id="o004" x="76.8" y="153.6" width="633.6" height="153.6" fill="#3A5362" stroke="#B4C7D2" stroke-width="1.6" opacity="0.8"/>
<text id="o005" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="88.32" y="178.24">solid film</tspan>
</text>
<text id="o006" font-family="Arial,sans-serif" font-size="16" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="88.32" y="360.64">liquid</tspan>
</text>
<line id="o007" x1="211.2" y1="307.2" x2="211.2" y2="230.4" fill="#FFFFFF" stroke="#F2B880" stroke-width="4" opacity="1" marker-end="url(#head)"/>
<text id="o008" font-family="Arial,sans-serif" font-size="16" fill="#F2B880" text-anchor="end" font-weight="bold" opacity="1">
<tspan x="209.28" y="255.04">n_f</tspan>
</text>
<line id="o009" x1="422.4" y1="312" x2="422.4" y2="403.2" fill="#FFFFFF" stroke="#F28BA0" stroke-width="4.66667" opacity="1" marker-end="url(#head)"/>
<text id="o010" font-family="Arial,sans-serif" font-size="15.3333" fill="#F28BA0" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="438.72" y="393.693">normal part −p n</tspan>
</text>
<line id="o011" x1="480" y1="297.6" x2="614.4" y2="297.6" fill="#FFFFFF" stroke="#7FC8F8" stroke-width="4.66667" opacity="1" marker-end="url(#head)"/>
<text id="o012" font-family="Arial,sans-serif" font-size="15.3333" fill="#7FC8F8" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="481.92" y="259.293">shear part 2μ D·n</tspan>
</text>
<text id="o013" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="59.52" y="509.987">Dᵤ = (∇u + ∇uᵀ)/2,   Tₗ = −pI + 2μDᵤ,   tₗ = Tₗ n_f</tspan>
</text>
<text id="o014" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="59.52" y="557.44">The normal fixes the sign: positive pressure presses on the film.</tspan>
</text>
<rect id="o015" x="768" y="96" width="475.2" height="508.8" rx="38.016" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o016" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="781.44" y="118.44">Two parts of one traction</tspan>
</text>
<text id="o017" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="784.32" y="179.613">pressure −p (Pa)</tspan>
</text>
<rect id="o018" x="964.8" y="163.2" width="125.636" height="38.4" fill="#F28BA0" stroke="#F28BA0" stroke-width="1.33333" opacity="0.85"/>
<text id="o019" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="1100.04" y="182.493">4.72e+07</tspan>
</text>
<text id="o020" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="784.32" y="242.013">viscous 2μD (Pa)</tspan>
</text>
<rect id="o021" x="964.8" y="225.6" width="13.5784" height="38.4" fill="#7FC8F8" stroke="#7FC8F8" stroke-width="1.33333" opacity="0.85"/>
<text id="o022" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="987.978" y="244.893">3.2e+03</tspan>
</text>
<text id="o023" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="805.44" y="312.64">Pressure acts along n; viscous stress adds a</tspan>
<tspan x="805.44" y="331.52">tangential part.</tspan>
</text>
<ellipse id="o024" cx="790.08" cy="307.52" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o025" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="805.44" y="361.28">For μ = 1 mPa s and strain rate 3×10⁶ s⁻¹ the</tspan>
<tspan x="805.44" y="380.16">shear is thousands of Pa, far below the 47 MPa</tspan>
<tspan x="805.44" y="399.04">contact scale.</tspan>
</text>
<ellipse id="o026" cx="790.08" cy="356.16" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o027" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="805.44" y="429.44">The film feels the traction, not the liquid</tspan>
<tspan x="805.44" y="448.32">velocity.</tspan>
</text>
<ellipse id="o028" cx="790.08" cy="424.32" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o029" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Newtonian traction of Eq. C4-E01; bar values are order-of-magnitude illustrations (log axis).</tspan>
</text>
</svg>
