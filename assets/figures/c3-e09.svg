<text id="o037" font-family="Arial,sans-serif" font-size="15.3333" fill="#8EDBD4" text-anchor="start" opacity="1">
<tspan x="426.24" y="165.213">χ = 0:  |Ṙ| at Rₘₐₓ/2 = 21.6 m/s</tspan>
</text>
<rect id="o038" x="384" y="190.08" width="28.8" height="19.2" fill="#F2B880" stroke="#F2B880" stroke-width="1.33333" opacity="1"/>
<text id="o039" font-family="Arial,sans-serif" font-size="15.3333" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="426.24" y="199.773">χ = 1:  |Ṙ| at Rₘₐₓ/2 = 17.6 m/s</tspan>
</text>
<rect id="o040" x="384" y="224.64" width="28.8" height="19.2" fill="#F28BA0" stroke="#F28BA0" stroke-width="1.33333" opacity="1"/>
<text id="o041" font-family="Arial,sans-serif" font-size="15.3333" fill="#F28BA0" text-anchor="start" opacity="1">
<tspan x="426.24" y="234.333">χ = 3:  |Ṙ| at Rₘₐₓ/2 = 13.7 m/s</tspan>
</text>
<rect id="o042" x="758.4" y="144" width="484.8" height="384" rx="30.72" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o043" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="771.84" y="166.44">Integrated solution</tspan>
</text>
<text id="o044" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="774.72" y="207.04">Ṙ = −√{ (2Δp_c/3ρ) (Rₘₐₓ³ − R³) / [R³ (1 + SR)] }</tspan>
</text>
<text id="o045" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="795.84" y="283.84">[R³(1 + SR) y] from Rₘₐₓ to R integrates to</tspan>
<tspan x="795.84" y="302.72">(2Δp_c/3ρ)(Rₘₐₓ³ − R³).</tspan>
</text>
<ellipse id="o046" cx="780.48" cy="278.72" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o047" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="795.84" y="332.48">The condition y(Rₘₐₓ) = 0 removes the constant.</tspan>
</text>
<ellipse id="o048" cx="780.48" cy="327.36" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o049" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="795.84" y="361.6">The minus sign selects the inward branch.</tspan>
</text>
<ellipse id="o050" cx="780.48" cy="356.48" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o051" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="795.84" y="390.72">Interaction (χ &gt; 0) lowers the speed at every</tspan>
<tspan x="795.84" y="409.6">radius.</tspan>
</text>
<ellipse id="o052" cx="780.48" cy="385.6" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o053" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="617.507">Speed at half radius: 21.6 m/s for an isolated bubble, lower when neighbours add inertia.</tspan>
</text>
<text id="o054" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Integrated speed of Eq. C3-E09 (Rₘₐₓ = 30 µm, ρ = 1000 kg/m³, Δp_c = 100 kPa).</tspan>
</text>
</svg>
