<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1279.97 720" role="img">
<title>C1-E04</title>
<defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/></marker></defs>
<rect width="1279.97" height="720" fill="#142632"/>
<text id="o000" font-family="Arial,sans-serif" font-size="25.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="30.72" y="35.1733">C1-E04 · Exact Eulerian and moving-point derivatives</tspan>
</text>
<rect id="o001" x="38.4" y="96" width="422.4" height="508.8" rx="33.792" fill="#1E4A5A" stroke="#2B6678" stroke-width="2" opacity="1"/>
<text id="o002" font-family="Arial,sans-serif" font-size="18.6667" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="54.72" y="119.947">Two observers, one potential</tspan>
</text>
<ellipse id="o003" cx="240" cy="336" rx="76.8" ry="76.8" fill="#0C1820" stroke="#F2B880" stroke-width="2.93333" opacity="1"/>
<ellipse id="o004" cx="240" cy="336" rx="99.84" ry="99.84" fill="none" stroke="#F2B880" stroke-width="1.73333" opacity="0.7"/>
<line id="o005" x1="316.8" y1="259.2" x2="359.04" y2="216.96" fill="#FFFFFF" stroke="#F2B880" stroke-width="3.2" opacity="1" marker-end="url(#head)"/>
<text id="o006" font-family="Arial,sans-serif" font-size="16" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="270.72" y="154.24">wall point moves outward</tspan>
</text>
<ellipse id="o007" cx="422.4" cy="412.8" rx="9.6" ry="9.6" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o008" font-family="Arial,sans-serif" font-size="16" fill="#8EDBD4" text-anchor="start" opacity="1">
<tspan x="309.12" y="445.12">fixed point r = 2R</tspan>
</text>
<text id="o009" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="54.72" y="529.187">The fixed point feels φ change only because</tspan>
<tspan x="54.72" y="548.853">R(t) changes. A point riding the wall also</tspan>
<tspan x="54.72" y="568.52">moves to larger r.</tspan>
</text>
<text id="o010" font-family="Arial,sans-serif" font-size="18.6667" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="501.12" y="118.027">Three derivatives for R = 1, Ṙ = 1, R̈ = −0.5</tspan>
</text>
<line id="o011" x1="1094.4" y1="153.6" x2="1094.4" y2="441.6" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="1.73333" opacity="1"/>
<text id="o012" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="501.12" y="193.733">∂φ/∂t at fixed r = 2R</tspan>
</text>
<rect id="o013" x="964.8" y="179.52" width="129.6" height="43.2" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o014" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="1107.84" y="198.533">-0.75</tspan>
</text>
<text id="o015" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="501.12" y="284.933">∂φ/∂t at fixed r = R</tspan>
</text>
<rect id="o016" x="835.2" y="270.72" width="259.2" height="43.2" fill="#7FC8F8" stroke="#7FC8F8" stroke-width="1.33333" opacity="1"/>
<text id="o017" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="1107.84" y="289.733">-1.50</tspan>
</text>
<text id="o018" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="501.12" y="376.133">dφ/dt following the wall</tspan>
</text>
<rect id="o019" x="1008" y="361.92" width="86.4" height="43.2" fill="#F2B880" stroke="#F2B880" stroke-width="1.33333" opacity="1"/>
<text id="o020" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="1107.84" y="380.933">-0.50</tspan>
</text>
<rect id="o021" x="499.2" y="460.8" width="739.2" height="110.4" rx="8.832" fill="#213E4B" stroke="#B4C7D2" stroke-width="2.13333" opacity="1"/>
<text id="o022" font-family="Arial,sans-serif" font-size="18.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="515.52" y="485.707">Chain rule at the wall:   dφ/dt = ∂φ/∂t + Ṙ ∂φ/∂r</tspan>
<tspan x="515.52" y="507.733">−0.5 = −1.5 + (1)(1)</tspan>
</text>
<text id="o023" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="501.12" y="611.333">Using the wrong derivative changes the wall pressure of Eq. C1-E05 by a whole Ṙ²</tspan>
<tspan x="501.12" y="631.787">term.</tspan>
</text>
<text id="o024" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Values from Eq. C1-E04 with R = 1, Ṙ = 1, R̈ = −0.5 (units m² s⁻²).</tspan>
</text>
</svg>
