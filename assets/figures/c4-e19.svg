<text id="o039" font-family="Arial,sans-serif" font-size="15.3333" fill="#7FC8F8" text-anchor="start" opacity="1">
<tspan x="165.12" y="201.039">U_b = V²/(2C_b)  (stored)</tspan>
</text>
<text id="o040" font-family="Arial,sans-serif" font-size="15.3333" fill="#F28BA0" text-anchor="start" opacity="1">
<tspan x="153.216" y="481.839">−p₀V  (source work)</tspan>
</text>
<ellipse id="o041" cx="691.2" cy="416.291" rx="7.68" ry="7.68" fill="#F2B880" stroke="#F2B880" stroke-width="1.33333" opacity="1"/>
<text id="o042" font-family="Arial,sans-serif" font-size="16" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="510.72" y="402.531">𝒫 = −p₀V/2</tspan>
</text>
<rect id="o043" x="720" y="144" width="523.2" height="374.4" rx="29.952" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o044" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="733.44" y="166.44">Maintained pressure</tspan>
</text>
<text id="o045" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="736.32" y="206.493">C_b = ∂V_bl/∂p₀ = π b⁶ / (192 D_f),   V_bl = C_b p₀</tspan>
</text>
<text id="o046" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="736.32" y="265.187">U_b = V_bl² / (2C_b) = p₀V_bl / 2</tspan>
</text>
<text id="o047" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="736.32" y="317.987">𝒫 = U_b − p₀V_bl = −π p₀² b⁶ / (384 D_f)</tspan>
</text>
<text id="o048" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="736.32" y="389.44">Half of the source work is stored; the other half is the</tspan>
<tspan x="736.32" y="408.32">loss of potential.</tspan>
</text>
<text id="o049" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="591.587">With p₀ held fixed the source does work p₀V; the total potential is negative: the system gains energy by opening.</tspan>
</text>
<text id="o050" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Potential under maintained pressure, Eq. C4-E19 (normalised: V* = 1, p* = 1; U_b = V²/2 along the linear compliance).</tspan>
</text>
</svg>
