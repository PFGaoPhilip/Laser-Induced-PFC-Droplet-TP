<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1279.97 720" role="img">
<title>C2-E33</title>
<defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/></marker></defs>
<rect width="1279.97" height="720" fill="#142632"/>
<text id="o000" font-family="Arial,sans-serif" font-size="25.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="30.72" y="35.1733">C2-E33 · Original formulas for Defense 2</tspan>
</text>
<rect id="o001" x="48" y="115.2" width="259.2" height="144" rx="11.52" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o002" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="177.6" y="137.64">Confinement</tspan>
</text>
<text id="o003" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="177.6" y="165.773">p_d ≃ p_c + 2σ_pc/a +</tspan>
<tspan x="177.6" y="186.227">Πₛₕₑₗₗ</tspan>
</text>
<line id="o004" x1="310.08" y1="187.2" x2="352.32" y2="187.2" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="2.93333" opacity="1" marker-end="url(#head)"/>
<rect id="o005" x="355.2" y="115.2" width="259.2" height="144" rx="11.52" fill="#213E4B" stroke="#F2B880" stroke-width="2.13333" opacity="1"/>
<text id="o006" font-family="Arial,sans-serif" font-size="18" fill="#F2B880" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="484.8" y="137.64">Superheat</tspan>
</text>
<text id="o007" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="484.8" y="165.773">Δpₙ = pₛₐₜ(Tᵢ) − p_d</tspan>
</text>
<line id="o008" x1="617.28" y1="187.2" x2="659.52" y2="187.2" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="2.93333" opacity="1" marker-end="url(#head)"/>
<rect id="o009" x="662.4" y="115.2" width="259.2" height="144" rx="11.52" fill="#213E4B" stroke="#7FC8F8" stroke-width="2.13333" opacity="1"/>
<text id="o010" font-family="Arial,sans-serif" font-size="18" fill="#7FC8F8" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="792" y="137.64">Critical radius</tspan>
</text>
<text id="o011" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="792" y="165.773">r* = 2σᵥₚ / Δpₙ</tspan>
</text>
<line id="o012" x1="924.48" y1="187.2" x2="966.72" y2="187.2" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="2.93333" opacity="1" marker-end="url(#head)"/>
<rect id="o013" x="969.6" y="115.2" width="259.2" height="144" rx="11.52" fill="#213E4B" stroke="#F28BA0" stroke-width="2.13333" opacity="1"/>
<text id="o014" font-family="Arial,sans-serif" font-size="18" fill="#F28BA0" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="1099.2" y="137.64">Barrier</tspan>
</text>
<text id="o015" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="1099.2" y="165.773">W* = 16π σᵥₚ³ / (3 Δpₙ²)</tspan>
</text>
<line id="o016" x1="96" y1="566.4" x2="652.8" y2="566.4" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="2" opacity="1"/>
