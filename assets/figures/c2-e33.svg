<text id="o020" font-family="Arial,sans-serif" font-size="14" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="96" y="588.44">0.0</tspan>
</text>
<line id="o021" x1="270" y1="566.4" x2="270" y2="573.12" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="1.33333" opacity="1"/>
<line id="o022" x1="270" y1="316.8" x2="270" y2="566.4" fill="#FFFFFF" stroke="#2E4756" stroke-width="0.8" opacity="1"/>
<text id="o023" font-family="Arial,sans-serif" font-size="14" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="270" y="588.44">0.5</tspan>
</text>
<line id="o024" x1="444" y1="566.4" x2="444" y2="573.12" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="1.33333" opacity="1"/>
<line id="o025" x1="444" y1="316.8" x2="444" y2="566.4" fill="#FFFFFF" stroke="#2E4756" stroke-width="0.8" opacity="1"/>
<text id="o026" font-family="Arial,sans-serif" font-size="14" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="444" y="588.44">1.0</tspan>
</text>
<line id="o027" x1="618" y1="566.4" x2="618" y2="573.12" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="1.33333" opacity="1"/>
<line id="o028" x1="618" y1="316.8" x2="618" y2="566.4" fill="#FFFFFF" stroke="#2E4756" stroke-width="0.8" opacity="1"/>
<text id="o029" font-family="Arial,sans-serif" font-size="14" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="618" y="588.44">1.5</tspan>
</text>
<line id="o030" x1="89.28" y1="497.067" x2="96" y2="497.067" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="1.33333" opacity="1"/>
<line id="o031" x1="96" y1="497.067" x2="652.8" y2="497.067" fill="#FFFFFF" stroke="#2E4756" stroke-width="0.8" opacity="1"/>
<text id="o032" font-family="Arial,sans-serif" font-size="14" fill="#B4C7D2" text-anchor="end" opacity="1">
<tspan x="84.48" y="501.827">0</tspan>
</text>
<line id="o033" x1="89.28" y1="358.4" x2="96" y2="358.4" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="1.33333" opacity="1"/>
<line id="o034" x1="96" y1="358.4" x2="652.8" y2="358.4" fill="#FFFFFF" stroke="#2E4756" stroke-width="0.8" opacity="1"/>
<text id="o035" font-family="Arial,sans-serif" font-size="14" fill="#B4C7D2" text-anchor="end" opacity="1">
<tspan x="84.48" y="363.16">1</tspan>
</text>
<text id="o036" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="374.4" y="611.2">rₙ / r*</tspan>
</text>
<text id="o037" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="40.32" y="295.36">W / W*</tspan>
</text>
