<text id="o040" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="455.52" y="335.587">r*, W*</tspan>
</text>
<rect id="o041" x="691.2" y="316.8" width="547.2" height="278.4" rx="22.272" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o042" font-family="Arial,sans-serif" font-size="17.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="704.64" y="338.693">Read it from left to right</tspan>
</text>
<text id="o043" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="728.64" y="379.84">Confinement sets the liquid pressure p_d; a smaller core</tspan>
<tspan x="728.64" y="398.72">raises it.</tspan>
</text>
<ellipse id="o044" cx="713.28" cy="374.72" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o045" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="728.64" y="428.48">Superheat is how far pₛₐₜ at the interface temperature</tspan>
<tspan x="728.64" y="447.36">lies above p_d.</tspan>
</text>
<ellipse id="o046" cx="713.28" cy="423.36" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o047" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="728.64" y="477.12">More superheat shrinks r* and W*, but the barrier stays</tspan>
<tspan x="728.64" y="496">positive.</tspan>
</text>
<ellipse id="o048" cx="713.28" cy="472" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o049" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="649.187">The formulas assume homogeneous nucleation, a locally isothermal small nucleus and Δpₙ &gt; 0.</tspan>
</text>
<text id="o050" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Reference formulas of the Defence 2 answer: Eqs. C2-E11, E14, E15, E16.</tspan>
</text>
</svg>
