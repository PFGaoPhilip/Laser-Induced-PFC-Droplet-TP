<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 650" role="img"><title>C2-E29 A rigorous preparation path uses the heat capacity of each phase over its own interval.</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8EDBD4"/></marker></defs>
<rect width="980" height="650" fill="#142632"/>
<text x="28" y="42.52" font-family="Arial,sans-serif" font-size="19" fill="#8EDBD4">C2-E29 | Physical-variable diagram</text>
<rect x="75" y="150" width="250" height="100" fill="#213E4B" stroke="#B4C7D2" stroke-width="1.9500000000000002"/>
<text x="87" y="179.44" font-family="Arial,sans-serif" font-size="18" fill="#E7F0F3">Liquid heating</text>
<rect x="365" y="150" width="250" height="100" fill="#213E4B" stroke="#B4C7D2" stroke-width="1.9500000000000002"/>
<text x="377" y="179.44" font-family="Arial,sans-serif" font-size="18" fill="#E7F0F3">Latent conversion</text>
<rect x="655" y="150" width="250" height="100" fill="#213E4B" stroke="#B4C7D2" stroke-width="1.9500000000000002"/>
<text x="667" y="179.44" font-family="Arial,sans-serif" font-size="18" fill="#E7F0F3">Vapor heating</text>
<text x="332" y="210.92" font-family="Arial,sans-serif" font-size="24" fill="#E7F0F3">+</text>
<text x="622" y="210.92" font-family="Arial,sans-serif" font-size="24" fill="#E7F0F3">+</text>
<text x="102" y="335.52" font-family="Arial,sans-serif" font-size="19" fill="#E7F0F3">Sum along one constant-pressure path gives Q_iso.</text>
<text x="32" y="426.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">m_PFC,0: fixed compound mass</text>
<text x="32" y="450.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">T₀ → T_sat: liquid heating</text>
<text x="32" y="474.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">T_sat → T_*: vapor heating</text>
<text x="32" y="498.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">L_v(T_sat,p): coexistence latent enthalpy</text>
<text x="32" y="522.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">T, dT: temperature integration</text>
<text x="507" y="426.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">p: constant path pressure</text>
<text x="507" y="450.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">T_sat: phase transition</text>
<text x="507" y="474.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">c_p,l, c_p,v: phase heat capacities</text>
<text x="507" y="498.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">Q_iso: total path heat</text>
<text x="32" y="561.28" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2">Latent enthalpy already contains the phase-transition flow work</text>
<text x="32" y="585.28" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2">The constant-property screen does not replace a calibrated enthalpy path</text>
</svg>