<title id="title">C2-E29 — A rigorous preparation path uses the heat capacity of each phase over its own interval.</title>
<desc id="desc">m_PFC,0: fixed compound mass; p: constant path pressure; T₀ → T_sat: liquid heating; T_sat: phase transition; T_sat → T_*: vapor heating; c_p,l, c_p,v: phase heat capacities; L_v(T_sat,p): coexistence latent enthalpy; Q_iso: total path heat; T, dT: temperature integration; Latent enthalpy already contains the phase-transition flow work; The constant-property screen does not replace a calibrated enthalpy path</desc>
