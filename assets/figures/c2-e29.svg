<text id="o037" font-family="Arial,sans-serif" font-size="15.3333" fill="#7FC8F8" text-anchor="start" opacity="1">
<tspan x="159.2" y="494.916">liquid: cₚ,l = 654 J/(kg K)</tspan>
<tspan x="159.2" y="513.009">to Tₛₐₜ = 302.1 K</tspan>
</text>
<text id="o038" font-family="Arial,sans-serif" font-size="15.3333" fill="#F28BA0" text-anchor="start" opacity="1">
<tspan x="325.692" y="376.029">latent step</tspan>
<tspan x="325.692" y="394.123">Lᵥ = 95 kJ/kg</tspan>
</text>
<text id="o039" font-family="Arial,sans-serif" font-size="15.3333" fill="#8EDBD4" text-anchor="start" opacity="1">
<tspan x="480.8" y="201.847">vapor: cₚ,v (assumed 0.9 kJ/(kg K))</tspan>
</text>
<rect id="o040" x="768" y="144" width="475.2" height="384" rx="30.72" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o041" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="781.44" y="166.44">Each phase uses its own cₚ</tspan>
</text>
<text id="o042" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="784.32" y="207.587">Qᵢₛₒ = m [ ∫cₚ,l dT + Lᵥ(Tₛₐₜ, p) + ∫cₚ,v dT ]</tspan>
</text>
<text id="o043" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="805.44" y="288.64">Liquid heating stops at Tₛₐₜ = 302.1 K (1 bar),</tspan>
<tspan x="805.44" y="307.52">not at T*.</tspan>
</text>
<ellipse id="o044" cx="790.08" cy="283.52" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o045" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="805.44" y="337.28">Vapor heating from Tₛₐₜ to T* uses cₚ,v, a</tspan>
<tspan x="805.44" y="356.16">different number.</tspan>
</text>
<ellipse id="o046" cx="790.08" cy="332.16" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o047" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="805.44" y="385.92">The earlier estimate heated the liquid all the way</tspan>
<tspan x="805.44" y="404.8">to T*.</tspan>
</text>
<ellipse id="o048" cx="790.08" cy="380.8" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o049" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="97.92" y="591.04">Per kilogram: 5.9 kJ liquid + 95 kJ latent + 18.9 kJ vapor (cₚ,v is an assumed illustration).</tspan>
</text>
<text id="o050" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="634.787">Latent enthalpy still dominates, but the sensible parts must follow the phase actually being heated.</tspan>
</text>
<text id="o051" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Refined constant-pressure path of Eq. C2-E29; Tₛₐₜ from Eq. C2-E12 at 1 bar.</tspan>
</text>
</svg>
