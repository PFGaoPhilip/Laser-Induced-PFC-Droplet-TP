<tspan x="124.8" y="196.893">1.00</tspan>
</text>
<text id="o021" font-family="Arial,sans-serif" font-size="14.6667" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="124.8" y="520.827">(p_b−p_∞)V̇</tspan>
</text>
<rect id="o022" x="210.816" y="211.2" width="96.768" height="80.64" fill="#F28BA0" stroke="#F28BA0" stroke-width="1.33333" opacity="0.85"/>
<text id="o023" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="259.2" y="196.893">-0.28</tspan>
</text>
<text id="o024" font-family="Arial,sans-serif" font-size="14.6667" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="259.2" y="520.827">− P_dis</tspan>
</text>
<rect id="o025" x="345.216" y="291.84" width="96.768" height="14.4" fill="#F2B880" stroke="#F2B880" stroke-width="1.33333" opacity="0.85"/>
<text id="o026" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="393.6" y="277.533">-0.05</tspan>
</text>
<text id="o027" font-family="Arial,sans-serif" font-size="14.6667" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="393.6" y="520.827">− dE_σ/dt</tspan>
</text>
<rect id="o028" x="479.616" y="306.24" width="96.768" height="92.16" fill="#7FC8F8" stroke="#7FC8F8" stroke-width="1.33333" opacity="0.85"/>
<text id="o029" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="528" y="291.933">-0.32</tspan>
</text>
<text id="o030" font-family="Arial,sans-serif" font-size="14.6667" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="528" y="520.827">− dW_g/dt</tspan>
</text>
<rect id="o031" x="614.016" y="398.4" width="96.768" height="100.8" fill="#A8E6A1" stroke="#A8E6A1" stroke-width="1.33333" opacity="0.85"/>
<text id="o032" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="662.4" y="384.093">0.35</tspan>
</text>
<text id="o033" font-family="Arial,sans-serif" font-size="14.6667" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="662.4" y="520.827">= dK_g/dt</tspan>
</text>
<rect id="o034" x="768" y="96" width="475.2" height="422.4" rx="33.792" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o035" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="781.44" y="118.44">Energy bookkeeping</tspan>
</text>
<text id="o036" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="784.32" y="159.04">K_g = 2πρ_gR³Ṙ²,   E_σ = 4πσR²</tspan>
</text>
<text id="o037" font-family="Arial,sans-serif" font-size="15.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="784.32" y="211.293">d(K_g + W_g + E_σ)/dt = (p_b − p_∞)V̇ − P_dis</tspan>
</text>
<text id="o038" font-family="Arial,sans-serif" font-size="16.6667" fill="#F28BA0" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="784.32" y="274.787">P_dis = 16πη_g R Ṙ² ≥ 0</tspan>
</text>
<text id="o039" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="784.32" y="336.64">Network work is recoverable; viscous dissipation is</tspan>
<tspan x="784.32" y="355.52">not.</tspan>
</text>
<text id="o040" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="59.52" y="548.387">Pressure work splits into medium inertia, recoverable network energy, surface energy and a positive viscous loss.</tspan>
</text>
<text id="o041" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="59.52" y="600.64">Shares are illustrative; the identity itself is exact within the model.</tspan>
</text>
<text id="o042" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Mechanical energy balance of Eq. A-E12 (shares schematic).</tspan>
</text>
</svg>
