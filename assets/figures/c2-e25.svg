<tspan x="503.04" y="580.347">−3Ṙ/R (volume)</tspan>
</text>
<rect id="o056" x="652.8" y="571.2" width="24" height="19.2" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.33333" opacity="0.4"/>
<text id="o057" font-family="Arial,sans-serif" font-size="14.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="685.44" y="580.347">ṗ/p (total)</tspan>
</text>
<rect id="o058" x="835.2" y="144" width="408" height="384" rx="30.72" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o059" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="848.64" y="166.44">Three drivers of pressure</tspan>
</text>
<text id="o060" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="851.52" y="207.587">ṗᵥ,s / pᵥ,s = ṁᵥ,s/mᵥ,s + Ṫ_b/T_b − 3Ṙ/R</tspan>
</text>
<text id="o061" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="872.64" y="288.64">Evaporation raises p; cooling lowers it;</tspan>
<tspan x="872.64" y="307.52">volume growth lowers it quickly.</tspan>
</text>
<ellipse id="o062" cx="857.28" cy="283.52" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o063" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="872.64" y="337.28">A law written in R alone keeps only the</tspan>
<tspan x="872.64" y="356.16">third term.</tspan>
</text>
<ellipse id="o064" cx="857.28" cy="332.16" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o065" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="872.64" y="385.92">A bubble can lose pressure while still</tspan>
<tspan x="872.64" y="404.8">evaporating if the volume term dominates.</tspan>
</text>
<ellipse id="o066" cx="857.28" cy="380.8" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o067" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="97.92" y="629.44">Rates are illustrative, chosen only to show how the three terms can compete. Identity valid for a spherical bubble (V_b = 4πR³/3).</tspan>
</text>
<text id="o068" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Logarithmic derivative of the ideal-gas law, Eq. C2-E25.</tspan>
</text>
</svg>
