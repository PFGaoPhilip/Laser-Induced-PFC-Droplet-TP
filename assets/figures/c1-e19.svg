</text>
<text id="o040" font-family="Arial,sans-serif" font-size="16" fill="#F28BA0" text-anchor="start" opacity="1">
<tspan x="118.819" y="417.976">incompressible model</tspan>
<tspan x="118.819" y="436.856">not trusted here</tspan>
</text>
<rect id="o041" x="768" y="144" width="475.2" height="384" rx="30.72" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o042" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="781.44" y="166.44">A diagnostic, not a limit</tspan>
</text>
<text id="o043" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="784.32" y="208.133">x_M = [ 1 + 3ρc²M*² / (2Δp_c) ]^(−1/3)</tspan>
</text>
<text id="o044" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="805.44" y="269.987">With c = 1500 m/s and M* = 0.1 the ideal</tspan>
<tspan x="805.44" y="289.653">collapse reaches M* at R = 0.143 Rₘₐₓ.</tspan>
</text>
<ellipse id="o045" cx="790.08" cy="264.733" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o046" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="805.44" y="320.253">Inside that radius the speed is large enough</tspan>
<tspan x="805.44" y="339.92">that liquid compressibility must be added.</tspan>
</text>
<ellipse id="o047" cx="790.08" cy="315" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o048" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="805.44" y="370.52">The ideal trajectory itself is not a physical</tspan>
<tspan x="805.44" y="390.187">prediction.</tspan>
</text>
<ellipse id="o049" cx="790.08" cy="365.267" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o050" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="618.053">Wall Mach number M_w = |Ṙ|/c grows as R shrinks, so the incompressible formulas lose validity near the end of the collapse.</tspan>
</text>
<text id="o051" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Curve from Eq. C1-E14 with c = 1500 m/s; threshold from Eq. C1-E19 (teaching inputs).</tspan>
</text>
