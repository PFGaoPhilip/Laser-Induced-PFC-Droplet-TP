<text id="o036" font-family="Arial,sans-serif" font-size="17.3333" fill="#8EDBD4" text-anchor="start" opacity="1">
<tspan x="388.08" y="328.362">φ = −R²Ṙ / r → 0 at infinity</tspan>
</text>
<ellipse id="o037" cx="181.92" cy="389.714" rx="7.68" ry="7.68" fill="#F2B880" stroke="#F2B880" stroke-width="1.33333" opacity="1"/>
<line id="o038" x1="106.32" y1="466.5" x2="318" y2="251.5" fill="#FFFFFF" stroke="#F2B880" stroke-width="2.4" opacity="1" stroke-dasharray="6 4"/>
<text id="o039" font-family="Arial,sans-serif" font-size="16" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="231.84" y="433.554">tangent slope at r = 1.6R is u = (R/r)²Ṙ</tspan>
<tspan x="231.84" y="452.434">= 0.39 Ṙ</tspan>
</text>
<rect id="o040" x="739.2" y="139.2" width="504" height="470.4" rx="37.632" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o041" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="752.64" y="161.64">Derivation in three moves</tspan>
</text>
<text id="o042" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="760.32" y="203.333">1  Start from the flux law</tspan>
</text>
<text id="o043" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="774.72" y="228.733">u(s) = R²Ṙ / s²</tspan>
</text>
<text id="o044" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="760.32" y="269.773">2  Integrate inward from infinity</tspan>
</text>
<text id="o045" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="774.72" y="295.173">φ(r) = ∫ u ds from ∞ to r</tspan>
<tspan x="774.72" y="314.84">φ(r) = −R²Ṙ / r</tspan>
</text>
<text id="o046" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="760.32" y="356.547">3  Differentiate in space</tspan>
</text>
<text id="o047" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="774.72" y="381.947">∂φ/∂r = R²Ṙ / r² = u  ✓</tspan>
</text>
<text id="o048" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="760.32" y="422.987">Why the reference is fixed first</tspan>
</text>
<text id="o049" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="774.72" y="448.387">φ is defined only up to a constant. Setting φ(∞) =</tspan>
<tspan x="774.72" y="468.053">0 before taking any time derivative keeps Eq.</tspan>
<tspan x="774.72" y="487.72">C1-E04 unambiguous.</tspan>
</text>
<text id="o050" font-family="Arial,sans-serif" font-size="16.6667" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="93.12" y="634.787">Plot for R = 1, Ṙ = 1; the shape is the same for any R and Ṙ.</tspan>
</text>
<text id="o051" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Potential from Eq. C1-E03.</tspan>
</text>
</svg>
