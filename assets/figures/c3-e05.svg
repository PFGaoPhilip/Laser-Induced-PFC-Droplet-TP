<tspan x="167.04" y="165.76">isolated bubble</tspan>
</text>
<rect id="o032" x="124.8" y="190.08" width="28.8" height="19.2" fill="#F2B880" stroke="#F2B880" stroke-width="1.33333" opacity="1"/>
<text id="o033" font-family="Arial,sans-serif" font-size="16" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="167.04" y="200.32">identical neighbour, d = 30 µm</tspan>
</text>
<rect id="o034" x="124.8" y="224.64" width="28.8" height="19.2" fill="#F28BA0" stroke="#F28BA0" stroke-width="1.33333" opacity="1"/>
<text id="o035" font-family="Arial,sans-serif" font-size="16" fill="#F28BA0" text-anchor="start" opacity="1">
<tspan x="167.04" y="234.88">identical neighbour, d = 15 µm</tspan>
</text>
<rect id="o036" x="748.8" y="144" width="494.4" height="384" rx="30.72" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o037" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="762.24" y="166.44">Same equation, extra inertia</tspan>
</text>
<text id="o038" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="765.12" y="207.04">R_iR̈ᵢ + (3/2)Ṙᵢ² + Σ (Rⱼ²R̈ⱼ + 2RⱼṘⱼ²)/dᵢⱼ = Bᵢ</tspan>
</text>
<text id="o039" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="765.12" y="288.093">Bᵢ = [p_b,i − p∞ − 2σ_b/Rᵢ − 4μṘᵢ/Rᵢ] / ρ  (isolated</tspan>
<tspan x="765.12" y="306.187">driving)</tspan>
</text>
<text id="o040" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="786.24" y="360.64">Identical neighbours move together, so the extra</tspan>
<tspan x="786.24" y="379.52">term acts as added liquid mass.</tspan>
</text>
<ellipse id="o041" cx="770.88" cy="355.52" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o042" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="786.24" y="409.28">The closer the neighbour, the slower the expansion.</tspan>
</text>
<ellipse id="o043" cx="770.88" cy="404.16" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o044" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="786.24" y="438.4">Energy is shared, not created.</tspan>
</text>
<ellipse id="o045" cx="770.88" cy="433.28" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o046" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="617.507">Two identical bubbles (p_g0 = 1 MPa, γ = 1.4) integrated with the coupled equation of Eq. C3-E05.</tspan>
</text>
<text id="o047" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Coupled spherical approximation of Eq. C3-E05 for N = 2 identical bubbles.</tspan>
</text>
</svg>
