<title id="title">C4-E40 — Two integrations by parts expose the boundary moment and shear terms before they are removed.</title>
<desc id="desc">Ω_f — plate interior; ∂Ω_f, dℓ — fixed clamped edge; w, δw — displacement and variation; B_αβ, D_f, ν_f — curvature moments; n_α, n_β — in-plane boundary normal; δU_b, δU_T — virtual energy; T₀ — pretension; boundary: δw = 0, ∂ₙδw = 0; The first bending boundary term contains the slope variation.; The second contains the displacement variation; both vanish at the clamp.</desc>
