<tspan x="167.04" y="448">χ = S Rₘₐₓ = 1</tspan>
</text>
<rect id="o043" x="124.8" y="472.32" width="28.8" height="19.2" fill="#F28BA0" stroke="#F28BA0" stroke-width="1.33333" opacity="1"/>
<text id="o044" font-family="Arial,sans-serif" font-size="16" fill="#F28BA0" text-anchor="start" opacity="1">
<tspan x="167.04" y="482.56">χ = S Rₘₐₓ = 3</tspan>
</text>
<rect id="o045" x="758.4" y="144" width="484.8" height="384" rx="30.72" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o046" font-family="Arial,sans-serif" font-size="17.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="771.84" y="165.893">Symmetric constant-pressure control</tspan>
</text>
<text id="o047" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="774.72" y="207.587">(1 + SR) R R̈ + (3/2 + 2SR) Ṙ² = −Δp_c / ρ</tspan>
</text>
<text id="o048" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="795.84" y="279.04">S = S_N is the reciprocal-distance sum from the</tspan>
<tspan x="795.84" y="297.92">polygon.</tspan>
</text>
<ellipse id="o049" cx="780.48" cy="273.92" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o050" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="795.84" y="327.68">Start at rest at Rₘₐₓ: R(0) = Rₘₐₓ, Ṙ(0) = 0.</tspan>
</text>
<ellipse id="o051" cx="780.48" cy="322.56" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o052" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="795.84" y="356.8">Larger χ means stronger coupling and a later</tspan>
<tspan x="795.84" y="375.68">collapse.</tspan>
</text>
<ellipse id="o053" cx="780.48" cy="351.68" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o054" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="795.84" y="405.44">Surface tension and viscosity are omitted in this</tspan>
<tspan x="795.84" y="424.32">ideal control.</tspan>
</text>
<ellipse id="o055" cx="780.48" cy="400.32" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o056" font-family="Arial,sans-serif" font-size="16.6667" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="97.92" y="617.507">Inputs: Rₘₐₓ = 30 µm, ρ = 1000 kg/m³, Δp_c = 100 kPa. Dashed lines mark each collapse time.</tspan>
</text>
<text id="o057" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Numerical integration of Eq. C3-E07.</tspan>
</text>
</svg>
