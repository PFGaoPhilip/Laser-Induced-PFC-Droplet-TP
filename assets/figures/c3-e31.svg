<text id="o029" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="856.32" y="165.76">Rₘₐₓ,N / R_*</tspan>
</text>
<polyline id="o030" points="912,213.382 925.2,267.395 938.4,293.665 951.6,310.265 964.8,322.088 978,331.116 991.2,338.332 1004.4,344.291 1017.6,349.331 1030.8,353.675 1044,357.475 1057.2,360.84 1070.4,363.851 1083.6,366.568 1096.8,369.038 1110,371.297 1123.2,373.376 1136.4,375.298 1149.6,377.082 1162.8,378.745 1176,380.301 1189.2,381.762 1202.4,383.136 1215.6,384.433 1228.8,385.659" fill="none" stroke="#8EDBD4" stroke-width="4" opacity="1"/>
<text id="o031" font-family="Arial,sans-serif" font-size="17.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="808.32" y="116.933">Fixed total work shrinks each bubble</tspan>
</text>
<rect id="o032" x="38.4" y="96" width="739.2" height="249.6" rx="19.968" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o033" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="51.84" y="118.44">Coupled radial equation</tspan>
</text>
<text id="o034" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="54.72" y="159.04">R_iR̈ᵢ + (3/2)Ṙᵢ² = [p_b,i − p∞ − 2σ_b/Rᵢ − 4μṘᵢ/Rᵢ]/ρ − Σ_{j≠i} (Rⱼ²R̈ⱼ +</tspan>
<tspan x="54.72" y="177.92">2RⱼṘⱼ²)/dᵢⱼ</tspan>
</text>
<text id="o035" font-family="Arial,sans-serif" font-size="16.6667" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="54.72" y="241.187">Neighbours change the pressure each bubble feels, so single-bubble results</tspan>
<tspan x="54.72" y="260.853">cannot simply be multiplied by the count.</tspan>
</text>
<rect id="o036" x="38.4" y="364.8" width="739.2" height="240" rx="19.2" fill="#213E4B" stroke="#F2B880" stroke-width="2.13333" opacity="1"/>
<text id="o037" font-family="Arial,sans-serif" font-size="18" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="51.84" y="387.24">Fixed total pressure work</tspan>
</text>
<text id="o038" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="54.72" y="428.933">E_B,tot = N (4π/3) Δp_c Rₘₐₓ,N³,   Rₘₐₓ,N = R_* N^(−1/3)</tspan>
</text>
<text id="o039" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="54.72" y="495.04">Identical constant-pressure ideal cavities; the coupled row needs far separation.</tspan>
</text>
<text id="o040" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="808.32" y="548.387">Use connectivity and source allocation before</tspan>
<tspan x="808.32" y="568.053">summing outputs.</tspan>
</text>
<text id="o041" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Reference formulas of the Defence 1 answer: Eqs. C3-E05 and C3-E11.</tspan>
</text>
