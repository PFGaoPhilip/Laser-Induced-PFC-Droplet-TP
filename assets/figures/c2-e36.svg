<line id="o007" x1="240" y1="307.2" x2="336" y2="307.2" fill="#FFFFFF" stroke="#8EDBD4" stroke-width="2.66667" opacity="1" marker-end="url(#head)"/>
<text id="o008" font-family="Arial,sans-serif" font-size="15.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="69.12" y="163.293">liquid</tspan>
</text>
<text id="o009" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="251.52" y="163.293">vapor</tspan>
</text>
<text id="o010" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="64.32" y="457.733">jₛ Lᵥ,s = (qₗ − qᵥ)·n</tspan>
</text>
<text id="o011" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="64.32" y="513.693">unbalanced heat becomes latent heat</tspan>
</text>
<rect id="o012" x="451.2" y="105.6" width="384" height="470.4" rx="30.72" fill="#213E4B" stroke="#F2B880" stroke-width="2.13333" opacity="1"/>
<text id="o013" font-family="Arial,sans-serif" font-size="18" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="464.64" y="128.04">Bubble ledger</tspan>
</text>
<ellipse id="o014" cx="643.2" cy="307.2" rx="81.6" ry="81.6" fill="#0C1820" stroke="#F2B880" stroke-width="3.2" opacity="1"/>
<text id="o015" font-family="Arial,sans-serif" font-size="20" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="643.2" y="311.12">U_b</tspan>
</text>
<line id="o016" x1="475.2" y1="307.2" x2="556.8" y2="307.2" fill="#FFFFFF" stroke="#F28BA0" stroke-width="4" opacity="1" marker-end="url(#head)"/>
<line id="o017" x1="729.6" y1="249.6" x2="796.8" y2="201.6" fill="#FFFFFF" stroke="#F2B880" stroke-width="4" opacity="1" marker-end="url(#head)"/>
<line id="o018" x1="643.2" y1="172.8" x2="643.2" y2="220.8" fill="#FFFFFF" stroke="#8EDBD4" stroke-width="4" opacity="1" marker-end="url(#head)"/>
<text id="o019" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="467.52" y="457.187">U̇_b = Q̇_b − p_b V̇_b + Σ hᵥ,s ṁᵥ,s</tspan>
</text>
<text id="o020" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="467.52" y="523.293">heat, work and carried enthalpy</tspan>
</text>
<rect id="o021" x="854.4" y="105.6" width="384" height="470.4" rx="30.72" fill="#213E4B" stroke="#F28BA0" stroke-width="2.13333" opacity="1"/>
<text id="o022" font-family="Arial,sans-serif" font-size="18" fill="#F28BA0" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="867.84" y="128.04">Velocity slip</tspan>
</text>
<line id="o023" x1="883.2" y1="384" x2="883.2" y2="182.4" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="1.6" opacity="1"/>
<line id="o024" x1="892.8" y1="259.2" x2="1113.6" y2="259.2" fill="#FFFFFF" stroke="#F2B880" stroke-width="4.66667" opacity="1" marker-end="url(#head)"/>
<line id="o025" x1="892.8" y1="326.4" x2="1065.6" y2="326.4" fill="#FFFFFF" stroke="#8EDBD4" stroke-width="4.66667" opacity="1" marker-end="url(#head)"/>
<text id="o026" font-family="Arial,sans-serif" font-size="15.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="899.52" y="225.693">wall: Ṙ</tspan>
</text>
<text id="o027" font-family="Arial,sans-serif" font-size="15.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="899.52" y="345.693">liquid: uₗ(R)</tspan>
</text>
<text id="o028" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="870.72" y="457.733">uₗ(R) = Ṙ − jₛ / ρₗ</tspan>
</text>
<text id="o029" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="870.72" y="513.693">evaporation separates them</tspan>
</text>
<text id="o030" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="49.92" y="611.333">Conserved energy and mass at the interface prevent unlimited vapor and double-counted latent heat.</tspan>
</text>
<text id="o031" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Reference formulas of Defence 4: Eqs. C2-E20, E21, E22.</tspan>
</text>
