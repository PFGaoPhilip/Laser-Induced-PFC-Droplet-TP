<text id="o008" font-family="Arial,sans-serif" font-size="16" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="97.92" y="461.44">v(z): speed grows along z, so the column is stretched and thins</tspan>
</text>
<rect id="o009" x="288" y="192" width="115.2" height="307.2" fill="none" stroke="#F28BA0" stroke-width="2.4" opacity="1"/>
<text id="o010" font-family="Arial,sans-serif" font-size="16" fill="#F28BA0" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="261.12" y="163.84">slice Δz</tspan>
</text>
<line id="o011" x1="244.8" y1="249.6" x2="283.2" y2="249.6" fill="#FFFFFF" stroke="#8EDBD4" stroke-width="3.2" opacity="1" marker-end="url(#head)"/>
<line id="o012" x1="408" y1="249.6" x2="446.4" y2="249.6" fill="#FFFFFF" stroke="#8EDBD4" stroke-width="3.2" opacity="1" marker-end="url(#head)"/>
<text id="o013" font-family="Arial,sans-serif" font-size="16" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="97.92" y="533.44">[Av](z)</tspan>
</text>
<text id="o014" font-family="Arial,sans-serif" font-size="16" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="443.52" y="533.44">[Av](z + Δz)</tspan>
</text>
<rect id="o015" x="796.8" y="96" width="446.4" height="508.8" rx="35.712" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o016" font-family="Arial,sans-serif" font-size="17.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="810.24" y="117.893">Volume balance of the slice</tspan>
</text>
<text id="o017" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="813.12" y="163.84">A = πa²;  ∂ₜ∫A dξ = [Av](z) − [Av](z + Δz)</tspan>
</text>
<text id="o018" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="813.12" y="241.733">Δz → 0:  ∂ₜA + ∂_z(Av) = 0</tspan>
</text>
<text id="o019" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="813.12" y="302.493">dividing by 2πa:</tspan>
</text>
<text id="o020" font-family="Arial,sans-serif" font-size="18.6667" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="813.12" y="343.627">∂ₜa + v ∂_z a = −(a/2) ∂_z v</tspan>
</text>
<text id="o021" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="813.12" y="418.24">If ∂_z v &gt; 0 the right side is negative: the</tspan>
<tspan x="813.12" y="437.12">radius shrinks even before capillary necking</tspan>
<tspan x="813.12" y="456">grows.</tspan>
</text>
<text id="o022" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Slender-jet volume conservation of Eq. C3-E19; schematic geometry.</tspan>
</text>
</svg>
