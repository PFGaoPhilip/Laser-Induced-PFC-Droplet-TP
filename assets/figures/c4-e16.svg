<tspan x="123.456" y="492.596">clamped at r = b: w = w′ = 0</tspan>
</text>
<rect id="o032" x="720" y="144" width="523.2" height="374.4" rx="29.952" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o033" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="733.44" y="166.44">Fixing C₂ and C₄</tspan>
</text>
<text id="o034" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="736.32" y="207.587">w′(b) = 0:  C₂ = −p₀b² / (8D_f)</tspan>
</text>
<text id="o035" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="736.32" y="265.187">w(b) = 0:  C₄ = p₀b⁴ / (64D_f)</tspan>
</text>
<text id="o036" font-family="Arial,sans-serif" font-size="20" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="736.32" y="339.92">w(r) = p₀ (b² − r²)² / (64D_f)</tspan>
</text>
<text id="o037" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="736.32" y="408.64">Unique regular solution; the profile is a squared</tspan>
<tspan x="736.32" y="427.52">parabola.</tspan>
</text>
<text id="o038" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="591.587">Both edge conditions are satisfied exactly; there is no free constant left.</tspan>
</text>
<text id="o039" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Exact solution of Eq. C4-E16, drawn as w/w(0) = (1 − (r/b)²)².</tspan>
</text>
