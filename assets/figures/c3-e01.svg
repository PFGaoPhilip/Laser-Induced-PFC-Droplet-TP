<tspan x="516.053" y="241.973">all 25: 27.7 %</tspan>
</text>
<rect id="o051" x="758.4" y="144" width="484.8" height="384" rx="30.72" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o052" font-family="Arial,sans-serif" font-size="17.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="771.84" y="165.893">N_d = 25 independent sites, pₐ = 0.95</tspan>
</text>
<text id="o053" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="774.72" y="207.04">E[N_b] = N_d pₐ</tspan>
</text>
<text id="o054" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="1096.32" y="208.133">23.75</tspan>
</text>
<text id="o055" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="774.72" y="259.84">Var(N_b) = N_d pₐ (1 − pₐ)</tspan>
</text>
<text id="o056" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="1096.32" y="260.933">1.1875</tspan>
</text>
<text id="o057" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="774.72" y="312.64">CV = √[(1 − pₐ)/(N_d pₐ)]</tspan>
</text>
<text id="o058" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="1096.32" y="313.733">4.588 %</tspan>
</text>
<text id="o059" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="774.72" y="365.44">Pr(N_b = N_d) = pₐ^N_d</tspan>
</text>
<text id="o060" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="1096.32" y="366.533">0.27739</tspan>
</text>
<text id="o061" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="774.72" y="432.64">Count reproducibility (CV small) and complete</tspan>
<tspan x="774.72" y="451.52">activation (all 25) are different tests: here CV is</tspan>
<tspan x="774.72" y="470.4">4.6 % but all 25 fire in only 28 % of shots.</tspan>
</text>
<text id="o062" font-family="Arial,sans-serif" font-size="16.6667" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="97.92" y="617.507">Binomial model: sites activate independently with the same probability; common heating or feedback would break that assumption.</tspan>
</text>
<text id="o063" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Statistics of Eq. C3-E01 (exact binomial distribution).</tspan>
</text>
