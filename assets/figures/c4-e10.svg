<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1279.97 720" role="img">
<title>C4-E10</title>
<defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/></marker></defs>
<rect width="1279.97" height="720" fill="#142632"/>
<text id="o000" font-family="Arial,sans-serif" font-size="25.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="30.72" y="35.1733">C4-E10 · Derived term-balance estimates</tspan>
</text>
<text id="o001" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="49.92" y="112.68">Compare the pulse with three response times</tspan>
</text>
<text id="o002" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="49.92" y="171.107">t_b = a_f² √(m_A/D_f)  (bending)</tspan>
</text>
<rect id="o003" x="566.4" y="153.6" width="311.905" height="48" fill="#F2B880" stroke="#F2B880" stroke-width="1.33333" opacity="0.85"/>
<text id="o004" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="887.905" y="173.987">3.5e+03 ns</tspan>
</text>
<text id="o005" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="49.92" y="247.907">t_T = a_f √(m_A/T₀)  (tension, T₀ = 1 N/m)</tspan>
</text>
<rect id="o006" x="566.4" y="230.4" width="368.164" height="48" fill="#7FC8F8" stroke="#7FC8F8" stroke-width="1.33333" opacity="0.85"/>
<text id="o007" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="944.164" y="250.787">1.53e+04 ns</tspan>
</text>
<text id="o008" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="49.92" y="324.707">tₙ = √(m_A/Kₙ)  (cohesive, Kₙ = 10¹³ Pa/m)</tspan>
</text>
<rect id="o009" x="566.4" y="307.2" width="148.164" height="48" fill="#F28BA0" stroke="#F28BA0" stroke-width="1.33333" opacity="0.85"/>
<text id="o010" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="724.164" y="327.587">48.3 ns</tspan>
</text>
<text id="o011" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="49.92" y="401.507">impulse-equivalent pulse τ_eq</tspan>
</text>
<rect id="o012" x="566.4" y="384" width="134.522" height="48" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="0.85"/>
<text id="o013" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="710.522" y="404.387">33.8 ns</tspan>
</text>
<rect id="o014" x="48" y="480" width="576" height="144" rx="11.52" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o015" font-family="Arial,sans-serif" font-size="17.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="61.44" y="501.893">Short pulse</tspan>
</text>
<text id="o016" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="64.32" y="538.24">τ ≪ response time: the film cannot react during the pulse, so it</tspan>
<tspan x="64.32" y="557.12">gets a free velocity (Eq. C4-E09).</tspan>
</text>
<rect id="o017" x="652.8" y="480" width="576" height="144" rx="11.52" fill="#213E4B" stroke="#F2B880" stroke-width="2.13333" opacity="1"/>
<text id="o018" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="666.24" y="501.893">Long pulse</tspan>
</text>
<text id="o019" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="669.12" y="538.24">τ ≳ response time: elastic and cohesive reactions act during the</tspan>
<tspan x="669.12" y="557.12">pulse and reduce the net impulse.</tspan>
</text>
<text id="o020" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Term-balance times of Eq. C4-E10 for a_f = 100 µm, h_f = 10 µm (E_f = 2 GPa, ν = 0.35); T₀ and Kₙ are illustrative.</tspan>
</text>
</svg>
