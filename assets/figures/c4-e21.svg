<tspan x="135.36" y="211.84">G/Γ = (p₀/p₀,crit)²</tspan>
</text>
<rect id="o039" x="720" y="144" width="523.2" height="374.4" rx="29.952" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
