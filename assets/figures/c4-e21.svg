<tspan x="733.44" y="166.44">Threshold pressure</tspan>
</text>
<text id="o041" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="736.32" y="208.133">Gₚ₀ = Γ  ⇒  p₀,crit = √(128 D_f Γ) / b²</tspan>
</text>
<text id="o042" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="736.32" y="294.533">G / Γ = (p₀ / p₀,crit)²</tspan>
</text>
<text id="o043" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="757.44" y="360.64">Doubling p₀ quadruples G.</tspan>
</text>
<ellipse id="o044" cx="742.08" cy="355.52" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o045" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="757.44" y="389.76">A bigger blister (b) lowers the pressure needed as 1/b².</tspan>
</text>
<ellipse id="o046" cx="742.08" cy="384.64" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o047" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="591.587">The threshold depends on geometry and fracture resistance, not on pressure alone: a pressure peak without b and Γ says nothing.</tspan>
</text>
<text id="o048" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
