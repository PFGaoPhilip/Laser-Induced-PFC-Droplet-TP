<tspan x="130.56" y="389.44">line: 1 − (R/Rₘₐₓ)³ from Eq. C1-E17</tspan>
</text>
<text id="o059" font-family="Arial,sans-serif" font-size="16" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="130.56" y="440.64">dots: direct ODE solution; largest</tspan>
<tspan x="130.56" y="459.52">difference 9e-11</tspan>
</text>
<rect id="o060" x="768" y="144" width="475.2" height="384" rx="30.72" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o061" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="781.44" y="166.44">Two independent routes</tspan>
</text>
<text id="o062" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="784.32" y="207.587">Route 1: speed solution</tspan>
<tspan x="784.32" y="227.253">Kₗ = 2πρR³Ṙ² with Ṙ from Eq. C1-E14</tspan>
</text>
<text id="o063" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="784.32" y="303.587">Route 2: pressure work</tspan>
<tspan x="784.32" y="323.253">E_B = Δp_c Vₘₐₓ = (4π/3) Δp_c Rₘₐₓ³</tspan>
</text>
<text id="o064" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="784.32" y="399.587">Kₗ/E_B = 1 − (R/Rₘₐₓ)³  holds at every radius, so</tspan>
<tspan x="784.32" y="419.253">no energy is created or lost.</tspan>
</text>
<text id="o065" font-family="Arial,sans-serif" font-size="18" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="618.6">Half the radius has released 7/8 of the stored pressure work as kinetic energy.</tspan>
</text>
<text id="o066" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Dots: numerical integration of R R̈ + 3Ṙ²/2 = −Δp_c/ρ (Eq. C1-E12); no viscosity, tension or gas.</tspan>
</text>
</svg>
