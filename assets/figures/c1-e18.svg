<text x="32" y="450.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">Δpc</text>
<text x="32" y="474.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">Rmax</text>
