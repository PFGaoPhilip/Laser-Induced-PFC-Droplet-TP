<text x="507" y="498.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">Kl/EB = 1 − (R/Rmax)³</text>
<text x="32" y="537.28" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2">Finite energy survives the excluded zero-radius speed singularity</text>
