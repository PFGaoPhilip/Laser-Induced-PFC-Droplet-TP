<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1279.97 720" role="img">
<title>A-E14</title>
<defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/></marker></defs>
<rect width="1279.97" height="720" fill="#142632"/>
<text id="o000" font-family="Arial,sans-serif" font-size="25.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="30.72" y="35.1733">A-E14 · Finite work-budget comparison</tspan>
</text>
<text id="o001" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="49.92" y="112.68">Work needed to open the cavity against a 100 kPa overpressure</tspan>
</text>
<text id="o002" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="49.92" y="171.653">available  W₁₀₀ = Δp_w ΔV</tspan>
</text>
<rect id="o003" x="489.6" y="153.6" width="544.677" height="52.8" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="0.85"/>
<text id="o004" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="1043.88" y="174.533">11.257 nJ</tspan>
</text>
<text id="o005" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="49.92" y="253.253">elastic cost  W_g</tspan>
</text>
<rect id="o006" x="489.6" y="235.2" width="218.504" height="52.8" fill="#F28BA0" stroke="#F28BA0" stroke-width="1.33333" opacity="0.85"/>
<text id="o007" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="717.704" y="256.133">4.516 nJ</tspan>
</text>
<text id="o008" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="49.92" y="334.853">left over  W₁₀₀ − W_g</tspan>
</text>
<rect id="o009" x="489.6" y="316.8" width="326.173" height="52.8" fill="#A8E6A1" stroke="#A8E6A1" stroke-width="1.33333" opacity="0.85"/>
<text id="o010" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="825.373" y="337.733">6.741 nJ</tspan>
</text>
<rect id="o011" x="48" y="412.8" width="576" height="182.4" rx="14.592" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o012" font-family="Arial,sans-serif" font-size="17.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="61.44" y="434.693">Volume and budget</tspan>
</text>
<text id="o013" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="64.32" y="475.84">ΔV = (4π/3)(R³ − R_ref³) = 1.12573737e-13 m³</tspan>
</text>
<text id="o014" font-family="Arial,sans-serif" font-size="16" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="64.32" y="533.44">W₁₀₀ = (100 kPa)(ΔV) = 11.2574 nJ</tspan>
</text>
<rect id="o015" x="652.8" y="412.8" width="576" height="182.4" rx="14.592" fill="#213E4B" stroke="#F28BA0" stroke-width="2.13333" opacity="1"/>
<text id="o016" font-family="Arial,sans-serif" font-size="17.3333" fill="#F28BA0" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="666.24" y="434.693">Fraction</tspan>
</text>
<text id="o017" font-family="Arial,sans-serif" font-size="20" fill="#F28BA0" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="669.12" y="479.12">W_g / W₁₀₀ = 0.401163</tspan>
</text>
<text id="o018" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="669.12" y="538.24">about 40 % of the work budget is taken by elasticity</tspan>
</text>
<text id="o019" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Finite work-budget comparison of Eq. A-E14 (Δp_w = 100 kPa).</tspan>
</text>
</svg>
