<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1279.97 720" role="img">
<title>A-E18</title>
<defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/></marker></defs>
<rect width="1279.97" height="720" fill="#142632"/>
<text id="o000" font-family="Arial,sans-serif" font-size="25.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="30.72" y="35.1733">A-E18 · Teaching response-time comparison</tspan>
</text>
<text id="o001" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="49.92" y="112.68">How long does the gel need to answer, compared with the collapse it is meant to follow?</tspan>
</text>
<text id="o002" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="49.92" y="171.653">shear-wave crossing  tₛ = L_g / cₛ</tspan>
</text>
<rect id="o003" x="528" y="153.6" width="474.941" height="57.6" fill="#F2B880" stroke="#F2B880" stroke-width="1.33333" opacity="0.85"/>
<text id="o004" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="1012.54" y="174.533">6.7082 µs</tspan>
</text>
<text id="o005" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="49.92" y="262.853">ideal liquid collapse  t_c,liq</tspan>
</text>
<rect id="o006" x="528" y="244.8" width="194.278" height="57.6" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="0.85"/>
<text id="o007" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="731.878" y="265.733">2.7440 µs</tspan>
</text>
<rect id="o008" x="48" y="374.4" width="576" height="220.8" rx="17.664" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o009" font-family="Arial,sans-serif" font-size="17.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="61.44" y="396.293">Numbers</tspan>
</text>
<text id="o010" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="64.32" y="437.44">cₛ = √(G_g/ρ_g) = 4.47213595 m/s</tspan>
</text>
<text id="o011" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="64.32" y="490.24">tₛ = 30 µm / cₛ = 6.70820393 µs</tspan>
</text>
<text id="o012" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="64.32" y="542.493">t_c,liq = 0.91468 Rₘₐₓ √(ρₗ/Δp_c) = 2.74404407 µs</tspan>
</text>
<rect id="o013" x="652.8" y="374.4" width="576" height="220.8" rx="17.664" fill="#213E4B" stroke="#F2B880" stroke-width="2.13333" opacity="1"/>
<text id="o014" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="666.24" y="396.293">Ratio</tspan>
</text>
<text id="o015" font-family="Arial,sans-serif" font-size="20" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="669.12" y="450.32">tₛ / t_c,liq = 2.44464147</tspan>
</text>
<text id="o016" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="669.12" y="514.24">The gel communicates slower than the ideal liquid collapses: it</tspan>
<tspan x="669.12" y="533.12">cannot be treated as quasi-static over the event.</tspan>
</text>
<text id="o017" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Teaching response-time comparison of Eq. A-E18 (Rₘₐₓ = 30 µm, ρₗ = 1000 kg/m³, Δp_c = 100 kPa, L_g = 30 µm).</tspan>
</text>
</svg>
