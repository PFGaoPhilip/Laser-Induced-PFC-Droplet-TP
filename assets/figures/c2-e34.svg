<text x="112" y="319.44" font-family="Arial,sans-serif" font-size="18" fill="#E7F0F3">Integrate the local rate over space and time.</text>
<text x="32" y="426.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">T, p: local hot state</text>
<text x="32" y="450.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">V_d(t′): available liquid</text>
<text x="32" y="474.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">P_act: activation probability</text>
<text x="507" y="426.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">J: supplied event rate</text>
<text x="507" y="450.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">t, t′, dV: event integration</text>
<text x="32" y="532.28" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2">A rate law or calibrated activation law is still required</text>
<text x="32" y="556.28" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2">One absent event does not prove impossibility</text>
