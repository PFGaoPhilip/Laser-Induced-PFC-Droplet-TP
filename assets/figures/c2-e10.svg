<title id="title">C2-E10 — A short pulse does not imply uniform temperature in a micron-scale core.</title>
<desc id="desc">α_d = 4.69034×10⁻⁸ m²/s; L_h = 5 μm; τ_h = 10 ns; t_th ≈ 533 μs; δ_T ≈ 21.66 nm; k_d = 0.050, ρ_d = 1630, c_p,d = 654 (SI); Heated shell is much thinner than the core; Distributed absorbers or later conduction must justify a uniform-core model</desc>
