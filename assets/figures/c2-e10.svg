<tspan x="752.64" y="166.44">Declared numbers</tspan>
</text>
<text id="o049" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="755.52" y="207.587">α = 0.050 / (1630 × 654)</tspan>
</text>
<text id="o050" font-family="Arial,sans-serif" font-size="18.6667" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="769.92" y="234.36">= 4.690×10⁻⁸ m²/s</tspan>
</text>
<text id="o051" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="755.52" y="274.693">tₜₕ ~ (5 µm)² / α</tspan>
</text>
<text id="o052" font-family="Arial,sans-serif" font-size="18.6667" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="769.92" y="301.467">= 5.33×10⁻⁴ s</tspan>
</text>
<text id="o053" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="755.52" y="341.8">δ_T ~ √(α × 10 ns)</tspan>
</text>
<text id="o054" font-family="Arial,sans-serif" font-size="18.6667" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="769.92" y="368.573">= 2.17×10⁻⁸ m</tspan>
</text>
<text id="o055" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="755.52" y="417.96">A 10 ns pulse heats a layer 230 times thinner than the</tspan>
<tspan x="755.52" y="436.84">droplet radius. Uniform temperature in a micron-scale</tspan>
<tspan x="755.52" y="455.72">core is not implied by a short pulse.</tspan>
</text>
<text id="o056" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
