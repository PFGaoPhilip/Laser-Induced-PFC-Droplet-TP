<tspan x="834.24" y="319.12">temperature T_b (heating raises p)</tspan>
</text>
<ellipse id="o046" cx="818.88" cy="313.867" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o047" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="834.24" y="349.053">volume V_b (expansion lowers p)</tspan>
</text>
<ellipse id="o048" cx="818.88" cy="343.8" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o049" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="813.12" y="432.64">This ideal-mixture control is a first model; a</tspan>
<tspan x="813.12" y="451.52">real-mixture equation of state p = 𝒫(ρ_b, e_b, Y)</tspan>
<tspan x="813.12" y="470.4">is the required refinement.</tspan>
</text>
<text id="o050" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="617.507">Curve for the fixed PFP inventory of a 5 µm droplet (0.8535 ng) at 323 K. Expansion alone drops p by a factor 1000 for a tenfold</tspan>
<tspan x="97.92" y="637.173">radius.</tspan>
</text>
