<tspan x="285.781" y="208.468">p ∝ m T / R³ for fixed m, T</tspan>
</text>
<rect id="o040" x="796.8" y="144" width="446.4" height="384" rx="30.72" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o041" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="810.24" y="166.44">Pressure responds to three things</tspan>
</text>
<text id="o042" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="813.12" y="207.587">pᵥ,s V_b = (mᵥ,s / Mₛ) Rᵤ T_b</tspan>
<tspan x="813.12" y="227.253">p_b = Σ pᵥ,s</tspan>
</text>
<text id="o043" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="834.24" y="289.187">species mass mᵥ,s (evaporation raises p)</tspan>
</text>
<ellipse id="o044" cx="818.88" cy="283.933" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
