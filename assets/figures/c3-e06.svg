<text id="o028" font-family="Arial,sans-serif" font-size="18.6667" fill="#F2B880" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="1036.8" y="545.227">S₅ s = 3.2361</tspan>
</text>
<text id="o029" font-family="Arial,sans-serif" font-size="18.6667" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="49.92" y="118.027">Regular polygons of N bubbles, neighbouring distance s</tspan>
</text>
<text id="o030" font-family="Arial,sans-serif" font-size="18.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="49.92" y="161.227">dₖ = s sin(kπ/N) / sin(π/N),   S_N = Σₖ₌₁^{N−1} 1/dₖ</tspan>
</text>
<text id="o031" font-family="Arial,sans-serif" font-size="18" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="49.92" y="592.68">S₃ = 2/s,   S₄ = (2 + 1/√2)/s,   S₅ = (2 + 2/φ)/s,   φ = (1 + √5)/2</tspan>
</text>
<text id="o032" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="49.92" y="639.587">Every bubble sees the same sum of reciprocal distances, so they can share one radius history in this constrained control.</tspan>
</text>
<text id="o033" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Exact polygon geometry of Eq. C3-E06 (chords drawn dashed).</tspan>
</text>
