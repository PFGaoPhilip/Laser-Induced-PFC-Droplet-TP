<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" role="img" aria-labelledby="title desc">
<title id="title">C2-E09 — Compare heat penetration with the distance to the PFC, not only with beam width.</title>
<desc id="desc">L_h: absorber-to-core heating distance; δ_T: penetration during τ_h; α = k/(ρc_p); ΔT: thermal change; t_th: diffusion time; τ_h: available heating duration; Long distance costs time quadratically; Optical pulse duration is not automatically whole-core heating duration</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#8edbd4"/></marker></defs>
