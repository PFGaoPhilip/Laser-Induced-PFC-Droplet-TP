<text x="245" y="164" class="">Lh</text>
<text x="492" y="314" class="">PFC core / PFC 液核</text>
<text x="91" y="89" class="">Absorber / 吸收体</text>
<text x="658" y="165" class="">δT ~ √(α τh)</text>
<text x="653" y="200" class="">α = k / (ρ cp)</text>
<text x="653" y="240" class="">tth ~ Lh² / α</text>
