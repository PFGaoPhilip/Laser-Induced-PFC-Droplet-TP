<text x="30" y="382" class="muted">Variables in this equation / 本式变量</text>
<text x="30" y="409" class="muted">• L_h: absorber-to-core heating distance</text>
<text x="30" y="433" class="muted">• δ_T: penetration during τ_h</text>
<text x="30" y="457" class="muted">• α = k/(ρc_p)</text>
