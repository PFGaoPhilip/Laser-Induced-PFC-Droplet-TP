<text id="o056" font-family="Arial,sans-serif" font-size="16" fill="#8EDBD4" text-anchor="start" opacity="1">
<tspan x="782.4" y="502.72">R³y = 1 − x³: simple, slope ∝ −R²</tspan>
</text>
<rect id="o057" x="38.4" y="96" width="614.4" height="518.4" rx="41.472" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o058" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="51.84" y="118.44">Why the radius replaces time</tspan>
</text>
<text id="o059" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="59.52" y="164.933">1  y(R) = Ṙ²,  Ṙ ≠ 0</tspan>
</text>
<text id="o060" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="83.52" y="197.573">dy/dR = 2R̈</tspan>
</text>
<text id="o061" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="59.52" y="252.32">2  Rewrite R R̈ + (3/2)Ṙ² = −Δp_c/ρ</tspan>
</text>
<text id="o062" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="83.52" y="284.96">y′ + 3y/R = −2Δp_c/(ρR)</tspan>
</text>
<text id="o063" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="59.52" y="339.707">3  Multiply by the integrating factor R³</tspan>
</text>
<text id="o064" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="83.52" y="372.347">d(R³y)/dR = R³y′ + 3R²y = −(2Δp_c/ρ) R²</tspan>
</text>
<text id="o065" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="59.52" y="427.093">4  Integrate from Rₘₐₓ (y = 0)</tspan>
</text>
<text id="o066" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="83.52" y="459.733">R³y = (2Δp_c/3ρ)(Rₘₐₓ³ − R³)</tspan>
</text>
<text id="o067" font-family="Arial,sans-serif" font-size="16.6667" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="59.52" y="518.733">On the monotonic inward branch R is a valid independent</tspan>
<tspan x="59.52" y="538.4">variable. The factor R³ makes the left side an exact derivative.</tspan>
</text>
<text id="o068" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Curves are y = Ṙ² and R³y from Eqs. C1-E13 and C1-E14 (scaled as labelled).</tspan>
</text>
</svg>
