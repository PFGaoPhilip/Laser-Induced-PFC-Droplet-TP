<text id="o035" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="491.52" y="166.444">barrier W* at r* = 2σ/Δpₙ</tspan>
</text>
<text id="o036" font-family="Arial,sans-serif" font-size="15.3333" fill="#F28BA0" text-anchor="start" opacity="1">
<tspan x="124.8" y="194.608">surface cost 4πσr² (grows as r²)</tspan>
</text>
<text id="o037" font-family="Arial,sans-serif" font-size="15.3333" fill="#7FC8F8" text-anchor="start" opacity="1">
<tspan x="336" y="487.179">volume gain −(4π/3)Δpₙ r³</tspan>
</text>
<text id="o038" font-family="Arial,sans-serif" font-size="17.3333" fill="#8EDBD4" text-anchor="start" opacity="1">
<tspan x="549.12" y="324.248">net W</tspan>
</text>
<rect id="o039" x="739.2" y="144" width="504" height="384" rx="30.72" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o040" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="752.64" y="166.44">A new interface costs energy first</tspan>
</text>
<text id="o041" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="755.52" y="208.133">W(rₙ) = 4πσᵥₚ rₙ² − (4π/3) Δpₙ rₙ³</tspan>
</text>
<text id="o042" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="776.64" y="269.987">Small nuclei: surface term wins, W rises.</tspan>
</text>
<ellipse id="o043" cx="761.28" cy="264.733" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o044" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="776.64" y="299.92">Large nuclei: volume term wins, W falls.</tspan>
</text>
<ellipse id="o045" cx="761.28" cy="294.667" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o046" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="776.64" y="329.853">The crossover is a barrier: a nucleus must reach r*</tspan>
<tspan x="776.64" y="349.52">before growth lowers its energy.</tspan>
</text>
<ellipse id="o047" cx="761.28" cy="324.6" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o048" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="776.64" y="380.12">Δpₙ = pₛₐₜ(Tᵢ) − p_d is the superheat that drives</tspan>
<tspan x="776.64" y="399.787">the volume gain.</tspan>
</text>
<ellipse id="o049" cx="761.28" cy="374.867" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o050" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="617.507">All curves are scaled by W* and r*, so one picture holds for any σᵥₚ and Δpₙ (classical homogeneous capillarity).</tspan>
</text>
<text id="o051" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Free energy of Eq. C2-E14 in scaled form: W/W* = 3x² − 2x³, x = rₙ / r*.</tspan>
</text>
</svg>
