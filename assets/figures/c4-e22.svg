<tspan x="343.68" y="195.741">fixed pressure: G ∝ b⁴ (grows: unstable)</tspan>
</text>
<text id="o034" font-family="Arial,sans-serif" font-size="15.3333" fill="#F28BA0" text-anchor="start" opacity="1">
<tspan x="113.536" y="488.235">fixed volume: G ∝ b⁻⁸ (falls: stable)</tspan>
</text>
<rect id="o035" x="720" y="144" width="523.2" height="374.4" rx="29.952" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o036" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="733.44" y="166.44">Same plate, two load controls</tspan>
</text>
<text id="o037" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="736.32" y="201.693">U_b|V̄ = V̄² / (2C_b) = 96 D_f V̄² / (π b⁶)</tspan>
</text>
<text id="o038" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="736.32" y="255.587">p(b) = 192 D_f V̄ / (π b⁶)</tspan>
</text>
<text id="o039" font-family="Arial,sans-serif" font-size="15.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="736.32" y="307.293">G_V̄ = 288 D_f V̄² / (π² b⁸) = p(b)² b⁴ / (128 D_f)</tspan>
</text>
<text id="o040" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="736.32" y="379.84">Same formula in p, but p itself falls as b⁻⁶ at fixed</tspan>
<tspan x="736.32" y="398.72">volume.</tspan>
</text>
<text id="o041" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="591.587">A maintained pressure source lets the crack run away; a fixed liquid volume arrests it. Always state the control.</tspan>
</text>
<text id="o042" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Loading-control comparison of Eq. C4-E22.</tspan>
</text>
