<tspan x="112.32" y="167.179">slope 4 at R_ref</tspan>
</text>
<text id="o039" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="310.4" y="487.636">positive everywhere: pₑₗ always increases</tspan>
</text>
<rect id="o040" x="739.2" y="144" width="504" height="384" rx="30.72" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o041" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="752.64" y="166.44">Three checks</tspan>
</text>
<text id="o042" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="755.52" y="207.587">pₑₗ(R_ref) = (G_g/2)(5 − 4 − 1) = 0</tspan>
</text>
<text id="o043" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="755.52" y="264.64">dpₑₗ/dR = 2G_g (R_ref/R² + R_ref⁴/R⁵) &gt; 0</tspan>
</text>
<text id="o044" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="755.52" y="322.787">lim R/R_ref → ∞: pₑₗ → 5G_g/2</tspan>
</text>
<text id="o045" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="755.52" y="389.44">Zero strain, zero resistance; expansion raises it</tspan>
<tspan x="755.52" y="408.32">monotonically and boundedly.</tspan>
</text>
<text id="o046" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="617.507">These checks guard against sign errors: a negative slope or a non-zero value at R_ref would signal a mistake.</tspan>
</text>
<text id="o047" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Limiting-state and sign checks of Eq. A-E06.</tspan>
</text>
