<text id="o034" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="119.723" y="272.142">liquid still present:</tspan>
<tspan x="119.723" y="290.235">p = pₛₐₜ(T)</tspan>
</text>
<text id="o035" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="187.152" y="422.832">inventory exhausted:</tspan>
<tspan x="187.152" y="440.925">p = mR_uT/(MV) falls as 1/R³</tspan>
</text>
<rect id="o036" x="796.8" y="144" width="446.4" height="384" rx="30.72" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o037" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="810.24" y="166.44">min[ saturation, inventory ]</tspan>
</text>
<text id="o038" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="813.12" y="207.587">pᵥ,eq = min[ pₛₐₜ(T_b),  m_PFC,0 Rᵤ T_b /</tspan>
<tspan x="813.12" y="227.253">(M_PFC V_b) ]</tspan>
</text>
<text id="o039" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="834.24" y="288.64">Until all liquid evaporates the pressure is</tspan>
<tspan x="834.24" y="307.52">pinned at pₛₐₜ.</tspan>
</text>
<ellipse id="o040" cx="818.88" cy="283.52" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o041" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="834.24" y="337.28">After that the finite inventory cannot supply</tspan>
<tspan x="834.24" y="356.16">more vapor, so p falls as the bubble grows.</tspan>
</text>
<ellipse id="o042" cx="818.88" cy="332.16" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o043" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="834.24" y="385.92">Assumes a closed, non-dissolving supply and</tspan>
<tspan x="834.24" y="404.8">fast mass exchange.</tspan>
</text>
<ellipse id="o044" cx="818.88" cy="380.8" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
