<tspan x="865.92" y="287.267">Iₗ = ∫ Fₗ dt</tspan>
</text>
<text id="o038" font-family="Arial,sans-serif" font-size="16.6667" fill="#F28BA0" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="755.52" y="362.147">work</tspan>
</text>
<text id="o039" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="865.92" y="362.147">Wₗ = ∫∫ tₗ·v_f dA dt</tspan>
</text>
<text id="o040" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="755.52" y="432.64">Work needs the surface velocity v_f; force and impulse</tspan>
<tspan x="755.52" y="451.52">do not.</tspan>
</text>
<text id="o041" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="591.587">The same footprint A_f(t) supplies force and impulse. A load on a wall that does not move delivers impulse but no work.</tspan>
</text>
<text id="o042" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="97.92" y="639.04">Event window: tₐ to t_b.</tspan>
</text>
<text id="o043" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Exact definitions of Eq. C4-E02; curve is a schematic force history.</tspan>
</text>
</svg>
