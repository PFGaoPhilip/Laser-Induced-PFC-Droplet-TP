<rect id="o046" x="777.6" y="96" width="465.6" height="508.8" rx="37.248" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o047" font-family="Arial,sans-serif" font-size="17.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="791.04" y="117.893">Geometry enters through Ω and its boundary</tspan>
</text>
<text id="o048" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="793.92" y="164.387">Irrotational, incompressible flow reduces to one</tspan>
<tspan x="793.92" y="184.053">scalar equation:</tspan>
</text>
<text id="o049" font-family="Arial,sans-serif" font-size="18" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="793.92" y="227.88">∇·u = 0  and  u = ∇φ  ⇒  ∇²φ = 0 in Ω(t)</tspan>
</text>
<text id="o050" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="815.04" y="303.587">Laplace has no time derivative: φ at one</tspan>
<tspan x="815.04" y="323.253">instant follows from the shape and boundary</tspan>
<tspan x="815.04" y="342.92">data at that instant.</tspan>
</text>
<ellipse id="o051" cx="799.68" cy="298.333" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o052" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="815.04" y="374.187">The domain Ω(t) changes with the moving</tspan>
<tspan x="815.04" y="393.853">interface, so geometry drives the dynamics.</tspan>
</text>
<ellipse id="o053" cx="799.68" cy="368.933" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o054" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="815.04" y="424.453">The equation alone predicts nothing without</tspan>
<tspan x="815.04" y="444.12">boundary conditions (next figure).</tspan>
</text>
<ellipse id="o055" cx="799.68" cy="419.2" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o056" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Potential-flow reduction of Eq. C3-E13; schematic.</tspan>
</text>
</svg>
