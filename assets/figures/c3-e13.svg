</text>
<text id="o038" font-family="Arial,sans-serif" font-size="16" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="97.92" y="178.24">interface Γ(t)</tspan>
</text>
<text id="o039" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="510.72" y="351.04">wall</tspan>
</text>
<text id="o040" font-family="Arial,sans-serif" font-size="16" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="481.92" y="187.84">far field φ → 0</tspan>
</text>
<line id="o041" x1="387.232" y1="338.283" x2="441.358" y2="318.582" fill="#FFFFFF" stroke="#8EDBD4" stroke-width="2.66667" opacity="1" marker-end="url(#head)"/>
