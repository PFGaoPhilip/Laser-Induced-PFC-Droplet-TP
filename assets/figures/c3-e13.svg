<line id="o043" x1="220.122" y1="293.506" x2="183.097" y2="249.382" fill="#FFFFFF" stroke="#8EDBD4" stroke-width="2.66667" opacity="1" marker-end="url(#head)"/>
<line id="o044" x1="182.802" y1="383.604" x2="125.421" y2="388.624" fill="#FFFFFF" stroke="#8EDBD4" stroke-width="2.66667" opacity="1" marker-end="url(#head)"/>
