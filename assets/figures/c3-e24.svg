<tspan x="774.72" y="365.987">p_early = Zₗ Zᵣ Uⱼ / (Zₗ + Zᵣ)  (solid)</tspan>
</text>
<text id="o046" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="774.72" y="432.64">Equal pressure and equal normal velocity at the</tspan>
<tspan x="774.72" y="451.52">contact fix both numbers.</tspan>
</text>
<text id="o047" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="617.507">Stiffer receivers raise the early pressure toward Zₗ Uⱼ but never above it; softer receivers lower it and let the jet keep moving.</tspan>
</text>
