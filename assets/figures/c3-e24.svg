</text>
<text id="o042" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="774.72" y="207.04">(∂ₜ ± c∂_z)(u ± p′/Zₗ) = 0  (characteristics)</tspan>
</text>
<text id="o043" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="774.72" y="260.387">p_early = Zₗ(Uⱼ − vᵢ) = Zᵣ vᵢ</tspan>
</text>
<text id="o044" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
