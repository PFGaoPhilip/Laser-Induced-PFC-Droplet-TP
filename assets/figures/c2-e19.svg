<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 650" role="img"><title>C2-E19 A bubble surface and a PFC evaporation surface need not be identical.</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8EDBD4"/></marker></defs>
<rect width="980" height="650" fill="#142632"/>
<text x="28" y="42.52" font-family="Arial,sans-serif" font-size="19" fill="#8EDBD4">C2-E19 | Physical-variable diagram</text>
<ellipse cx="260" cy="215" rx="115" ry="115" fill="#213E4B" stroke="#B4C7D2" stroke-width="2.21"/>
<ellipse cx="320" cy="260" rx="38" ry="38" fill="#F6BC77" stroke="#B4C7D2" stroke-width="2.21"/>
<line x1="330" y1="230" x2="410" y2="145" fill="none" stroke="#8EDBD4" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="442" y="156.6" font-family="Arial,sans-serif" font-size="20" fill="#E7F0F3">Actual PFC contact patch Gamma_s</text>
<text x="452" y="239.44" font-family="Arial,sans-serif" font-size="18" fill="#E7F0F3">Full 4π R² requires complete contact.</text>
<text x="132" y="370.52" font-family="Arial,sans-serif" font-size="19" fill="#E7F0F3">Bubble boundary and PFC evaporation surface can differ.</text>
<text x="32" y="426.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">Γ_s: actual species interface</text>
<text x="32" y="450.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">m_v,s, ṁ_v,s: vapor inventory and rate</text>
<text x="32" y="474.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">dA: contacted surface patch</text>
<text x="507" y="426.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">j_s: liquid → vapor</text>
<text x="507" y="450.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">R: complete bubble radius only when applicable</text>
<text x="507" y="474.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">π: full-sphere special case</text>
<text x="32" y="532.28" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2">PFC may occupy only a residual inclusion</text>
<text x="32" y="556.28" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2">Do not give every species the whole bubble area automatically</text>
</svg>