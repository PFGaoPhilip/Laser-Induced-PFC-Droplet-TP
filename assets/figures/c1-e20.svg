<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 650" role="img"><title>C1-E20 A Mach diagnostic exposes the shrinking validity range of incompressible collapse.</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8EDBD4"/></marker></defs>
<rect width="980" height="650" fill="#142632"/>
<text x="28" y="42.52" font-family="Arial,sans-serif" font-size="19" fill="#8EDBD4">C1-E20 | Physical-variable diagram</text>
<rect x="100" y="150" width="300" height="95" fill="#213E4B" stroke="#B4C7D2" stroke-width="1.9500000000000002"/>
<text x="112" y="179.44" font-family="Arial,sans-serif" font-size="18" fill="#E7F0F3">Wall speed / sound speed</text>
