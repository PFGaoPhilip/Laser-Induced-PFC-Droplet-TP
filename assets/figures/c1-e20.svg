<text x="582" y="179.44" font-family="Arial,sans-serif" font-size="18" fill="#E7F0F3">Propagation / event time</text>
<line x1="405" y1="198" x2="560" y2="198" fill="none" stroke="#8EDBD4" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="122" y="321.6" font-family="Arial,sans-serif" font-size="20" fill="#E7F0F3">Check both motion and pressure communication.</text>
<text x="32" y="426.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">Mw = |Ṙ|/c</text>
<text x="32" y="450.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">c = 1500 m/s</text>
<text x="32" y="474.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">xM = RM/Rmax</text>
<text x="32" y="498.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">Δpc</text>
<text x="507" y="426.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">Ṙ</text>
<text x="507" y="450.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">M* = 0.1</text>
<text x="507" y="474.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">ρ</text>
<text x="507" y="498.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">RM ≈ 4.305 μm</text>
<text x="32" y="537.28" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2">The selected threshold flags omitted physics; it does not stop a real cavity</text>
