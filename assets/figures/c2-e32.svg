<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1279.97 720" role="img">
<title>C2-E32</title>
<defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/></marker></defs>
<rect width="1279.97" height="720" fill="#142632"/>
<text id="o000" font-family="Arial,sans-serif" font-size="25.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="30.72" y="35.1733">C2-E32 · Original formulas for Defense 1</tspan>
</text>
<rect id="o001" x="48" y="115.2" width="580.8" height="187.2" rx="14.976" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<ellipse id="o002" cx="91.2" cy="163.2" rx="25.92" ry="25.92" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o003" font-family="Arial,sans-serif" font-size="18.6667" fill="#142632" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="91.68" y="161.227">1</tspan>
</text>
<text id="o004" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="136.32" y="143.4">Optical energy</tspan>
</text>
<text id="o005" font-family="Arial,sans-serif" font-size="22.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="136.32" y="198.107">E_L = π w² F₀ / 2</tspan>
</text>
<text id="o006" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="136.32" y="255.04">Gaussian beam energy</tspan>
</text>
<rect id="o007" x="648" y="115.2" width="580.8" height="187.2" rx="14.976" fill="#213E4B" stroke="#F2B880" stroke-width="2.13333" opacity="1"/>
<ellipse id="o008" cx="691.2" cy="163.2" rx="25.92" ry="25.92" fill="#F2B880" stroke="#F2B880" stroke-width="1.33333" opacity="1"/>
<text id="o009" font-family="Arial,sans-serif" font-size="18.6667" fill="#142632" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="691.68" y="161.227">2</tspan>
</text>
<text id="o010" font-family="Arial,sans-serif" font-size="18" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="736.32" y="143.4">Absorbed share</tspan>
</text>
<text id="o011" font-family="Arial,sans-serif" font-size="22.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="736.32" y="198.107">E_abs = f_geo A_λ E_L</tspan>
</text>
<text id="o012" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="736.32" y="255.04">aperture × absorptance</tspan>
</text>
<rect id="o013" x="48" y="321.6" width="580.8" height="187.2" rx="14.976" fill="#213E4B" stroke="#7FC8F8" stroke-width="2.13333" opacity="1"/>
<ellipse id="o014" cx="91.2" cy="369.6" rx="25.92" ry="25.92" fill="#7FC8F8" stroke="#7FC8F8" stroke-width="1.33333" opacity="1"/>
<text id="o015" font-family="Arial,sans-serif" font-size="18.6667" fill="#142632" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="91.68" y="367.627">3</tspan>
</text>
<text id="o016" font-family="Arial,sans-serif" font-size="18" fill="#7FC8F8" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="136.32" y="349.8">Where the heat goes</tspan>
</text>
<text id="o017" font-family="Arial,sans-serif" font-size="22.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="136.32" y="404.507">tₜₕ ~ Lₕ² / α</tspan>
</text>
<text id="o018" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="136.32" y="461.44">time to cross a distance</tspan>
</text>
<rect id="o019" x="648" y="321.6" width="580.8" height="187.2" rx="14.976" fill="#213E4B" stroke="#F28BA0" stroke-width="2.13333" opacity="1"/>
<ellipse id="o020" cx="691.2" cy="369.6" rx="25.92" ry="25.92" fill="#F28BA0" stroke="#F28BA0" stroke-width="1.33333" opacity="1"/>
<text id="o021" font-family="Arial,sans-serif" font-size="18.6667" fill="#142632" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="691.68" y="367.627">4</tspan>
</text>
<text id="o022" font-family="Arial,sans-serif" font-size="18" fill="#F28BA0" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="736.32" y="349.8">Penetration</tspan>
</text>
<text id="o023" font-family="Arial,sans-serif" font-size="22.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="736.32" y="404.507">δ_T ~ √(α τₕ)</tspan>
</text>
<text id="o024" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="736.32" y="461.44">distance reached in the pulse</tspan>
</text>
<text id="o025" font-family="Arial,sans-serif" font-size="18" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="49.92" y="559.08">Light must be intercepted, absorbed, and then conducted to the PFC. Each step has its own formula and its own limit.</tspan>
</text>
<text id="o026" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="49.92" y="610.787">A short pulse does not imply uniform temperature: compare the heat penetration δ_T with the distance to the PFC.</tspan>
</text>
<text id="o027" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Reference formulas of the Defence 1 answer: Eqs. C2-E02, E06, E09.</tspan>
</text>
</svg>
