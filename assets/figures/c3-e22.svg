</text>
<text id="o041" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="755.52" y="303.587">Re = ρU_jdⱼ/μ</tspan>
</text>
<text id="o042" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="1057.92" y="304.133">319</tspan>
</text>
<text id="o043" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="755.52" y="351.587">We = ρUⱼ²dⱼ/σⱼ</tspan>
</text>
<text id="o044" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="1057.92" y="352.133">141</tspan>
</text>
<text id="o045" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="755.52" y="399.587">Oh = μ/√(ρσ_jdⱼ)</tspan>
</text>
<text id="o046" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="1057.92" y="400.133">0.0373</tspan>
</text>
<text id="o047" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="755.52" y="466.24">Growth during the actual flight stays small, but</tspan>
<tspan x="755.52" y="485.12">extrapolating to the 17.7 µs threshold leaves exact</tspan>
<tspan x="755.52" y="504">breakup unresolved.</tspan>
</text>
<text id="o048" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="616.96">δₐᵣᵣ/a₀ = (δ₀/a₀) exp(gₘₐₓ H/Uⱼ) with H = 100 µm, Uⱼ = 31.9 m/s, a₀ = 5 µm, ρ = 1000 kg/m³, σⱼ = 0.072 N/m, μ = 1 mPa s.</tspan>
</text>
