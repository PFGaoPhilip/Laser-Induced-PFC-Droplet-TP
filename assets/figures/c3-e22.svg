<text id="o039" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="755.52" y="255.587">gₘₐₓ = 0.343339 / t_σ</tspan>
</text>
<text id="o040" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
