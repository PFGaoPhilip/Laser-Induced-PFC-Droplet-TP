<tspan x="276.317" y="247.657">K = 2.2 GPa (assumed): c_L = 1483 m/s</tspan>
</text>
<rect id="o041" x="739.2" y="144" width="504" height="384" rx="30.72" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o042" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="752.64" y="166.44">Compressional crossing</tspan>
</text>
<text id="o043" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="755.52" y="208.133">c_L ≃ √[(K_bulk + 4G_g/3)/ρ_g]</tspan>
</text>
<text id="o044" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="755.52" y="260.387">t_L = L_g / c_L,    M_w = |Ṙ| / c_L</tspan>
</text>
<text id="o045" font-family="Arial,sans-serif" font-size="16" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="755.52" y="322.24">t_L = 20.2 ns,   M_w = 0.0067  (|Ṙ| = 10 m/s)</tspan>
</text>
<text id="o046" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="755.52" y="388.893">K_bulk = 2.2 GPa is an assumed water-like value for</tspan>
<tspan x="755.52" y="406.987">illustration; the real gel must be characterised.</tspan>
</text>
<text id="o047" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="617.507">Shear and longitudinal waves differ by about 330×: a water-rich gel answers compression almost instantly and shear slowly.</tspan>
</text>
<text id="o048" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Separate compressibility diagnostic of Eq. A-E19 (L_g = 30 µm).</tspan>
