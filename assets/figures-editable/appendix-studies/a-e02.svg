<text id="o031" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="310.4" y="268.428">stress difference dies off outward (log axis)</tspan>
</text>
<rect id="o032" x="739.2" y="144" width="504" height="384" rx="30.72" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o033" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="752.64" y="166.44">Neo-Hookean network</tspan>
</text>
<text id="o034" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="755.52" y="207.587">T^e = −χI + G_g B,   B = F Fᵀ</tspan>
</text>
<text id="o035" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="755.52" y="259.84">Tᵣᵣ = −χ + G_g λᵣ²,   T_θθ = −χ + G_g λ_θ²</tspan>
</text>
<text id="o036" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="755.52" y="313.187">T_θθ − Tᵣᵣ = G_g[(r/r₀)² − (r₀/r)⁴]</tspan>
</text>
<text id="o037" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="755.52" y="375.04">The unknown pressure χ cancels in the difference.</tspan>
</text>
<text id="o038" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="617.507">Only the difference of normal stresses enters the force balance, so χ never has to be found.</tspan>
</text>
<text id="o039" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Exact subtraction of Eq. A-E02 (R_ref = 5 µm, R = 30 µm).</tspan>
</text>
</svg>
