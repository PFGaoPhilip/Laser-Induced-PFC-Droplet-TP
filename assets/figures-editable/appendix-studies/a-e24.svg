<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1279.97 720" role="img">
<title>A-E24</title>
<defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/></marker></defs>
<rect width="1279.97" height="720" fill="#142632"/>
<text id="o000" font-family="Arial,sans-serif" font-size="25.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="30.72" y="35.1733">A-E24 · Original load and interface-work accounting</tspan>
</text>
<text id="o001" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="49.92" y="112.68">Follow the delivered load to the intended interface and the final placement</tspan>
</text>
<rect id="o002" x="48" y="153.6" width="255.6" height="144" rx="11.52" fill="#213E4B" stroke="#7FC8F8" stroke-width="2.13333" opacity="1"/>
<text id="o003" font-family="Arial,sans-serif" font-size="18" fill="#7FC8F8" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="175.8" y="176.04">load</tspan>
</text>
<text id="o004" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="175.8" y="203.08">t_load on Aₜ</tspan>
</text>
<line id="o005" x1="306.48" y1="225.6" x2="353.52" y2="225.6" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="2.93333" opacity="1" marker-end="url(#head)"/>
<rect id="o006" x="356.4" y="153.6" width="255.6" height="144" rx="11.52" fill="#213E4B" stroke="#F2B880" stroke-width="2.13333" opacity="1"/>
<text id="o007" font-family="Arial,sans-serif" font-size="18" fill="#F2B880" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="484.2" y="176.04">impulse</tspan>
</text>
<text id="o008" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="484.2" y="203.08">J_target = ∫∫ t_load dA dt</tspan>
</text>
<line id="o009" x1="614.88" y1="225.6" x2="661.92" y2="225.6" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="2.93333" opacity="1" marker-end="url(#head)"/>
<rect id="o010" x="664.8" y="153.6" width="255.6" height="144" rx="11.52" fill="#213E4B" stroke="#F28BA0" stroke-width="2.13333" opacity="1"/>
<text id="o011" font-family="Arial,sans-serif" font-size="18" fill="#F28BA0" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="792.6" y="176.04">interface</tspan>
</text>
<text id="o012" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="792.6" y="203.08">Wₛₑₚ,min = ∫ Γ_c dA</tspan>
</text>
<line id="o013" x1="923.28" y1="225.6" x2="970.32" y2="225.6" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="2.93333" opacity="1" marker-end="url(#head)"/>
<rect id="o014" x="973.2" y="153.6" width="255.6" height="144" rx="11.52" fill="#213E4B" stroke="#A8E6A1" stroke-width="2.13333" opacity="1"/>
<text id="o015" font-family="Arial,sans-serif" font-size="18" fill="#A8E6A1" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="1101" y="176.04">placement</tspan>
</text>
<text id="o016" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="1101" y="203.08">final position</tspan>
</text>
<rect id="o017" x="48" y="336" width="576" height="230.4" rx="18.432" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o018" font-family="Arial,sans-serif" font-size="17.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="61.44" y="357.893">Delivered</tspan>
</text>
<text id="o019" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="64.32" y="399.587">J_target = ∫_{t₀}^{t₁} ∫_{A_t} t_load dA dt</tspan>
</text>
<text id="o020" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="64.32" y="466.24">the load that actually reaches the target footprint Aₜ over its</tspan>
<tspan x="64.32" y="485.12">time window</tspan>
</text>
<rect id="o021" x="652.8" y="336" width="576" height="230.4" rx="18.432" fill="#213E4B" stroke="#F2B880" stroke-width="2.13333" opacity="1"/>
<text id="o022" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="666.24" y="357.893">Required</tspan>
</text>
<text id="o023" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="669.12" y="399.587">Wₛₑₚ,min = ∫_{A_rel} Γ_c dA</tspan>
</text>
<text id="o024" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="669.12" y="466.24">the least energy to separate the intended release area</tspan>
</text>
<text id="o025" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="49.92" y="610.787">A fair comparison with the gel path must use the same load, interface and placement accounting.</tspan>
</text>
<text id="o026" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Original load and interface-work accounting: Eq. A-E24 (Defence 3).</tspan>
</text>
</svg>
