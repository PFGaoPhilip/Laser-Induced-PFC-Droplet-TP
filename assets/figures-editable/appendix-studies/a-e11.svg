<rect id="o022" x="76.416" y="222.72" width="96.768" height="276.48" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="0.85"/>
<text id="o023" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="124.8" y="208.413">100.0</tspan>
</text>
<text id="o024" font-family="Arial,sans-serif" font-size="14.6667" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="124.8" y="520.827">p_b − p_∞</tspan>
</text>
<rect id="o025" x="210.816" y="222.72" width="96.768" height="13.271" fill="#F2B880" stroke="#F2B880" stroke-width="1.33333" opacity="0.85"/>
<text id="o026" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="259.2" y="208.413">-4.8</tspan>
</text>
<text id="o027" font-family="Arial,sans-serif" font-size="14.6667" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="259.2" y="520.827">− 2σ/R</tspan>
</text>
<rect id="o028" x="345.216" y="235.991" width="96.768" height="119.787" fill="#F28BA0" stroke="#F28BA0" stroke-width="1.33333" opacity="0.85"/>
<text id="o029" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="393.6" y="221.684">-43.3</tspan>
</text>
<text id="o030" font-family="Arial,sans-serif" font-size="14.6667" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="393.6" y="520.827">− pₑₗ</tspan>
</text>
<rect id="o031" x="479.616" y="318.914" width="96.768" height="36.864" fill="#7FC8F8" stroke="#7FC8F8" stroke-width="1.33333" opacity="0.85"/>
<text id="o032" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="528" y="304.607">+13.3</tspan>
</text>
<text id="o033" font-family="Arial,sans-serif" font-size="14.6667" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="528" y="520.827">− 4η_gṘ/R</tspan>
</text>
<rect id="o034" x="614.016" y="318.914" width="96.768" height="180.286" fill="#A8E6A1" stroke="#A8E6A1" stroke-width="1.33333" opacity="0.85"/>
<text id="o035" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="662.4" y="304.607">65.2</tspan>
</text>
<text id="o036" font-family="Arial,sans-serif" font-size="14.6667" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="662.4" y="520.827">= ρ_g(RR̈ + 3Ṙ²/2)</tspan>
</text>
<rect id="o037" x="768" y="96" width="475.2" height="422.4" rx="33.792" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o038" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="781.44" y="118.44">Spherical radial control</tspan>
</text>
<text id="o039" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="784.32" y="158.493">ρ_g(RR̈ + 3Ṙ²/2) = p_b − p_∞ − 2σ/R − pₑₗ − 4η_gṘ/R</tspan>
</text>
<text id="o040" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="805.44" y="255.04">Left: inertia of the surrounding gel.</tspan>
</text>
<ellipse id="o041" cx="790.08" cy="249.92" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o042" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="805.44" y="284.16">Right: driving overpressure minus capillary,</tspan>
<tspan x="805.44" y="303.04">elastic and viscous resistance.</tspan>
</text>
<ellipse id="o043" cx="790.08" cy="279.04" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o044" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="805.44" y="332.8">Inward motion (Ṙ &lt; 0) turns the viscous term into</tspan>
<tspan x="805.44" y="351.68">a push.</tspan>
</text>
<ellipse id="o045" cx="790.08" cy="327.68" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o046" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="59.52" y="547.84">Illustration: p_b − p_∞ = 100 kPa, R = 30 µm, Ṙ = −10 m/s, σ = 0.072 N/m (assumed), η_g = 0.010 Pa s, G_g = 20 kPa, R_ref = 5 µm.</tspan>
</text>
<text id="o047" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="59.52" y="601.187">The model quantifies cavity work before any directional-flow calculation; it does not create an outlet.</tspan>
</text>
<text id="o048" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Radial control of Eq. A-E11 (values illustrative; the inertia bar is what is left over).</tspan>
</text>
</svg>
