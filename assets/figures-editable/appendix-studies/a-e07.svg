<text id="o042" font-family="Arial,sans-serif" font-size="16" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="433.92" y="161.548">W_g(30 µm) = 4.5160 nJ</tspan>
</text>
<rect id="o043" x="739.2" y="144" width="504" height="384" rx="30.72" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o044" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="752.64" y="166.44">Integrate pressure over volume</tspan>
</text>
<text id="o045" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="755.52" y="208.133">W_g = 4π ∫ pₑₗ(ξ) ξ² dξ</tspan>
</text>
<text id="o046" font-family="Arial,sans-serif" font-size="15.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="755.52" y="259.293">= 2πG_g [5ξ³/3 − 2R_ref ξ² + R_ref⁴/ξ]</tspan>
</text>
<text id="o047" font-family="Arial,sans-serif" font-size="14.6667" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="755.52" y="311.547">W_g = 2πG_g[5R³/3 − 2R_ref R² + R_ref⁴/R − 2R_ref³/3]</tspan>
</text>
<text id="o048" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="755.52" y="379.84">Numerical quadrature: 4.516040 nJ;  closed form:</tspan>
<tspan x="755.52" y="398.72">4.516039 nJ.</tspan>
</text>
<text id="o049" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="617.507">4πξ² dξ is the cavity volume increment, so the integral is work done against the network.</tspan>
</text>
<text id="o050" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Elastic work of Eq. A-E07 (R_ref = 5 µm, G_g = 20 kPa).</tspan>
</text>
</svg>
