<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1279.97 720" role="img">
<title>A-E13</title>
<defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/></marker></defs>
<rect width="1279.97" height="720" fill="#142632"/>
<text id="o000" font-family="Arial,sans-serif" font-size="25.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="30.72" y="35.1733">A-E13 · Teaching-input substitution</tspan>
</text>
<text id="o001" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="49.92" y="112.68">Teaching inputs: G_g = 20 kPa, R_ref = 5 µm, R = 30 µm (sixfold expansion)</tspan>
</text>
<rect id="o002" x="48" y="144" width="576" height="249.6" rx="19.968" fill="#213E4B" stroke="#7FC8F8" stroke-width="2.13333" opacity="1"/>
<text id="o003" font-family="Arial,sans-serif" font-size="18" fill="#7FC8F8" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="61.44" y="166.44">Elastic resistance</tspan>
</text>
<text id="o004" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="64.32" y="207.587">pₑₗ = (G_g/2)[5 − 4(5/30) − (5/30)⁴]</tspan>
</text>
<text id="o005" font-family="Arial,sans-serif" font-size="21.3333" fill="#7FC8F8" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="64.32" y="264.213">pₑₗ = 43325.6173 Pa</tspan>
</text>
<text id="o006" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="64.32" y="322.24">about 43 kPa: well below 100 kPa</tspan>
</text>
<rect id="o007" x="652.8" y="144" width="576" height="249.6" rx="19.968" fill="#213E4B" stroke="#F2B880" stroke-width="2.13333" opacity="1"/>
<text id="o008" font-family="Arial,sans-serif" font-size="18" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="666.24" y="166.44">Stored work</tspan>
</text>
<text id="o009" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="669.12" y="206.493">W_g = 2πG_g[5R³/3 − 2R_refR² + R_ref⁴/R − 2R_ref³/3]</tspan>
</text>
<text id="o010" font-family="Arial,sans-serif" font-size="20" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="669.12" y="263.12">W_g = 4.51603944e-09 J = 4.5160 nJ</tspan>
</text>
<text id="o011" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="669.12" y="322.24">several nanojoules for a soft network</tspan>
</text>
<rect id="o012" x="48" y="432" width="355.2" height="105.6" rx="8.448" fill="#213E4B" stroke="#B4C7D2" stroke-width="2.13333" opacity="1"/>
<text id="o013" font-family="Arial,sans-serif" font-size="18" fill="#B4C7D2" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="225.6" y="454.44">R/R_ref</tspan>
</text>
<text id="o014" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="225.6" y="482.027">30 / 5 = 6</tspan>
</text>
<line id="o015" x1="406.08" y1="484.8" x2="457.92" y2="484.8" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="2.93333" opacity="1" marker-end="url(#head)"/>
<rect id="o016" x="460.8" y="432" width="355.2" height="105.6" rx="8.448" fill="#213E4B" stroke="#7FC8F8" stroke-width="2.13333" opacity="1"/>
<text id="o017" font-family="Arial,sans-serif" font-size="18" fill="#7FC8F8" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="638.4" y="454.44">pₑₗ</tspan>
</text>
<text id="o018" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="638.4" y="482.027">43.33 kPa</tspan>
</text>
<line id="o019" x1="818.88" y1="484.8" x2="870.72" y2="484.8" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="2.93333" opacity="1" marker-end="url(#head)"/>
<rect id="o020" x="873.6" y="432" width="355.2" height="105.6" rx="8.448" fill="#213E4B" stroke="#F2B880" stroke-width="2.13333" opacity="1"/>
<text id="o021" font-family="Arial,sans-serif" font-size="18" fill="#F2B880" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="1051.2" y="454.44">W_g</tspan>
</text>
<text id="o022" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="1051.2" y="482.027">4.516 nJ</tspan>
</text>
<text id="o023" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="49.92" y="591.587">The pressure alone looks harmless; the work, accumulated over the whole expansion, is a finite share of the budget (next figure).</tspan>
</text>
<text id="o024" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Teaching-input substitution of Eq. A-E13 (values recomputed from the closed forms).</tspan>
</text>
</svg>
