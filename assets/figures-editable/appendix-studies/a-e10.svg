 469.869,507.789 472.86,508.028 475.851,508.263 478.842,508.494 481.833,508.721 484.824,508.944 487.815,509.163 490.806,509.379 493.797,509.591 496.788,509.799 499.779,510.004 502.77,510.205 505.761,510.403 508.752,510.598 511.743,510.79 514.734,510.978 517.725,511.164 520.716,511.346 523.707,511.526 526.697,511.702 529.688,511.876 532.679,512.047 535.67,512.216 538.661,512.381 541.652,512.545 544.643,512.705 547.634,512.863 550.625,513.019 553.616,513.173 556.607,513.324 559.598,513.473 562.589,513.619 565.58,513.763 568.571,513.906 571.562,514.046 574.553,514.184 577.544,514.32 580.535,514.454 583.526,514.586 586.517,514.716 589.508,514.845 592.498,514.971 595.489,515.096 598.48,515.219 601.471,515.34 604.462,515.459 607.453,515.577 610.444,515.693 613.435,515.808 616.426,515.92 619.417,516.032 622.408,516.142 625.399,516.25 628.39,516.357 631.381,516.462 634.372,516.566 637.363,516.669 640.354,516.77 643.345,516.87 646.336,516.969 649.327,517.066 652.318,517.162 655.309,517.257 658.299,517.35 661.29,517.443 664.281,517.534 667.272,517.624 670.263,517.713 673.254,517.8 676.245,517.887 679.236,517.972 682.227,518.057 685.218,518.14 688.209,518.222 691.2,518.304" fill="none" stroke="#8EDBD4" stroke-width="4.26667" opacity="1"/>
<text id="o035" font-family="Arial,sans-serif" font-size="15.3333" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="260.352" y="267.63">∫_R^∞ aᵣ dr = 210.0000 m²/s²</tspan>
</text>
<text id="o036" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="260.352" y="308.051">R R̈ + (3/2) Ṙ² = 210.0000 m²/s²</tspan>
</text>
<rect id="o037" x="720" y="144" width="523.2" height="384" rx="30.72" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o038" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="733.44" y="166.44">Integrating the momentum law</tspan>
</text>
<text id="o039" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="736.32" y="207.04">ρ_g aᵣ = ∂Tᵣᵣ/∂r + (2/r)(Tᵣᵣ − T_θθ)</tspan>
</text>
<text id="o040" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="736.32" y="260.387">ρ_g ∫aᵣ dr = ρ_g (R R̈ + 3Ṙ²/2)</tspan>
</text>
<text id="o041" font-family="Arial,sans-serif" font-size="15.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="736.32" y="312.093">viscous part: 2∫(…)(−6η_gR²Ṙ/r³)dr/r → −4η_g Ṙ/R</tspan>
</text>
<text id="o042" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="736.32" y="379.84">Acceleration and viscous stress give two distinct radial</tspan>
<tspan x="736.32" y="398.72">contributions.</tspan>
</text>
<text id="o043" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="616.96">Numerical check with R = 30 µm, Ṙ = −10 m/s, R̈ = 2×10⁶ m/s²: area under aᵣ agrees with R R̈ + 3Ṙ²/2 to 0.0000 %.</tspan>
</text>
<text id="o044" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Evaluated integrals of Eq. A-E10 (quadrature to 400R plus the 1/r² tail beyond it, added analytically).</tspan>
</text>
</svg>
