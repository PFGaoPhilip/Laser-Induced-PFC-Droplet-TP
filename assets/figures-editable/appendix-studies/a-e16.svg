</text>
<rect id="o041" x="835.2" y="220.8" width="408" height="249.6" rx="19.968" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o042" font-family="Arial,sans-serif" font-size="17.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="848.64" y="242.693">What decides it</tspan>
</text>
<text id="o043" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="872.64" y="283.293">τᵣₑₗ: how long the network takes to relax.</tspan>
</text>
<ellipse id="o044" cx="857.28" cy="278.307" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o045" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="872.64" y="311.6">τₑ: how long the jet or load lasts.</tspan>
</text>
<ellipse id="o046" cx="857.28" cy="306.613" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o047" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="872.64" y="339.907">The ratio, not either time alone, sets the</tspan>
<tspan x="872.64" y="358">behaviour.</tspan>
</text>
<ellipse id="o048" cx="857.28" cy="334.92" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o049" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="49.92" y="562.787">The event duration determines which part of the network response can act before the jet or load arrives.</tspan>
</text>
<text id="o050" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="49.92" y="619.84">The curve x/(1+x) is a conventional illustration of a Maxwell-type crossover, not a result derived from Eq. A-E16.</tspan>
</text>
<text id="o051" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Definition of Eq. A-E16; the share curve is illustrative only.</tspan>
</text>
