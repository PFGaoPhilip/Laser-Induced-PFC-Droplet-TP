<text id="o034" font-family="Arial,sans-serif" font-size="15.3333" fill="#F28BA0" text-anchor="start" opacity="1">
<tspan x="235.2" y="469.082">Dᵣᵣ = −2R²Ṙ/r³  (radial)</tspan>
</text>
<text id="o035" font-family="Arial,sans-serif" font-size="15.3333" fill="#8EDBD4" text-anchor="start" opacity="1">
<tspan x="249.6" y="231.905">D_θθ = Dᵩᵩ = R²Ṙ/r³  (tangential)</tspan>
</text>
<line id="o036" x1="96" y1="279.529" x2="672" y2="279.529" fill="#FFFFFF" stroke="#2E4756" stroke-width="1.6" opacity="1"/>
<rect id="o037" x="691.2" y="144" width="552" height="384" rx="30.72" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o038" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="704.64" y="166.44">Kelvin–Voigt closure</tspan>
</text>
<text id="o039" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="707.52" y="207.587">T = T^e + 2η_g D,   uᵣ = R²Ṙ / r²</tspan>
</text>
<text id="o040" font-family="Arial,sans-serif" font-size="16" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="707.52" y="264.64">trace D = −2 + 1 + 1 = 0  (incompressible)</tspan>
</text>
<text id="o041" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="707.52" y="322.787">T_θθ − Tᵣᵣ = (elastic) + 6η_g R²Ṙ / r³</tspan>
</text>
<text id="o042" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="707.52" y="389.44">The viscous term follows the strain rate of the medium, not</tspan>
<tspan x="707.52" y="408.32">the mass of the bubble.</tspan>
</text>
<text id="o043" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="617.507">Radial strain rate is −2 and tangential +1 in units of Ṙ R²/r³: incompressibility forces the 2 : 1 split.</tspan>
</text>
<text id="o044" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Radial kinematics and viscous stress difference of Eq. A-E09.</tspan>
</text>
</svg>
