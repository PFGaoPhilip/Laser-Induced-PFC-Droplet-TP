<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1279.97 720" role="img">
<title>A-E23</title>
<defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/></marker></defs>
<rect width="1279.97" height="720" fill="#142632"/>
<text id="o000" font-family="Arial,sans-serif" font-size="25.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="30.72" y="35.1733">A-E23 · Original event-response formulas recalled</tspan>
</text>
<text id="o001" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="49.92" y="112.68">Three timescale comparisons, three assumptions</tspan>
</text>
<rect id="o002" x="48" y="144" width="379.2" height="326.4" rx="26.112" fill="#213E4B" stroke="#7FC8F8" stroke-width="2.13333" opacity="1"/>
<text id="o003" font-family="Arial,sans-serif" font-size="18" fill="#7FC8F8" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="61.44" y="166.44">Deborah number</tspan>
</text>
<text id="o004" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="237.6" y="216.64">De = τᵣₑₗ / τₑ</tspan>
</text>
<text id="o005" font-family="Arial,sans-serif" font-size="16" fill="#F2B880" text-anchor="middle" opacity="1">
<tspan x="237.6" y="322.24">does the network relax during the event?</tspan>
</text>
<text id="o006" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="237.6" y="408.093">viscoelastic response</tspan>
</text>
<rect id="o007" x="446.4" y="144" width="379.2" height="326.4" rx="26.112" fill="#213E4B" stroke="#F2B880" stroke-width="2.13333" opacity="1"/>
<text id="o008" font-family="Arial,sans-serif" font-size="18" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="459.84" y="166.44">Shear crossing</tspan>
</text>
<text id="o009" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="636" y="216.64">tₛ = L_g / √(G_g/ρ_g) = 6.71 µs</tspan>
</text>
<text id="o010" font-family="Arial,sans-serif" font-size="16" fill="#F2B880" text-anchor="middle" opacity="1">
<tspan x="636" y="322.24">is the gel quasi-static over the event?</tspan>
</text>
<text id="o011" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="636" y="408.093">inertia / wave travel</tspan>
</text>
<rect id="o012" x="844.8" y="144" width="379.2" height="326.4" rx="26.112" fill="#213E4B" stroke="#F28BA0" stroke-width="2.13333" opacity="1"/>
<text id="o013" font-family="Arial,sans-serif" font-size="18" fill="#F28BA0" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="858.24" y="166.44">Drainage</tspan>
</text>
<text id="o014" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="1034.4" y="216.64">tₚₒᵣₒ ~ μₗ L_g² / (k M_d) = 1.5 s</tspan>
</text>
<text id="o015" font-family="Arial,sans-serif" font-size="16" fill="#F2B880" text-anchor="middle" opacity="1">
<tspan x="1034.4" y="322.24">can solvent leave during the event?</tspan>
</text>
<text id="o016" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="1034.4" y="408.093">poroelastic transport</tspan>
</text>
<text id="o017" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="49.92" y="524.387">Each ratio against the event time constrains a different physical assumption; one passing test does not cover the others.</tspan>
</text>
<text id="o018" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Original event-response formulas recalled: Eqs. A-E16, A-E18, A-E20 (Defence 3).</tspan>
</text>
</svg>
