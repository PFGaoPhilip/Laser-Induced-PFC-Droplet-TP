<tspan x="310.08" y="424.14">H = 4 µm,  N = 4000,  Δz = 1 nm</tspan>
</text>
<text id="o025" font-family="Arial,sans-serif" font-size="20" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="79.68" y="503.8">Face flux (Rusanov)</tspan>
</text>
<text id="o026" font-family="Arial,sans-serif" font-size="18.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="79.68" y="559.68">F = ½(F_L + F_R) − ½ α (Q_R − Q_L)</tspan>
<tspan x="79.68" y="581.707">α = max(|u_L| + c_L, |u_R| + c_R)</tspan>
</text>
<text id="o027" font-family="Arial,sans-serif" font-size="20" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="703.68" y="503.8">Time step (Heun)</tspan>
</text>
<text id="o028" font-family="Arial,sans-serif" font-size="18.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="703.68" y="559.68">predictor Q* = Qⁿ + Δt L(Qⁿ)</tspan>
<tspan x="703.68" y="581.707">Qⁿ⁺¹ = Qⁿ + ½ Δt [L(Qⁿ) + L(Q*)]</tspan>
</text>
<text id="o029" font-family="Arial,sans-serif" font-size="16.6667" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="310.08" y="462.233">Wall pressure read from the cell next to the wall</tspan>
</text>
<text id="o030" font-family="Arial,sans-serif" font-size="14" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="36.48" y="697.3">Schematic of the discretization of Eqs. (C5-E10) and (C5-E11); only ten of 4000 cells are drawn.</tspan>
</text>
