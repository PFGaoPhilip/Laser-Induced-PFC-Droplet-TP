<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1279.97 720" role="img">
<title>C5-E12 · Axisymmetric compressible flow equations of the COMSOL model</title>
<defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/></marker></defs>
<rect width="1279.97" height="720" fill="#142632"/>
<text id="o000" font-family="Arial,sans-serif" font-size="25.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="31.68" y="41.8267">C5-E12 · Axisymmetric compressible flow equations of the COMSOL model</tspan>
</text>
<rect id="o001" x="76.8" y="163.2" width="614.4" height="96" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.66667" opacity="1"/>
<text id="o002" font-family="Arial,sans-serif" font-size="18.6667" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="89.28" y="191.493">Mass</tspan>
</text>
<text id="o003" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="89.28" y="234.387">∂ₜρ + ∇·(ρu) = 0</tspan>
</text>
<line id="o004" x1="691.2" y1="211.2" x2="796.8" y2="336" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="2.4" opacity="1" marker-end="url(#head)"/>
<rect id="o005" x="76.8" y="288" width="614.4" height="96" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.66667" opacity="1"/>
<text id="o006" font-family="Arial,sans-serif" font-size="18.6667" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="89.28" y="316.293">Momentum</tspan>
</text>
<text id="o007" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="89.28" y="359.187">ρ Du/Dt = −∇p + ∇·(viscous stress)</tspan>
</text>
<line id="o008" x1="691.2" y1="336" x2="796.8" y2="336" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="2.4" opacity="1" marker-end="url(#head)"/>
<rect id="o009" x="76.8" y="412.8" width="614.4" height="96" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.66667" opacity="1"/>
<text id="o010" font-family="Arial,sans-serif" font-size="18.6667" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="89.28" y="441.093">Liquid law</tspan>
</text>
<text id="o011" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="89.28" y="483.987">ρ(p) = ρ_j [(p + Π)/(p_j + Π)]^(1/γ)</tspan>
</text>
<line id="o012" x1="691.2" y1="460.8" x2="796.8" y2="336" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="2.4" opacity="1" marker-end="url(#head)"/>
<rect id="o013" x="806.4" y="249.6" width="422.4" height="172.8" fill="#2B5560" stroke="#F2B880" stroke-width="2.66667" opacity="1"/>
<text id="o014" font-family="Arial,sans-serif" font-size="18.6667" fill="#F2B880" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="1017.6" y="277.893">Fields (axisymmetric)</tspan>
</text>
<text id="o015" font-family="Arial,sans-serif" font-size="18" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="1017.6" y="342.9">ρ,  p</tspan>
<tspan x="1017.6" y="364.14">u_r,  w</tspan>
<tspan x="1017.6" y="385.38">viscosity μ = 1 mPa s</tspan>
</text>
<text id="o016" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" opacity="1">
<tspan x="79.68" y="584.94">Same liquid as the C++ reference, plus radial motion and a small viscosity. No gas phase.</tspan>
</text>
<text id="o017" font-family="Arial,sans-serif" font-size="14" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="36.48" y="697.3">Schematic of Eq. (C5-E12).</tspan>
</text>
</svg>
