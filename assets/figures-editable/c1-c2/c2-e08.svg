<text id="o018" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="139.2" y="172.788">material A</tspan>
</text>
<text id="o019" font-family="Arial,sans-serif" font-size="17.3333" fill="#8EDBD4" text-anchor="start" opacity="1">
<tspan x="626.4" y="172.788">material B</tspan>
</text>
<text id="o020" font-family="Arial,sans-serif" font-size="17.3333" fill="#F28BA0" text-anchor="start" opacity="1">
<tspan x="462.24" y="282.315">T_A − T_B = R_T qₙ</tspan>
</text>
<line id="o021" x1="163.2" y1="486.109" x2="364.8" y2="486.109" fill="#FFFFFF" stroke="#F28BA0" stroke-width="4" opacity="1" marker-end="url(#head)"/>
<line id="o022" x1="499.2" y1="486.109" x2="700.8" y2="486.109" fill="#FFFFFF" stroke="#F28BA0" stroke-width="4" opacity="1" marker-end="url(#head)"/>
<text id="o023" font-family="Arial,sans-serif" font-size="17.3333" fill="#F28BA0" text-anchor="start" opacity="1">
<tspan x="265.92" y="464.715">qₙ</tspan>
</text>
<text id="o024" font-family="Arial,sans-serif" font-size="16" fill="#F28BA0" text-anchor="start" opacity="1">
<tspan x="585.12" y="463.622">qₙ (same)</tspan>
</text>
<rect id="o025" x="796.8" y="144" width="446.4" height="384" rx="30.72" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o026" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="810.24" y="166.44">Resistance at the contact</tspan>
</text>
<text id="o027" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="813.12" y="208.133">Flux continuity:</tspan>
<tspan x="813.12" y="228.587">q_A·n = q_B·n = qₙ</tspan>
</text>
<text id="o028" font-family="Arial,sans-serif" font-size="17.3333" fill="#F28BA0" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="813.12" y="289.733">Temperature jump:</tspan>
<tspan x="813.12" y="310.187">T_A − T_B = R_T qₙ</tspan>
</text>
<text id="o029" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="813.12" y="370.24">R_T (m²K/W) is a property of the interface. The</tspan>
<tspan x="813.12" y="389.12">same heat flows, but a temperature step builds up</tspan>
<tspan x="813.12" y="408">and delays heating of side B.</tspan>
</text>
<text id="o030" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="97.92" y="617.507">Light is absorbed in A, yet B warms only after heat crosses the contact: absorbed energy is not delivered energy.</tspan>
</text>
<text id="o031" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Contact conditions of Eq. C2-E08; profile is schematic.</tspan>
</text>
