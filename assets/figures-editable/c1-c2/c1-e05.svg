<text id="o038" font-family="Arial,sans-serif" font-size="16" fill="#8EDBD4" text-anchor="start" opacity="1">
<tspan x="402.88" y="392.992">expanding, slowing</tspan>
<tspan x="402.88" y="411.872">Ṙ = 1, R̈ = −0.5</tspan>
</text>
<text id="o039" font-family="Arial,sans-serif" font-size="16" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="232.96" y="152.896">collapsing, decelerating</tspan>
<tspan x="232.96" y="171.776">Ṙ = −1, R̈ = +2</tspan>
</text>
<rect id="o040" x="691.2" y="139.2" width="552" height="340.8" rx="27.264" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o041" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="704.64" y="161.64">The wall value has three pieces</tspan>
</text>
<text id="o042" font-family="Arial,sans-serif" font-size="18.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="707.52" y="204.427">pₗ − p∞ = ρ [ R R̈ + 2Ṙ² − Ṙ²/2 ]</tspan>
</text>
<line id="o043" x1="1046.4" y1="240" x2="1046.4" y2="388.8" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="1.6" opacity="1"/>
<text id="o044" font-family="Arial,sans-serif" font-size="17.3333" fill="#7FC8F8" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="707.52" y="256.133">R R̈</tspan>
</text>
<text id="o045" font-family="Arial,sans-serif" font-size="14.6667" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="798.72" y="255.867">wall acceleration</tspan>
</text>
<rect id="o046" x="1020" y="244.8" width="26.4" height="28.8" fill="#7FC8F8" stroke="#7FC8F8" stroke-width="1.33333" opacity="1"/>
<text id="o047" font-family="Arial,sans-serif" font-size="17.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="707.52" y="304.133">2Ṙ²</tspan>
</text>
<text id="o048" font-family="Arial,sans-serif" font-size="14.6667" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="798.72" y="303.867">unsteady potential</tspan>
</text>
<rect id="o049" x="1046.4" y="292.8" width="105.6" height="28.8" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o050" font-family="Arial,sans-serif" font-size="17.3333" fill="#F28BA0" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="707.52" y="352.133">−Ṙ²/2</tspan>
</text>
<text id="o051" font-family="Arial,sans-serif" font-size="14.6667" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="798.72" y="351.867">Bernoulli kinetic term</tspan>
</text>
<rect id="o052" x="1020" y="340.8" width="26.4" height="28.8" fill="#F28BA0" stroke="#F28BA0" stroke-width="1.33333" opacity="1"/>
<text id="o053" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="707.52" y="418.787">Expanding case: −0.5 + 2 − 0.5 = 1.0 = R R̈ + 3Ṙ²/2</tspan>
</text>
<text id="o054" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="693.12" y="515.333">The pressure is stored in the liquid by its inertia: pₗ</tspan>
<tspan x="693.12" y="535.787">exceeds p∞ whenever R R̈ + 3Ṙ²/2 &gt; 0.</tspan>
</text>
<text id="o055" font-family="Arial,sans-serif" font-size="16.6667" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="693.12" y="601.187">Far away the acceleration term decays as 1/r, the Ṙ² term as</tspan>
<tspan x="693.12" y="620.853">1/r⁴.</tspan>
</text>
<text id="o056" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Profile: p − p∞ = ρ[(R²R̈ + 2RṘ²)/r − R⁴Ṙ²/(2r⁴)] from the unsteady Bernoulli equation, R = 1.</tspan>
</text>
</svg>
