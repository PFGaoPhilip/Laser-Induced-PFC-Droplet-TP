.368,380.606 570.169,381.134 573.97,381.657 577.772,382.174 581.573,382.685 585.374,383.19 589.176,383.69 592.977,384.185 596.779,384.674 600.58,385.158 604.381,385.637 608.183,386.111 611.984,386.579 615.785,387.043 619.587,387.502 623.388,387.956 627.189,388.406 630.991,388.851 634.792,389.291 638.593,389.727 642.395,390.158 646.196,390.586 649.997,391.008 653.799,391.427 657.6,391.841" fill="none" stroke="#F2B880" stroke-width="3.73333" opacity="1"/>
