<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1279.97 720" role="img">
<title>C1-E06</title>
<defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/></marker></defs>
<rect width="1279.97" height="720" fill="#142632"/>
<text id="o000" font-family="Arial,sans-serif" font-size="25.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="30.72" y="35.1733">C1-E06 · Newtonian stress and capillary boundary condition</tspan>
</text>
<rect id="o001" x="38.4" y="96" width="422.4" height="508.8" rx="33.792" fill="#1E4A5A" stroke="#2B6678" stroke-width="2" opacity="1"/>
<text id="o002" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="54.72" y="119.4">Stresses on the wall of a collapsing</tspan>
<tspan x="54.72" y="140.64">bubble</tspan>
</text>
<ellipse id="o003" cx="240" cy="336" rx="96" ry="96" fill="#0C1820" stroke="#F2B880" stroke-width="2.93333" opacity="1"/>
<text id="o004" font-family="Arial,sans-serif" font-size="18.6667" fill="#F2B880" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="240" y="341.707">p_b</tspan>
</text>
<line id="o005" x1="276.77" y1="305.146" x2="317.217" y2="271.207" fill="#FFFFFF" stroke="#F2B880" stroke-width="3.73333" opacity="1" marker-end="url(#head)"/>
<text id="o006" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="383.404" y="220.283">p_b</tspan>
</text>
<line id="o007" x1="122.336" y1="237.268" x2="164.989" y2="273.058" fill="#FFFFFF" stroke="#8EDBD4" stroke-width="3.73333" opacity="1" marker-end="url(#head)"/>
<text id="o008" font-family="Arial,sans-serif" font-size="17.3333" fill="#8EDBD4" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="96.5965" y="220.283">pₗ</tspan>
</text>
<line id="o009" x1="122.336" y1="434.732" x2="164.989" y2="398.942" fill="#FFFFFF" stroke="#F28BA0" stroke-width="3.73333" opacity="1" marker-end="url(#head)"/>
<text id="o010" font-family="Arial,sans-serif" font-size="17.3333" fill="#F28BA0" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="96.5965" y="460.943">2σ/R</tspan>
</text>
<line id="o011" x1="357.664" y1="434.732" x2="315.011" y2="398.942" fill="#FFFFFF" stroke="#7FC8F8" stroke-width="3.73333" opacity="1" marker-end="url(#head)"/>
<text id="o012" font-family="Arial,sans-serif" font-size="17.3333" fill="#7FC8F8" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="383.404" y="460.943">4μṘ/R</tspan>
</text>
<text id="o013" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="54.72" y="514.787">Gas pushes out; tension pulls in; viscosity</tspan>
<tspan x="54.72" y="534.453">resists the strain rate ∂u/∂r = −2Ṙ/R at the</tspan>
<tspan x="54.72" y="554.12">wall.</tspan>
</text>
<line id="o014" x1="566.4" y1="556.8" x2="1228.8" y2="556.8" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="2" opacity="1"/>
<line id="o015" x1="566.4" y1="144" x2="566.4" y2="556.8" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="2" opacity="1"/>
<line id="o016" x1="559.68" y1="556.8" x2="566.4" y2="556.8" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="1.33333" opacity="1"/>
<line id="o017" x1="566.4" y1="556.8" x2="1228.8" y2="556.8" fill="#FFFFFF" stroke="#2E4756" stroke-width="0.8" opacity="1"/>
<text id="o018" font-family="Arial,sans-serif" font-size="14" fill="#B4C7D2" text-anchor="end" opacity="1">
<tspan x="554.88" y="561.56">0</tspan>
</text>
<line id="o019" x1="559.68" y1="438.857" x2="566.4" y2="438.857" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="1.33333" opacity="1"/>
<line id="o020" x1="566.4" y1="438.857" x2="1228.8" y2="438.857" fill="#FFFFFF" stroke="#2E4756" stroke-width="0.8" opacity="1"/>
<text id="o021" font-family="Arial,sans-serif" font-size="14" fill="#B4C7D2" text-anchor="end" opacity="1">
<tspan x="554.88" y="443.617">40</tspan>
</text>
<line id="o022" x1="559.68" y1="320.914" x2="566.4" y2="320.914" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="1.33333" opacity="1"/>
<line id="o023" x1="566.4" y1="320.914" x2="1228.8" y2="320.914" fill="#FFFFFF" stroke="#2E4756" stroke-width="0.8" opacity="1"/>
<text id="o024" font-family="Arial,sans-serif" font-size="14" fill="#B4C7D2" text-anchor="end" opacity="1">
<tspan x="554.88" y="325.674">80</tspan>
</text>
<line id="o025" x1="559.68" y1="202.971" x2="566.4" y2="202.971" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="1.33333" opacity="1"/>
<line id="o026" x1="566.4" y1="202.971" x2="1228.8" y2="202.971" fill="#FFFFFF" stroke="#2E4756" stroke-width="0.8" opacity="1"/>
<text id="o027" font-family="Arial,sans-serif" font-size="14" fill="#B4C7D2" text-anchor="end" opacity="1">
<tspan x="554.88" y="207.731">120</tspan>
</text>
<text id="o028" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="510.72" y="122.56">pressure (kPa)</tspan>
</text>
<rect id="o029" x="586.272" y="202.971" width="125.856" height="353.829" fill="#F2B880" stroke="#F2B880" stroke-width="1.33333" opacity="0.85"/>
<text id="o030" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="624.672" y="186.745">p_b = 120</tspan>
</text>
<rect id="o031" x="751.872" y="202.971" width="125.856" height="42.4594" fill="#F28BA0" stroke="#F28BA0" stroke-width="1.33333" opacity="0.85"/>
<text id="o032" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="790.272" y="186.745">−2σ/R = −14.4</tspan>
</text>
<rect id="o033" x="917.472" y="239.534" width="125.856" height="5.89714" fill="#7FC8F8" stroke="#7FC8F8" stroke-width="1.33333" opacity="0.85"/>
<text id="o034" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="955.872" y="223.307">−4μṘ/R = +2.0</tspan>
</text>
<rect id="o035" x="1083.07" y="239.534" width="125.856" height="317.266" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="0.85"/>
<text id="o036" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="1121.47" y="223.307">pₗ = 107.6</tspan>
</text>
<text id="o037" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="568.32" y="609.693">R = 10 µm, σ = 0.072 N/m, μ = 1 mPa·s, Ṙ = −5 m/s, p_b = 120 kPa</tspan>
</text>
<text id="o038" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="568.32" y="644.933">Inward motion makes the viscous term raise pₗ; tension always lowers it.</tspan>
</text>
<text id="o039" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Boundary condition pₗ = p_b − 2σ/R − 4μṘ/R (Eq. C1-E06); numbers computed from it.</tspan>
</text>
</svg>
