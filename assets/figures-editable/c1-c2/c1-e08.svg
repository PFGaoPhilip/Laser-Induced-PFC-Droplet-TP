<text x="172" y="209.44" font-family="Arial,sans-serif" font-size="18" fill="#E7F0F3">PFC vapor + water vapor</text>
<text x="182" y="249.44" font-family="Arial,sans-serif" font-size="18" fill="#E7F0F3">+ permanent gas</text>
<ellipse cx="305" cy="275" rx="20" ry="20" fill="#F6BC77" stroke="#B4C7D2" stroke-width="2.21"/>
<text x="452" y="202.68" font-family="Arial,sans-serif" font-size="21" fill="#E7F0F3">p_b = p_v,PFC + p_v,w + p_g</text>
<text x="452" y="259.44" font-family="Arial,sans-serif" font-size="18" fill="#E7F0F3">Residual PFC liquid: finite inventory</text>
<text x="32" y="426.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">pb</text>
<text x="32" y="450.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">pv,w</text>
<text x="32" y="474.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">Finite PFC liquid inventory</text>
<text x="507" y="426.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">pv,PFC</text>
<text x="507" y="450.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">pg</text>
<text x="32" y="532.28" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2">Partial pressures need mass and energy histories</text>
