<tspan x="460.8" y="572.8">z / L</tspan>
</text>
<text id="o038" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="69.12" y="266.56">Π / Π₀</tspan>
</text>
<polyline id="o039" points="124.8,309.818 138.514,314.271 152.229,318.724 165.943,323.176 179.657,327.629 193.371,332.082 207.086,336.534 220.8,340.987 234.514,345.44 248.229,349.892 261.943,354.345 275.657,358.798 289.371,363.25 303.086,367.703 316.8,372.156 330.514,376.609 344.229,381.061 357.943,385.514 371.657,389.967 385.371,394.419 399.086,398.872 412.8,403.325 426.514,407.777 440.229,412.23 453.943,416.683 467.657,421.135 481.371,425.588 495.086,430.041 508.8,434.494 522.514,438.946 536.229,443.399 549.943,447.852 563.657,452.304 577.371,456.757 591.086,461.21 604.8,465.662 618.514,470.115 632.229,474.568 645.943,479.02 659.657,483.473 673.371,487.926 687.086,492.378 700.8,496.831 714.514,501.284 728.229,505.737 741.943,510.189 755.657,514.642 769.371,519.095 783.086,523.547 796.8,528" fill="none" stroke="#F2B880" stroke-width="4.26667" opacity="1"/>
<ellipse id="o040" cx="124.8" cy="309.818" rx="7.68" ry="7.68" fill="#F2B880" stroke="#F2B880" stroke-width="1.33333" opacity="1"/>
<ellipse id="o041" cx="796.8" cy="528" rx="7.68" ry="7.68" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o042" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="376.32" y="377.442">Π(z) = Π₀(1 − z/L)</tspan>
</text>
<rect id="o043" x="854.4" y="115.2" width="388.8" height="441.6" rx="31.104" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o044" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="867.84" y="137.64">Straight column</tspan>
</text>
<text id="o045" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="870.72" y="179.333">d²Π/dz² = 0</tspan>
<tspan x="870.72" y="199.787">Π = Π₀ (1 − z/L)</tspan>
</text>
<text id="o046" font-family="Arial,sans-serif" font-size="17.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="870.72" y="260.933">Δu_z = −(1/ρ) dΠ/dz = Π₀ / (ρL)</tspan>
</text>
<text id="o047" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="870.72" y="322.24">With Π₀ = 0.30 Pa·s, ρ = 1000 kg/m³, L =</tspan>
<tspan x="870.72" y="341.12">100 µm:</tspan>
</text>
<text id="o048" font-family="Arial,sans-serif" font-size="22.6667" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="870.72" y="380.507">Δu_z = 3.0 m/s</tspan>
</text>
<text id="o049" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="870.72" y="437.44">The impulse drops linearly, so every slice</tspan>
<tspan x="870.72" y="456.32">gets the same velocity change toward the</tspan>
<tspan x="870.72" y="475.2">outlet.</tspan>
</text>
<text id="o050" font-family="Arial,sans-serif" font-size="18" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="49.92" y="611.88">A constant gradient means uniform acceleration: the whole column leaves the driven end as one plug.</tspan>
</text>
<text id="o051" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Boundary values Π(0) = Π₀, Π(L) = 0 (Eq. C1-E24).</tspan>
</text>
</svg>
