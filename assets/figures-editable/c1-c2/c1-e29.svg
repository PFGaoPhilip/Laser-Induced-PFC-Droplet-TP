<tspan x="746.88" y="161.691">solid: left side, dashed: right side; relative gap 1e-05</tspan>
</text>
<rect id="o034" x="38.4" y="96" width="595.2" height="518.4" rx="41.472" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o035" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="51.84" y="118.44">The general closure contains the sphere</tspan>
</text>
<text id="o036" font-family="Arial,sans-serif" font-size="16.6667" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="59.52" y="159.587">General closure, Eq. C1-E28</tspan>
</text>
<text id="o037" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="83.52" y="190.307">D φ/Dt = ½|u|² + (p∞ − p_b − σκ)/ρ</tspan>
</text>
<line id="o038" x1="326.4" y1="207.533" x2="326.4" y2="226.733" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="2.66667" opacity="1" marker-end="url(#head)"/>
<text id="o039" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="59.52" y="248.08">Insert the sphere</tspan>
</text>
<text id="o040" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="83.52" y="278.8">φ_Γ = −RṘ,   κ = −2/R</tspan>
</text>
<line id="o041" x1="326.4" y1="296.027" x2="326.4" y2="315.227" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="2.66667" opacity="1" marker-end="url(#head)"/>
<text id="o042" font-family="Arial,sans-serif" font-size="16.6667" fill="#7FC8F8" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="59.52" y="336.573">Differentiate along the wall</tspan>
</text>
<text id="o043" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="83.52" y="367.293">−Ṙ² − RR̈ = (p∞ − p_b + 2σ/R)/ρ + ½Ṙ²</tspan>
</text>
<line id="o044" x1="326.4" y1="384.52" x2="326.4" y2="403.72" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="2.66667" opacity="1" marker-end="url(#head)"/>
<text id="o045" font-family="Arial,sans-serif" font-size="16.6667" fill="#F28BA0" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="59.52" y="425.067">Rearrange</tspan>
</text>
<text id="o046" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="83.52" y="455.787">ρ(RR̈ + 3Ṙ²/2) = p_b − p∞ − 2σ/R</tspan>
</text>
<text id="o047" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="59.52" y="547.84">This is the Rayleigh–Plesset equation without viscosity: the</tspan>
<tspan x="59.52" y="566.72">spatial theory returns the spherical model in its own limit.</tspan>
</text>
<text id="o048" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="721.92" y="610.787">Check: R(t) from the solution, R̈ by finite differences.</tspan>
<tspan x="721.92" y="630.453">The two sides coincide, so the algebra above is exact.</tspan>
</text>
<text id="o049" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Inviscid Rayleigh–Plesset run: R₀ = 5 µm, p_g0 = 1 MPa, γ = 1.4, σ = 0.072 N/m.</tspan>
</text>
</svg>
