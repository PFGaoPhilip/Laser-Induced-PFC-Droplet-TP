<tspan x="432" y="387.787">400 kPa</tspan>
</text>
<text id="o040" font-family="Arial,sans-serif" font-size="18" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="54.72" y="453.48">p_d ≃ p_c + 2σ_pc/a + Πₛₕₑₗₗ</tspan>
</text>
<text id="o041" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="54.72" y="495.04">σ_pc = 0.020 N/m (teaching value); the shell term is</tspan>
<tspan x="54.72" y="513.92">added separately.</tspan>
</text>
<text id="o042" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="587.52" y="617.507">Same tension, 50 times smaller radius: capillary pressure 50 times larger</tspan>
<tspan x="587.52" y="637.173">(2σ/a is inversely proportional to a).</tspan>
</text>
<text id="o043" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
