<tspan x="182.4" y="323.253">8 kPa</tspan>
</text>
<ellipse id="o038" cx="422.4" cy="307.2" rx="33.6" ry="33.6" fill="#1E4A5A" stroke="#F28BA0" stroke-width="2.93333" opacity="1"/>
