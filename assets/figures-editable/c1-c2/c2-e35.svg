<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1279.97 720" role="img">
<title>C2-E35</title>
<defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/></marker></defs>
<rect width="1279.97" height="720" fill="#142632"/>
<text id="o000" font-family="Arial,sans-serif" font-size="25.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="30.72" y="35.1733">C2-E35 · Original inventory and pressure formulas for Defense 3</tspan>
</text>
<rect id="o001" x="48" y="115.2" width="384" height="297.6" rx="23.808" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o002" font-family="Arial,sans-serif" font-size="19.3333" fill="#8EDBD4" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="240" y="142.573">Initial mass</tspan>
</text>
<text id="o003" font-family="Arial,sans-serif" font-size="18.6667" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="240" y="218.827">m_PFC,0 = (4π/3) ρ_d a₀³</tspan>
</text>
<text id="o004" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="240" y="360.64">fixed by the real core volume</tspan>
</text>
<rect id="o005" x="451.2" y="115.2" width="384" height="297.6" rx="23.808" fill="#213E4B" stroke="#F2B880" stroke-width="2.13333" opacity="1"/>
<text id="o006" font-family="Arial,sans-serif" font-size="19.3333" fill="#F2B880" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="643.2" y="142.573">Ledger</tspan>
</text>
<text id="o007" font-family="Arial,sans-serif" font-size="18.6667" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="643.2" y="218.827">mₗ + mᵥ + m_diss + m_esc = m_PFC,0</tspan>
</text>
<text id="o008" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="643.2" y="360.64">no external compound supply</tspan>
</text>
<rect id="o009" x="854.4" y="115.2" width="384" height="297.6" rx="23.808" fill="#213E4B" stroke="#7FC8F8" stroke-width="2.13333" opacity="1"/>
<text id="o010" font-family="Arial,sans-serif" font-size="19.3333" fill="#7FC8F8" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="1046.4" y="142.573">Vapor pressure</tspan>
</text>
<text id="o011" font-family="Arial,sans-serif" font-size="18.6667" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="1046.4" y="218.827">pᵥ,PFC V_b = (mᵥ / M_PFC) Rᵤ T_b</tspan>
</text>
<text id="o012" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="1046.4" y="360.64">ideal PFC partial pressure</tspan>
</text>
<rect id="o013" x="48" y="436.8" width="1171.2" height="163.2" rx="13.056" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o014" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="61.44" y="459.24">How the three connect</tspan>
</text>
<text id="o015" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="64.32" y="496.133">The mass ledger caps mᵥ; the gas law turns mᵥ into a pressure; the pressure feeds the radius equation of Chapter 1.</tspan>
</text>
<text id="o016" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="64.32" y="553.187">If mᵥ never exceeds m_PFC,0, then the vapor pressure at fixed V_b and T_b cannot exceed m_PFC,0 Rᵤ T_b / (M_PFC V_b).</tspan>
</text>
<text id="o017" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Reference formulas of the Defence 3 answer: Eqs. C2-E18, E24, E27.</tspan>
</text>
</svg>
