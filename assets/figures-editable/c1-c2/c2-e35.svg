<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 664" role="img"><title>C2-E35 Original finite-inventory formulas used in the reference answer.</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8EDBD4"/></marker></defs>
<rect width="980" height="664" fill="#142632"/>
<text x="28" y="42.52" font-family="Arial,sans-serif" font-size="19" fill="#8EDBD4">C2-E35 | Physical-variable diagram</text>
<rect x="80" y="140" width="290" height="110" fill="#213E4B" stroke="#B4C7D2" stroke-width="1.9500000000000002"/>
<text x="92" y="169.44" font-family="Arial,sans-serif" font-size="18" fill="#E7F0F3">Initial PFC mass m_PFC,0</text>
<line x1="380" y1="195" x2="480" y2="195" fill="none" stroke="#8EDBD4" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="510" y="100" width="205" height="95" fill="#213E4B" stroke="#B4C7D2" stroke-width="1.9500000000000002"/>
<text x="522" y="129.44" font-family="Arial,sans-serif" font-size="18" fill="#E7F0F3">Liquid m_l</text>
<rect x="730" y="100" width="205" height="95" fill="#213E4B" stroke="#B4C7D2" stroke-width="1.9500000000000002"/>
<text x="742" y="129.44" font-family="Arial,sans-serif" font-size="18" fill="#E7F0F3">Vapor m_v</text>
<rect x="510" y="230" width="205" height="95" fill="#213E4B" stroke="#B4C7D2" stroke-width="1.9500000000000002"/>
<text x="522" y="259.44" font-family="Arial,sans-serif" font-size="18" fill="#E7F0F3">Dissolved m_diss</text>
<rect x="730" y="230" width="205" height="95" fill="#213E4B" stroke="#B4C7D2" stroke-width="1.9500000000000002"/>
<text x="742" y="259.44" font-family="Arial,sans-serif" font-size="18" fill="#E7F0F3">Escaped m_esc</text>
<text x="92" y="376.6" font-family="Arial,sans-serif" font-size="20" fill="#E7F0F3">Sum of all compartments equals initial inventory.</text>
<text x="32" y="426.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">a₀, ρ_d: initial core</text>
<text x="32" y="450.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">m_l, m_v, m_diss, m_esc: compartments</text>
<text x="32" y="474.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">V_b, T_b: bubble state</text>
<text x="32" y="498.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">π: initial sphere</text>
<text x="507" y="426.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">m_PFC,0: total supply</text>
<text x="507" y="450.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">p_v,PFC: partial pressure</text>
<text x="507" y="474.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">M_PFC, R_u: ideal conversion</text>
<text x="32" y="537.28" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2">All compound compartments sum to the original mass</text>
<text x="32" y="561.28" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2">Water cannot be a source of unlimited PFC vapor</text>
</svg>