<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1279.97 720" role="img">
<title>C2-E07</title>
<defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/></marker></defs>
<rect width="1279.97" height="720" fill="#142632"/>
<text id="o000" font-family="Arial,sans-serif" font-size="25.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="30.72" y="35.1733">C2-E07 · Reduced heat equation and Fourier constitutive law</tspan>
</text>
<rect id="o001" x="38.4" y="96" width="614.4" height="518.4" rx="41.472" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o002" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="51.84" y="118.44">Energy balance of a small parcel</tspan>
</text>
<rect id="o003" x="240" y="259.2" width="211.2" height="153.6" fill="#2B6678" stroke="#8EDBD4" stroke-width="3.2" opacity="0.9"/>
<text id="o004" font-family="Arial,sans-serif" font-size="18" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="345.6" y="323.88">ρ cₚ DT/Dt</tspan>
</text>
<line id="o005" x1="96" y1="336" x2="235.2" y2="336" fill="#FFFFFF" stroke="#F28BA0" stroke-width="4.66667" opacity="1" marker-end="url(#head)"/>
<text id="o006" font-family="Arial,sans-serif" font-size="16" fill="#F28BA0" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="144" y="303.04">conduction in</tspan>
<tspan x="144" y="321.92">−∇·q</tspan>
</text>
<line id="o007" x1="456" y1="336" x2="595.2" y2="336" fill="#FFFFFF" stroke="#F28BA0" stroke-width="4.66667" opacity="1" marker-end="url(#head)"/>
<text id="o008" font-family="Arial,sans-serif" font-size="16" fill="#F28BA0" text-anchor="middle" opacity="1">
<tspan x="552" y="303.04">conduction out</tspan>
</text>
<line id="o009" x1="345.6" y1="192" x2="345.6" y2="254.4" fill="#FFFFFF" stroke="#F2B880" stroke-width="4.66667" opacity="1" marker-end="url(#head)"/>
<text id="o010" font-family="Arial,sans-serif" font-size="16" fill="#F2B880" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="364.8" y="163.84">absorbed light Q_abs</tspan>
</text>
<text id="o011" font-family="Arial,sans-serif" font-size="18" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="59.52" y="467.88">Stored heat rate  =  net conduction  +  optical source</tspan>
</text>
<text id="o012" font-family="Arial,sans-serif" font-size="16.6667" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="59.52" y="514.787">q = −k∇T (Fourier),   D/Dt = ∂/∂t + u·∇</tspan>
</text>
<rect id="o013" x="681.6" y="96" width="561.6" height="518.4" rx="41.472" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o014" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="695.04" y="118.44">Two different heating jobs</tspan>
</text>
<rect id="o015" x="710.4" y="192" width="153.6" height="326.4" fill="#3A5362" stroke="#B4C7D2" stroke-width="1.86667" opacity="1"/>
<text id="o016" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="787.2" y="341.987">absorber</tspan>
<tspan x="787.2" y="361.653">Q_abs ≠ 0</tspan>
</text>
<line id="o017" x1="868.8" y1="355.2" x2="950.4" y2="355.2" fill="#FFFFFF" stroke="#F28BA0" stroke-width="4.66667" opacity="1" marker-end="url(#head)"/>
<ellipse id="o018" cx="1065.6" cy="355.2" rx="96" ry="96" fill="#1E4A5A" stroke="#8EDBD4" stroke-width="2.93333" opacity="1"/>
<text id="o019" font-family="Arial,sans-serif" font-size="16.6667" fill="#8EDBD4" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="1065.6" y="356.387">PFC</tspan>
<tspan x="1065.6" y="376.053">Q_abs = 0</tspan>
</text>
<text id="o020" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="702.72" y="548.387">Heating the absorber and heating the PFC are separate steps</tspan>
<tspan x="702.72" y="568.053">joined only by conduction across the contact.</tspan>
</text>
<text id="o021" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Reduced heat equation of Eq. C2-E07; sketch of the heat path.</tspan>
</text>
</svg>
