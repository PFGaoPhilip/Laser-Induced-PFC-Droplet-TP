<text id="o052" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="760.32" y="356.248">1/μₐ = 5 µm: I = Iᵢₙ/e = 0.37 Iᵢₙ</tspan>
</text>
<text id="o053" font-family="Arial,sans-serif" font-size="17.3333" fill="#8EDBD4" text-anchor="start" opacity="1">
<tspan x="880.32" y="260.248">I(z) = Iᵢₙ e^(−μₐ z)</tspan>
<tspan x="880.32" y="280.701">μₐ = 2×10⁵ m⁻¹</tspan>
</text>
<text id="o054" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="587.52" y="618.053">Heat deposition follows the same curve: most of it lands within a</tspan>
<tspan x="587.52" y="638.507">few 1/μₐ of the surface.</tspan>
</text>
<text id="o055" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Beer–Lambert decay of Eq. C2-E05 with the teaching absorption coefficient.</tspan>
</text>
</svg>
