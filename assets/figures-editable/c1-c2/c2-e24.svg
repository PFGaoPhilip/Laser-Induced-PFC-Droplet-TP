<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 650" role="img"><title>C2-E24 The pressure responds to species masses, temperature, and changing volume.</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8EDBD4"/></marker></defs>
<rect width="980" height="650" fill="#142632"/>
<text x="28" y="42.52" font-family="Arial,sans-serif" font-size="19" fill="#8EDBD4">C2-E24 | Physical-variable diagram</text>
<rect x="60" y="120" width="280" height="95" fill="#213E4B" stroke="#B4C7D2" stroke-width="1.9500000000000002"/>
<text x="72" y="149.44" font-family="Arial,sans-serif" font-size="18" fill="#E7F0F3">Species masses m_v,s</text>
<line x1="200" y1="225" x2="490" y2="305" fill="none" stroke="#8EDBD4" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="370" y="120" width="280" height="95" fill="#213E4B" stroke="#B4C7D2" stroke-width="1.9500000000000002"/>
<text x="382" y="149.44" font-family="Arial,sans-serif" font-size="18" fill="#E7F0F3">Temperature T_b</text>
<line x1="510" y1="225" x2="490" y2="305" fill="none" stroke="#8EDBD4" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="680" y="120" width="280" height="95" fill="#213E4B" stroke="#B4C7D2" stroke-width="1.9500000000000002"/>
<text x="692" y="149.44" font-family="Arial,sans-serif" font-size="18" fill="#E7F0F3">Bubble volume V_b</text>
<line x1="820" y1="225" x2="490" y2="305" fill="none" stroke="#8EDBD4" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="310" y="295" width="360" height="65" fill="#213E4B" stroke="#B4C7D2" stroke-width="1.9500000000000002"/>
<text x="322" y="324.44" font-family="Arial,sans-serif" font-size="18" fill="#E7F0F3">Mixture pressure p_b</text>
<text x="32" y="426.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">m_v,s, M_s: species mole inventory</text>
<text x="32" y="450.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">V_b: finite bubble volume</text>
<text x="32" y="474.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">p_b: total mixture pressure</text>
<text x="32" y="498.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">ρ_b, e_b, Y: real-mixture state</text>
<text x="507" y="426.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">T_b: common temperature</text>
<text x="507" y="450.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">p_v,s: component pressure</text>
<text x="507" y="474.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">R_u: gas constant</text>
<text x="507" y="498.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">s = 1…N_s; P: EOS function</text>
<text x="32" y="537.28" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2">Permanent gas remains after condensable vapor is removed</text>
<text x="32" y="561.28" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2">Dense compression requires a calibrated EOS</text>
</svg>