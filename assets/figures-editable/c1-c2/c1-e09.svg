<ellipse id="o048" cx="969.6" cy="360" rx="82.08" ry="82.08" fill="#1E4A5A" stroke="#B4C7D2" stroke-width="1.06667" opacity="0.85"/>
<ellipse id="o049" cx="969.6" cy="360" rx="62.64" ry="62.64" fill="#2B6678" stroke="#B4C7D2" stroke-width="1.06667" opacity="0.85"/>
<ellipse id="o050" cx="969.6" cy="360" rx="49.68" ry="49.68" fill="#1E4A5A" stroke="#B4C7D2" stroke-width="1.06667" opacity="0.85"/>
<ellipse id="o051" cx="969.6" cy="360" rx="43.2" ry="43.2" fill="#0C1820" stroke="#F2B880" stroke-width="2.93333" opacity="1"/>
<text id="o052" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="717.12" y="524.387">u² ∝ r⁻⁴ but shell volume ∝ r²: the integrand falls as</tspan>
<tspan x="717.12" y="544.053">r⁻², so even an infinite liquid holds finite energy.</tspan>
</text>
<text id="o053" font-family="Arial,sans-serif" font-size="18" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="93.12" y="618.6">Kₗ = ∫ ½ρu² 4πr² dr = 2πρR⁴Ṙ² ∫ r⁻² dr = 2πρR³Ṙ²</tspan>
</text>
<text id="o054" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="93.12" y="659.333">Half of it is within one extra bubble radius of the wall.</tspan>
</text>
<text id="o055" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Cumulative fraction K(&lt;r)/K = 1 − R/r from Eq. C1-E09.</tspan>
</text>
