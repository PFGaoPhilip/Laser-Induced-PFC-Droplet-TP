<text id="o042" font-family="Arial,sans-serif" font-size="16" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="285.12" y="181.166">K(∞) = 2πρR³Ṙ² is finite</tspan>
</text>
<rect id="o043" x="700.8" y="139.2" width="542.4" height="451.2" rx="36.096" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o044" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="714.24" y="161.64">Energy lives in thin shells</tspan>
</text>
<text id="o045" font-family="Arial,sans-serif" font-size="18" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="717.12" y="203.88">dK = ½ρu² · 4πr² dr  ∝  r⁻² dr</tspan>
</text>
<ellipse id="o046" cx="969.6" cy="360" rx="138.24" ry="138.24" fill="#1E4A5A" stroke="#B4C7D2" stroke-width="1.06667" opacity="0.85"/>
