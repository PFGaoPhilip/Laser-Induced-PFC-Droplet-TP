<text id="o042" font-family="Arial,sans-serif" font-size="17.3333" fill="#142632" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="677.28" y="188.933">1</tspan>
</text>
<text id="o043" font-family="Arial,sans-serif" font-size="17.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="721.92" y="167.813">Known φ on Γ</tspan>
</text>
<text id="o044" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="721.92" y="206.493">solve ∇²φ = 0 in the liquid</tspan>
</text>
<line id="o045" x1="940.8" y1="240" x2="940.8" y2="259.2" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="2.66667" opacity="1" marker-end="url(#head)"/>
<rect id="o046" x="643.2" y="259.2" width="600" height="96" rx="7.68" fill="#213E4B" stroke="#7FC8F8" stroke-width="2.13333" opacity="1"/>
<ellipse id="o047" cx="676.8" cy="307.2" rx="23.04" ry="23.04" fill="#7FC8F8" stroke="#7FC8F8" stroke-width="1.33333" opacity="1"/>
<text id="o048" font-family="Arial,sans-serif" font-size="17.3333" fill="#142632" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="677.28" y="304.133">2</tspan>
</text>
<text id="o049" font-family="Arial,sans-serif" font-size="17.3333" fill="#7FC8F8" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="721.92" y="283.013">u = ∇φ at the surface</tspan>
</text>
<text id="o050" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="721.92" y="321.693">normal speed Vₙ = ∂φ/∂n</tspan>
</text>
<line id="o051" x1="940.8" y1="355.2" x2="940.8" y2="374.4" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="2.66667" opacity="1" marker-end="url(#head)"/>
<rect id="o052" x="643.2" y="374.4" width="600" height="96" rx="7.68" fill="#213E4B" stroke="#F2B880" stroke-width="2.13333" opacity="1"/>
<ellipse id="o053" cx="676.8" cy="422.4" rx="23.04" ry="23.04" fill="#F2B880" stroke="#F2B880" stroke-width="1.33333" opacity="1"/>
<text id="o054" font-family="Arial,sans-serif" font-size="17.3333" fill="#142632" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="677.28" y="419.333">3</tspan>
</text>
<text id="o055" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="721.92" y="398.213">Advect: dX/dt = u(X, t)</tspan>
</text>
<text id="o056" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="721.92" y="436.893">new shape Γ(t + dt), new curvature κ</tspan>
</text>
<line id="o057" x1="940.8" y1="470.4" x2="940.8" y2="489.6" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="2.66667" opacity="1" marker-end="url(#head)"/>
<rect id="o058" x="643.2" y="489.6" width="600" height="96" rx="7.68" fill="#213E4B" stroke="#F28BA0" stroke-width="2.13333" opacity="1"/>
<ellipse id="o059" cx="676.8" cy="537.6" rx="23.04" ry="23.04" fill="#F28BA0" stroke="#F28BA0" stroke-width="1.33333" opacity="1"/>
<text id="o060" font-family="Arial,sans-serif" font-size="17.3333" fill="#142632" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="677.28" y="534.533">4</tspan>
</text>
<text id="o061" font-family="Arial,sans-serif" font-size="17.3333" fill="#F28BA0" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="721.92" y="513.413">Update φ on Γ</tspan>
</text>
<text id="o062" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="721.92" y="552.093">Dφ/Dt = ½|u|² + (p∞ − p_b − σκ)/ρ</tspan>
</text>
<text id="o063" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="645.12" y="625.187">The shape and the potential evolve together; changing geometry is</tspan>
<tspan x="645.12" y="644.853">what creates focusing.</tspan>
</text>
<text id="o064" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Schematic of the loop of Eq. C1-E28; the deformed shape is illustrative.</tspan>
</text>
