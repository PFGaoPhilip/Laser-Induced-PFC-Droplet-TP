<text id="o038" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="54.72" y="523.84">Surface velocity u = ∇φ differs from point to point; the shape</tspan>
<tspan x="54.72" y="542.72">changes as it is carried along.</tspan>
</text>
<text id="o039" font-family="Arial,sans-serif" font-size="18.6667" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="645.12" y="113.227">Closure loop (inviscid, before impact)</tspan>
</text>
<rect id="o040" x="643.2" y="144" width="600" height="96" rx="7.68" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
