<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1279.97 720" role="img">
<title>C2-E23</title>
<defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/></marker></defs>
<rect width="1279.97" height="720" fill="#142632"/>
<text id="o000" font-family="Arial,sans-serif" font-size="25.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="30.72" y="35.1733">C2-E23 · Product-rule derivation of thermal closure</tspan>
</text>
<rect id="o001" x="38.4" y="96" width="537.6" height="518.4" rx="41.472" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o002" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="51.84" y="118.44">From U_b to a temperature equation</tspan>
</text>
<text id="o003" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="59.52" y="159.587">Internal energy</tspan>
</text>
<text id="o004" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="83.52" y="191.267">U_b = Σ mᵥ,s eₛ(T_b)</tspan>
</text>
<text id="o005" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="59.52" y="245.2">Product rule</tspan>
</text>
<text id="o006" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="83.52" y="276.88">U̇_b = (Σ m cᵥ) Ṫ_b + Σ eₛ ṁᵥ,s</tspan>
</text>
<text id="o007" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="59.52" y="330.813">Insert the first law</tspan>
</text>
<text id="o008" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="83.52" y="362.493">(Σ m cᵥ) Ṫ_b = Q̇_b − p_b V̇_b + Σ (hᵥ,s − eₛ) ṁᵥ,s</tspan>
</text>
<text id="o009" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="59.52" y="415.88">For an ideal vapor h − e = Rᵤ T / M = 9.3 kJ/kg at 323 K,</tspan>
<tspan x="59.52" y="434.76">so every mass added also carries the work term.</tspan>
</text>
<text id="o010" font-family="Arial,sans-serif" font-size="17.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="606.72" y="116.933">Terms that change the bubble temperature (illustrative, W)</tspan>
</text>
<line id="o011" x1="624" y1="489.6" x2="1228.8" y2="489.6" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="2" opacity="1"/>
<line id="o012" x1="624" y1="163.2" x2="624" y2="489.6" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="2" opacity="1"/>
<line id="o013" x1="617.28" y1="489.6" x2="624" y2="489.6" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="1.33333" opacity="1"/>
<line id="o014" x1="624" y1="489.6" x2="1228.8" y2="489.6" fill="#FFFFFF" stroke="#2E4756" stroke-width="0.8" opacity="1"/>
<text id="o015" font-family="Arial,sans-serif" font-size="14" fill="#B4C7D2" text-anchor="end" opacity="1">
<tspan x="612.48" y="494.36">0</tspan>
</text>
<line id="o016" x1="617.28" y1="403.705" x2="624" y2="403.705" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="1.33333" opacity="1"/>
<line id="o017" x1="624" y1="403.705" x2="1228.8" y2="403.705" fill="#FFFFFF" stroke="#2E4756" stroke-width="0.8" opacity="1"/>
<text id="o018" font-family="Arial,sans-serif" font-size="14" fill="#B4C7D2" text-anchor="end" opacity="1">
<tspan x="612.48" y="408.465">0.5</tspan>
</text>
<line id="o019" x1="617.28" y1="317.811" x2="624" y2="317.811" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="1.33333" opacity="1"/>
<line id="o020" x1="624" y1="317.811" x2="1228.8" y2="317.811" fill="#FFFFFF" stroke="#2E4756" stroke-width="0.8" opacity="1"/>
<text id="o021" font-family="Arial,sans-serif" font-size="14" fill="#B4C7D2" text-anchor="end" opacity="1">
<tspan x="612.48" y="322.571">1</tspan>
</text>
<line id="o022" x1="617.28" y1="231.916" x2="624" y2="231.916" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="1.33333" opacity="1"/>
<line id="o023" x1="624" y1="231.916" x2="1228.8" y2="231.916" fill="#FFFFFF" stroke="#2E4756" stroke-width="0.8" opacity="1"/>
<text id="o024" font-family="Arial,sans-serif" font-size="14" fill="#B4C7D2" text-anchor="end" opacity="1">
<tspan x="612.48" y="236.676">1.5</tspan>
</text>
<rect id="o025" x="645.168" y="266.274" width="108.864" height="223.326" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="0.85"/>
<text id="o026" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="699.6" y="251.967">1.30</tspan>
</text>
<text id="o027" font-family="Arial,sans-serif" font-size="14.6667" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="699.6" y="511.227">Σ(h−e)ṁ</tspan>
</text>
<rect id="o028" x="796.368" y="214.737" width="108.864" height="51.5368" fill="#F28BA0" stroke="#F28BA0" stroke-width="1.33333" opacity="0.85"/>
<text id="o029" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="850.8" y="200.43">+0.30</tspan>
</text>
<text id="o030" font-family="Arial,sans-serif" font-size="14.6667" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="850.8" y="511.227">Q̇_b</tspan>
</text>
<rect id="o031" x="947.568" y="214.737" width="108.864" height="154.611" fill="#F2B880" stroke="#F2B880" stroke-width="1.33333" opacity="0.85"/>
<text id="o032" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="1002" y="200.43">-0.90</tspan>
</text>
<text id="o033" font-family="Arial,sans-serif" font-size="14.6667" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="1002" y="511.227">−p V̇</tspan>
</text>
<rect id="o034" x="1098.77" y="369.347" width="108.864" height="120.253" fill="#7FC8F8" stroke="#7FC8F8" stroke-width="1.33333" opacity="0.85"/>
<text id="o035" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="1153.2" y="355.041">0.70</tspan>
</text>
<text id="o036" font-family="Arial,sans-serif" font-size="14.6667" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="1153.2" y="511.227">= (Σmcᵥ) Ṫ</tspan>
</text>
<text id="o037" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="606.72" y="577.187">A fixed-mass polytropic law cannot hold while ṁᵥ,s ≠ 0: the mass terms</tspan>
<tspan x="606.72" y="596.853">change the temperature as well.</tspan>
</text>
<text id="o038" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Thermal closure of Eq. C2-E23; waterfall values are illustrative.</tspan>
</text>
</svg>
