<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 650" role="img"><title>C2-E23 A variable vapor mass makes a fixed-mass polytropic shortcut conditional.</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8EDBD4"/></marker></defs>
<rect width="980" height="650" fill="#142632"/>
<text x="28" y="42.52" font-family="Arial,sans-serif" font-size="19" fill="#8EDBD4">C2-E23 | Physical-variable diagram</text>
<rect x="330" y="160" width="300" height="110" fill="#213E4B" stroke="#B4C7D2" stroke-width="1.9500000000000002"/>
<text x="342" y="189.44" font-family="Arial,sans-serif" font-size="18" fill="#E7F0F3">Bubble energy storage U_b</text>
<line x1="100" y1="210" x2="320" y2="210" fill="none" stroke="#8EDBD4" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="92" y="145.52" font-family="Arial,sans-serif" font-size="19" fill="#E7F0F3">Heat Q̇_b</text>
<line x1="480" y1="100" x2="480" y2="150" fill="none" stroke="#8EDBD4" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="412" y="85.52" font-family="Arial,sans-serif" font-size="19" fill="#E7F0F3">Mass enthalpy entry</text>
<line x1="640" y1="215" x2="860" y2="215" fill="none" stroke="#8EDBD4" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="692" y="165.52" font-family="Arial,sans-serif" font-size="19" fill="#E7F0F3">Work p_b V̇_b</text>
<text x="112" y="354.44" font-family="Arial,sans-serif" font-size="18" fill="#E7F0F3">Conductive heat and transported enthalpy are separate terms.</text>
<text x="32" y="426.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">T_b, Ṫ_b: common vapor temperature</text>
<text x="32" y="450.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">e_s, c_v,s: internal-energy storage</text>
<text x="32" y="474.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">U_b: total stored energy</text>
<text x="32" y="498.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">p_b V̇_b: work</text>
<text x="507" y="426.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">m_v,s, ṁ_v,s: changing species mass</text>
<text x="507" y="450.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">h_v,s: boundary enthalpy</text>
<text x="507" y="474.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">Q̇_b: conduction</text>
<text x="507" y="498.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">s = 1…N_s: summation</text>
<text x="32" y="537.28" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2">The product rule includes both temperature and mass changes</text>
<text x="32" y="561.28" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2">Consistent energy references preserve the balance</text>
</svg>