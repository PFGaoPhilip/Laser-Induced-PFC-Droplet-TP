<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1279.97 720" role="img">
<title>C2-E34</title>
<defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/></marker></defs>
<rect width="1279.97" height="720" fill="#142632"/>
<text id="o000" font-family="Arial,sans-serif" font-size="25.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="30.72" y="35.1733">C2-E34 · Original activation-probability formula</tspan>
</text>
<text id="o001" font-family="Arial,sans-serif" font-size="26.6667" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="638.4" y="119.787">P_act = 1 − exp[ − ∫₀ᵗ ∫ J(T, p) dV dt′ ]    (V = V_d(t′))</tspan>
</text>
<rect id="o002" x="57.6" y="192" width="374.4" height="259.2" rx="20.736" fill="#213E4B" stroke="#F28BA0" stroke-width="2.13333" opacity="1"/>
<text id="o003" font-family="Arial,sans-serif" font-size="22.6667" fill="#F28BA0" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="244.8" y="222.107">J(T, p)</tspan>
</text>
<text id="o004" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="244.8" y="289.733">nucleation rate</tspan>
<tspan x="244.8" y="310.187">m⁻³ s⁻¹</tspan>
</text>
<text id="o005" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="244.8" y="398.493">must be supplied by the material</tspan>
</text>
<text id="o006" font-family="Arial,sans-serif" font-size="26.6667" fill="#B4C7D2" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="444.48" y="311.787">×</tspan>
</text>
<rect id="o007" x="456" y="192" width="374.4" height="259.2" rx="20.736" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o008" font-family="Arial,sans-serif" font-size="22.6667" fill="#8EDBD4" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="643.2" y="222.107">V_d(t′)</tspan>
</text>
<text id="o009" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="643.2" y="289.733">liquid volume that</tspan>
<tspan x="643.2" y="310.187">can nucleate</tspan>
<tspan x="643.2" y="330.64">m³</tspan>
</text>
<text id="o010" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="643.2" y="398.493">shrinks as PFC leaves the liquid</tspan>
</text>
<text id="o011" font-family="Arial,sans-serif" font-size="26.6667" fill="#B4C7D2" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="842.88" y="311.787">×</tspan>
</text>
<rect id="o012" x="854.4" y="192" width="374.4" height="259.2" rx="20.736" fill="#213E4B" stroke="#F2B880" stroke-width="2.13333" opacity="1"/>
<text id="o013" font-family="Arial,sans-serif" font-size="22.6667" fill="#F2B880" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="1041.6" y="222.107">t′ from 0 to t</tspan>
</text>
<text id="o014" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="1041.6" y="289.733">time spent in the</tspan>
<tspan x="1041.6" y="310.187">activating state</tspan>
<tspan x="1041.6" y="330.64">s</tspan>
</text>
<text id="o015" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="1041.6" y="398.493">set by the heating history</tspan>
</text>
<text id="o016" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="59.52" y="500.933">The exponent is the expected number of events. Independent events and a finite integrated rate give a probability between 0 and</tspan>
<tspan x="59.52" y="521.387">1.</tspan>
</text>
<text id="o017" font-family="Arial,sans-serif" font-size="18" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="59.52" y="563.88">The formula organises the problem but does not replace the missing, material-specific J(T, p).</tspan>
</text>
<text id="o018" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Activation probability of Eq. C2-E34 (Poisson model).</tspan>
</text>
</svg>
