<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1279.97 720" role="img">
<title>C2-E20</title>
<defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/></marker></defs>
<rect width="1279.97" height="720" fill="#142632"/>
<text id="o000" font-family="Arial,sans-serif" font-size="25.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="30.72" y="35.1733">C2-E20 · Exact single-component interface mass jump</tspan>
</text>
<rect id="o001" x="38.4" y="96" width="595.2" height="518.4" rx="41.472" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o002" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="51.84" y="118.44">Interface speed is not liquid speed</tspan>
</text>
<rect id="o003" x="67.2" y="211.2" width="249.6" height="297.6" fill="#0C1820" stroke="#B4C7D2" stroke-width="1.33333" opacity="0.9"/>
<rect id="o004" x="316.8" y="211.2" width="259.2" height="297.6" fill="#1E4A5A" stroke="#B4C7D2" stroke-width="1.33333" opacity="1"/>
<line id="o005" x1="316.8" y1="201.6" x2="316.8" y2="518.4" fill="#FFFFFF" stroke="#F2B880" stroke-width="5.33333" opacity="1"/>
<text id="o006" font-family="Arial,sans-serif" font-size="16.6667" fill="#B4C7D2" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="97.92" y="236.387">vapor</tspan>
<tspan x="97.92" y="256.053">(bubble)</tspan>
</text>
<text id="o007" font-family="Arial,sans-serif" font-size="16.6667" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="433.92" y="236.387">liquid</tspan>
</text>
<line id="o008" x1="316.8" y1="307.2" x2="547.2" y2="307.2" fill="#FFFFFF" stroke="#F2B880" stroke-width="5.33333" opacity="1" marker-end="url(#head)"/>
<text id="o009" font-family="Arial,sans-serif" font-size="16" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="328.32" y="274.24">v_Γ = Ṙ  (10 m/s)</tspan>
</text>
<line id="o010" x1="374.4" y1="384" x2="558.72" y2="384" fill="#FFFFFF" stroke="#8EDBD4" stroke-width="5.33333" opacity="1" marker-end="url(#head)"/>
<text id="o011" font-family="Arial,sans-serif" font-size="16" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="328.32" y="408.64">uₗ(R) = 8 m/s</tspan>
</text>
<line id="o012" x1="558.72" y1="384" x2="547.2" y2="384" fill="#FFFFFF" stroke="#F28BA0" stroke-width="1.33333" opacity="1"/>
<line id="o013" x1="501.12" y1="451.2" x2="547.2" y2="451.2" fill="#FFFFFF" stroke="#F28BA0" stroke-width="1.73333" opacity="1"/>
<line id="o014" x1="501.12" y1="444.48" x2="501.12" y2="457.92" fill="#FFFFFF" stroke="#F28BA0" stroke-width="1.73333" opacity="1"/>
<line id="o015" x1="547.2" y1="444.48" x2="547.2" y2="457.92" fill="#FFFFFF" stroke="#F28BA0" stroke-width="1.73333" opacity="1"/>
<text id="o016" font-family="Arial,sans-serif" font-size="14.6667" fill="#F28BA0" text-anchor="middle" opacity="1">
<tspan x="524.16" y="475.547"></tspan>
</text>
<text id="o017" font-family="Arial,sans-serif" font-size="16" fill="#F28BA0" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="289.92" y="480.64">Ṙ − uₗ = 2 m/s</tspan>
</text>
<text id="o018" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="54.72" y="547.84">The interface outruns the adjacent liquid: liquid is converted to</tspan>
<tspan x="54.72" y="566.72">vapor at the surface.</tspan>
</text>
<rect id="o019" x="662.4" y="96" width="580.8" height="518.4" rx="41.472" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o020" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="675.84" y="118.44">Single-component jump condition</tspan>
</text>
<text id="o021" font-family="Arial,sans-serif" font-size="18" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="678.72" y="160.68">jₛ = ρₗ (uₗ − v_Γ)·n = ρᵥ (uᵥ − v_Γ)·n</tspan>
</text>
<text id="o022" font-family="Arial,sans-serif" font-size="16.6667" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="678.72" y="226.787">n = −eᵣ (liquid → vapor),  v_Γ = Ṙ eᵣ</tspan>
</text>
<text id="o023" font-family="Arial,sans-serif" font-size="18.6667" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="678.72" y="290.827">jₛ = ρₗ [Ṙ − uₗ(R)]</tspan>
</text>
<text id="o024" font-family="Arial,sans-serif" font-size="18.6667" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="678.72" y="353.227">uₗ(R) = Ṙ − jₛ / ρₗ</tspan>
</text>
<text id="o025" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="678.72" y="418.787">With no phase change, jₛ = 0 and the liquid at the wall moves</tspan>
<tspan x="678.72" y="438.453">with the wall (uₗ = Ṙ). Evaporation breaks that equality.</tspan>
</text>
<text id="o026" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="678.72" y="528.093">Speeds in the left panel are illustrative.</tspan>
</text>
<text id="o027" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Mass jump of Eq. C2-E20.</tspan>
</text>
</svg>
