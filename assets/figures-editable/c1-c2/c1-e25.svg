</text>
<line id="o019" x1="223.716" y1="326.4" x2="223.716" y2="297.6" fill="#FFFFFF" stroke="#7FC8F8" stroke-width="2.93333" opacity="1"/>
<ellipse id="o020" cx="223.716" cy="326.4" rx="8.64" ry="8.64" fill="#7FC8F8" stroke="#7FC8F8" stroke-width="1.33333" opacity="1"/>
<text id="o021" font-family="Arial,sans-serif" font-size="16" fill="#7FC8F8" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="223.716" y="240.64">acoustic crossing</tspan>
<tspan x="223.716" y="259.52">tₐ = L/c = 0.067 µs</tspan>
</text>
<line id="o022" x1="359.292" y1="326.4" x2="359.292" y2="220.8" fill="#FFFFFF" stroke="#8EDBD4" stroke-width="2.93333" opacity="1"/>
<ellipse id="o023" cx="359.292" cy="326.4" rx="8.64" ry="8.64" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o024" font-family="Arial,sans-serif" font-size="16" fill="#8EDBD4" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="359.292" y="163.84">pulse duration</tspan>
<tspan x="359.292" y="182.72">τ = 0.5 µs</tspan>
</text>
<line id="o025" x1="641.878" y1="326.4" x2="641.878" y2="297.6" fill="#FFFFFF" stroke="#F2B880" stroke-width="2.93333" opacity="1"/>
<ellipse id="o026" cx="641.878" cy="326.4" rx="8.64" ry="8.64" fill="#F2B880" stroke="#F2B880" stroke-width="1.33333" opacity="1"/>
<text id="o027" font-family="Arial,sans-serif" font-size="16" fill="#F2B880" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="641.878" y="240.64">convective time</tspan>
<tspan x="641.878" y="259.52">L/U = 33 µs</tspan>
</text>
<line id="o028" x1="1025.83" y1="326.4" x2="1025.83" y2="220.8" fill="#FFFFFF" stroke="#F28BA0" stroke-width="2.93333" opacity="1"/>
<ellipse id="o029" cx="1025.83" cy="326.4" rx="8.64" ry="8.64" fill="#F28BA0" stroke="#F28BA0" stroke-width="1.33333" opacity="1"/>
<text id="o030" font-family="Arial,sans-serif" font-size="16" fill="#F28BA0" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="1025.83" y="163.84">viscous time</tspan>
<tspan x="1025.83" y="182.72">L²/ν = 10 ms</tspan>
</text>
<text id="o031" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="97.92" y="410.28">Ratios of the declared case</tspan>
</text>
<rect id="o032" x="96" y="432" width="345.6" height="148.8" rx="11.904" fill="#213E4B" stroke="#F2B880" stroke-width="2.13333" opacity="1"/>
<text id="o033" font-family="Arial,sans-serif" font-size="20" fill="#F2B880" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="268.8" y="458">Uτ/L = 0.015</tspan>
</text>
<text id="o034" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="268.8" y="499.84">τ ≪ convective time ✓</tspan>
</text>
<rect id="o035" x="465.6" y="432" width="345.6" height="148.8" rx="11.904" fill="#213E4B" stroke="#F28BA0" stroke-width="2.13333" opacity="1"/>
<text id="o036" font-family="Arial,sans-serif" font-size="20" fill="#F28BA0" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="638.4" y="458">ντ/L² = 5×10⁻⁵</tspan>
</text>
<text id="o037" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="638.4" y="499.84">τ ≪ viscous time ✓</tspan>
</text>
<rect id="o038" x="835.2" y="432" width="345.6" height="148.8" rx="11.904" fill="#213E4B" stroke="#7FC8F8" stroke-width="2.13333" opacity="1"/>
<text id="o039" font-family="Arial,sans-serif" font-size="20" fill="#7FC8F8" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="1008" y="458">τ / tₐ = 7.5</tspan>
</text>
<text id="o040" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="1008" y="499.84">τ is longer than the acoustic</tspan>
<tspan x="1008" y="518.72">crossing, so pressure equalises along</tspan>
<tspan x="1008" y="537.6">the column</tspan>
</text>
<text id="o041" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="49.92" y="625.187">Pressure impulse (Pa·s) and acoustic time (s) are different quantities: one measures the load delivered, the other how fast pressure</tspan>
<tspan x="49.92" y="644.853">communicates.</tspan>
</text>
<text id="o042" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Π₀ = Δpτ = 0.60 MPa × 0.50 µs = 0.30 Pa·s; U = 3.0 m/s; c = 1500 m/s; L = 100 µm; ν = 10⁻⁶ m²/s.</tspan>
</text>
</svg>
