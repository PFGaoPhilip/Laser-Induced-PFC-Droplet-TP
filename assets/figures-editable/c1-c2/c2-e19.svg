<text id="o006" font-family="Arial,sans-serif" font-size="15.3333" fill="#F28BA0" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="472.32" y="499.293">Γₛ: droplet surface</tspan>
<tspan x="472.32" y="517.387">in contact with vapor</tspan>
</text>
<text id="o007" font-family="Arial,sans-serif" font-size="16.6667" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="126.72" y="207.587">PFC droplet</tspan>
</text>
<text id="o008" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="376.32" y="207.587">vapor bubble</tspan>
</text>
<line id="o009" x1="240" y1="355.2" x2="201.6" y2="355.2" fill="#FFFFFF" stroke="#8EDBD4" stroke-width="4" opacity="1" marker-end="url(#head)"/>
<text id="o010" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="54.72" y="548.387">Evaporation occurs on the part of the droplet surface that touches</tspan>
<tspan x="54.72" y="568.053">vapor, Γₛ. It need not coincide with the whole bubble surface.</tspan>
</text>
<rect id="o011" x="681.6" y="96" width="561.6" height="518.4" rx="41.472" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o012" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="695.04" y="118.44">Mass balance of species s</tspan>
</text>
<text id="o013" font-family="Arial,sans-serif" font-size="18.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="697.92" y="161.227">ṁᵥ,s |phase = ∫ over Γₛ of jₛ dA</tspan>
</text>
<text id="o014" font-family="Arial,sans-serif" font-size="16.6667" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="697.92" y="226.787">jₛ: signed liquid-to-vapor mass flux (kg m⁻² s⁻¹)</tspan>
</text>
<rect id="o015" x="696" y="273.6" width="532.8" height="148.8" rx="11.904" fill="#213E4B" stroke="#F2B880" stroke-width="2.13333" opacity="1"/>
<text id="o016" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="712.32" y="297.413">Special case only</tspan>
</text>
<text id="o017" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="712.32" y="337.187">ṁ = 4πR² jₛ   when the whole spherical bubble wall of</tspan>
<tspan x="712.32" y="356.853">radius R is in uniform contact with the PFC.</tspan>
</text>
<text id="o018" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="697.92" y="461.987">Phase change is only one term: escape and dissolution are</tspan>
<tspan x="697.92" y="481.653">accounted for separately in the ledger of Eq. C2-E18.</tspan>
</text>
<text id="o019" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Area integral of Eq. C2-E19; sketch is schematic.</tspan>
</text>
</svg>
