<rect id="o033" x="787.2" y="144" width="456" height="384" rx="30.72" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o034" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="800.64" y="166.44">The barrier does not vanish</tspan>
</text>
<text id="o035" font-family="Arial,sans-serif" font-size="18.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="803.52" y="209.227">W* = 16π σᵥₚ³ / (3 Δpₙ²)</tspan>
</text>
<text id="o036" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="803.52" y="264.64">Derivation: W(r*) = (16 − 32/3) π σ³/Δp² = (16/3)</tspan>
<tspan x="803.52" y="283.52">π σ³/Δp²</tspan>
</text>
<text id="o037" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="824.64" y="341.987">Positive superheat shrinks the barrier but</tspan>
<tspan x="824.64" y="361.653">never removes it.</tspan>
</text>
<ellipse id="o038" cx="809.28" cy="336.733" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o039" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="824.64" y="392.253">Relative to thermal energy k_B T the barrier</tspan>
<tspan x="824.64" y="411.92">is still thousands of units at 10 bar.</tspan>
</text>
<ellipse id="o040" cx="809.28" cy="387" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o041" font-family="Arial,sans-serif" font-size="16.6667" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="97.92" y="617.507">Illustrative σᵥₚ = 0.010 N/m (assumed), T = 323 K. Thermal fluctuations alone rarely cross barriers of many k_B T.</tspan>
</text>
<text id="o042" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Barrier height of Eq. C2-E16, homogeneous locally isothermal small-nucleus model.</tspan>
