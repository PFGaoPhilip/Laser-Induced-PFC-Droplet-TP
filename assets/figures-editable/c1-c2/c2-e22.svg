<tspan x="679.68" y="302.36">1</tspan>
</text>
<line id="o024" x1="684.48" y1="201.6" x2="691.2" y2="201.6" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="1.33333" opacity="1"/>
<line id="o025" x1="691.2" y1="201.6" x2="1228.8" y2="201.6" fill="#FFFFFF" stroke="#2E4756" stroke-width="0.8" opacity="1"/>
<text id="o026" font-family="Arial,sans-serif" font-size="14" fill="#B4C7D2" text-anchor="end" opacity="1">
<tspan x="679.68" y="206.36">1.5</tspan>
</text>
<rect id="o027" x="710.016" y="432" width="96.768" height="57.6" fill="#F28BA0" stroke="#F28BA0" stroke-width="1.33333" opacity="0.85"/>
<text id="o028" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="758.4" y="417.693">0.3</tspan>
</text>
<text id="o029" font-family="Arial,sans-serif" font-size="14.6667" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="758.4" y="511.227">Q̇_b</tspan>
</text>
<rect id="o030" x="844.416" y="220.8" width="96.768" height="211.2" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="0.85"/>
<text id="o031" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="892.8" y="206.493">+1.1</tspan>
</text>
<text id="o032" font-family="Arial,sans-serif" font-size="14.6667" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="892.8" y="511.227">Σ h ṁ</tspan>
</text>
<rect id="o033" x="978.816" y="220.8" width="96.768" height="172.8" fill="#F2B880" stroke="#F2B880" stroke-width="1.33333" opacity="0.85"/>
<text id="o034" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="1027.2" y="206.493">-0.9</tspan>
</text>
<text id="o035" font-family="Arial,sans-serif" font-size="14.6667" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="1027.2" y="511.227">−p_b V̇_b</tspan>
</text>
<rect id="o036" x="1113.22" y="393.6" width="96.768" height="96" fill="#7FC8F8" stroke="#7FC8F8" stroke-width="1.33333" opacity="0.85"/>
<text id="o037" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="1161.6" y="379.293">0.5</tspan>
</text>
<text id="o038" font-family="Arial,sans-serif" font-size="14.6667" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="1161.6" y="511.227">= U̇_b</tspan>
</text>
<text id="o039" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="683.52" y="576.64">U̇_b = Q̇_b − p_b V̇_b + Σ hᵥ,s ṁᵥ,s. Transported enthalpy and</tspan>
<tspan x="683.52" y="595.52">conduction are different terms.</tspan>
</text>
<text id="o040" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">First law of Eq. C2-E22; the numbers in the ledger are illustrative.</tspan>
</text>
</svg>
