<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1279.97 720" role="img">
<title>C2-E22</title>
<defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/></marker></defs>
<rect width="1279.97" height="720" fill="#142632"/>
<text id="o000" font-family="Arial,sans-serif" font-size="25.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="30.72" y="35.1733">C2-E22 · Uniform-state open-bubble first-law model</tspan>
</text>
<rect id="o001" x="38.4" y="96" width="614.4" height="518.4" rx="41.472" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o002" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="51.84" y="118.44">Open bubble as a control volume</tspan>
</text>
<ellipse id="o003" cx="326.4" cy="355.2" rx="115.2" ry="115.2" fill="#0C1820" stroke="#F2B880" stroke-width="3.46667" opacity="1"/>
<text id="o004" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="326.4" y="341.987">U_b</tspan>
<tspan x="326.4" y="361.653">uniform T_b, p_b</tspan>
</text>
<line id="o005" x1="48" y1="355.2" x2="206.4" y2="355.2" fill="#FFFFFF" stroke="#F28BA0" stroke-width="5.33333" opacity="1" marker-end="url(#head)"/>
<text id="o006" font-family="Arial,sans-serif" font-size="16" fill="#F28BA0" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="54.72" y="307.84">heat in Q̇_b</tspan>
<tspan x="54.72" y="326.72">(conduction)</tspan>
</text>
<line id="o007" x1="230.4" y1="163.2" x2="268.8" y2="238.08" fill="#FFFFFF" stroke="#8EDBD4" stroke-width="5.33333" opacity="1" marker-end="url(#head)"/>
<text id="o008" font-family="Arial,sans-serif" font-size="16" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="88.32" y="139.84">vapor in:  Σ hᵥ,s ṁᵥ,s</tspan>
</text>
<line id="o009" x1="418.325" y1="278.065" x2="484.512" y2="222.529" fill="#FFFFFF" stroke="#F2B880" stroke-width="5.33333" opacity="1" marker-end="url(#head)"/>
<text id="o010" font-family="Arial,sans-serif" font-size="16" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="453.12" y="144.64">work out: p_b V̇_b</tspan>
</text>
<text id="o011" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="54.72" y="562.24">V_b = (4π/3)R³, V̇_b = 4πR²Ṙ</tspan>
</text>
<text id="o012" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="683.52" y="117.48">Power ledger (illustrative values, W)</tspan>
</text>
