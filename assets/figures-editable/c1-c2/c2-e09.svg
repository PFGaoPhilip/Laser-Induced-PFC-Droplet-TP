<text id="o058" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="617.507">α = k/(ρcₚ) = 4.69×10⁻⁸ m²/s for the PFC liquid.  Heat travels a distance δ in a time ~ δ²/α, so doubling δ costs four times as</tspan>
<tspan x="97.92" y="637.173">long.</tspan>
</text>
