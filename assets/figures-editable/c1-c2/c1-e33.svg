</text>
<text id="o033" font-family="Arial,sans-serif" font-size="18.6667" fill="#F28BA0" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="913.92" y="118.027">3  Check the limits</tspan>
</text>
<text id="o034" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="935.04" y="168.64">Uτ/L = 0.015 ≪ 1</tspan>
</text>
<ellipse id="o035" cx="919.68" cy="163.52" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o036" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="935.04" y="197.76">ντ/L² = 5×10⁻⁵ ≪ 1</tspan>
</text>
<ellipse id="o037" cx="919.68" cy="192.64" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o038" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="935.04" y="226.88">tₐ = L/c = 0.067 µs: acoustic time,</tspan>
<tspan x="935.04" y="245.76">not the impulse</tspan>
</text>
<ellipse id="o039" cx="919.68" cy="221.76" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<rect id="o040" x="48" y="436.8" width="1180.8" height="148.8" rx="11.904" fill="#213E4B" stroke="#B4C7D2" stroke-width="2.13333" opacity="1"/>
<text id="o041" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="64.32" y="461.16">Reference formulas</tspan>
</text>
<text id="o042" font-family="Arial,sans-serif" font-size="18.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="64.32" y="497.227">Π(x) = ∫(p − p_ref)dt;   Δu ≃ −∇Π/ρ,  ∇²Π = 0</tspan>
<tspan x="64.32" y="519.253">U_column = Π₀/(ρL);   tₐ = L/c</tspan>
</text>
<text id="o043" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="49.92" y="620.933">The impulse benchmark gives the early velocity field; the moving-interface problem that follows is a separate calculation.</tspan>
</text>
<text id="o044" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Summary of Eqs. C1-E20 to C1-E24 for the declared case.</tspan>
</text>
