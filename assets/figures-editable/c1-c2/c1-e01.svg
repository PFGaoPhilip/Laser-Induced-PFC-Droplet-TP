<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 664" role="img"><title>C1-E01 The evolving spherical boundary and the prescribed far-field state.</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8EDBD4"/></marker></defs>
<rect width="980" height="664" fill="#142632"/>
<text x="28" y="42.52" font-family="Arial,sans-serif" font-size="19" fill="#8EDBD4">C1-E01 | Physical-variable diagram</text>
<ellipse cx="270" cy="215" rx="100" ry="100" fill="#213E4B" stroke="#B4C7D2" stroke-width="2.21"/>
<line x1="270" y1="215" x2="370" y2="215" fill="none" stroke="#8EDBD4" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="287" y="197.68" font-family="Arial,sans-serif" font-size="21" fill="#E7F0F3">R(t)</text>
<text x="222" y="251.6" font-family="Arial,sans-serif" font-size="20" fill="#E7F0F3">p_b</text>
<text x="432" y="148.76" font-family="Arial,sans-serif" font-size="22" fill="#E7F0F3">Surrounding liquid</text>
<text x="432" y="183.52" font-family="Arial,sans-serif" font-size="19" fill="#E7F0F3">p∞, ρ, μ; interface: σ</text>
<line x1="270" y1="215" x2="410" y2="310" fill="none" stroke="#8EDBD4" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="442" y="319.44" font-family="Arial,sans-serif" font-size="18" fill="#E7F0F3">r ≥ R</text>
<line x1="410" y1="215" x2="475" y2="215" fill="none" stroke="#8EDBD4" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="417" y="253.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">+e_r (coordinate)</text>
<text x="102" y="364.44" font-family="Arial,sans-serif" font-size="18" fill="#E7F0F3">Signed wall speed: Ṙ; acceleration: R̈</text>
<text x="32" y="426.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">R(t)</text>
<text x="32" y="450.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">Ṙ(0) = U₀</text>
<text x="32" y="474.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">u → 0</text>
<text x="32" y="498.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">t = 0</text>
<text x="507" y="426.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">R₀ &gt; 0</text>
<text x="507" y="450.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">r → ∞</text>
<text x="507" y="474.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">p → p∞</text>
<text x="32" y="537.28" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2">Radial direction points from bubble center into carrier</text>
<text x="32" y="561.28" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2">Far-field pressure is an input, not a laser calculation</text>
</svg>