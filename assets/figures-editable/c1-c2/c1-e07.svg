</text>
<text id="o047" font-family="Arial,sans-serif" font-size="18" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="93.12" y="611.88">One scalar equation for R(t): liquid inertia on the left, driving and resisting pressures on the right.</tspan>
</text>
<text id="o048" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="93.12" y="648.093">Gas pressure here is polytropic, p_b = p_g0 (R₀/R)^{3γ}, γ = 1.4, p_g0 = 1 MPa: an illustration of the closure still to be supplied.</tspan>
</text>
<text id="o049" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Numerical integration of Eq. C1-E07; R₀ = 5 µm, ρ = 1000 kg/m³, p∞ = 101.3 kPa, σ = 0.072 N/m, μ = 1 mPa·s.</tspan>
