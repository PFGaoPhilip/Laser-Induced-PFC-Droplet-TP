<text id="o040" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="49.92" y="611.333">A pulse can need compressibility even when the wall is slow: 𝒞ₑ ≳ 1 means pressure cannot equalise during the rise.</tspan>
</text>
<text id="o041" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
