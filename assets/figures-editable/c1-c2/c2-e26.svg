<text x="752" y="353.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">Vapor volume V_b</text>
<text x="172" y="113.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">PFC partial pressure</text>
<line x1="185" y1="165" x2="420" y2="165" fill="none" stroke="#8EDBD4" stroke-width="2.6"/>
