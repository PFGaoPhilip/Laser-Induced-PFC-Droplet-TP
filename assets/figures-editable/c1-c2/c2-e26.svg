<line x1="590" y1="250" x2="700" y2="278" fill="none" stroke="#8EDBD4" stroke-width="2.6"/>
<line x1="700" y1="278" x2="810" y2="293" fill="none" stroke="#8EDBD4" stroke-width="2.6"/>
<text x="212" y="141.6" font-family="Arial,sans-serif" font-size="20" fill="#E7F0F3">Saturation branch</text>
<text x="502" y="194.44" font-family="Arial,sans-serif" font-size="18" fill="#E7F0F3">Finite-mass branch: p ~ 1/V</text>
<text x="32" y="426.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">m_PFC,0: total available compound</text>
<text x="32" y="450.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">M_PFC, R_u: mole-to-mass conversion</text>
<text x="32" y="474.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">V_b: available vapor volume</text>
<text x="32" y="498.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">p_v,PFC,eq: inventory-limited pressure</text>
<text x="507" y="426.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">m_v,eq: actual equilibrium vapor mass</text>
<text x="507" y="450.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">T_b: prescribed thermal state</text>
<text x="507" y="474.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">p_sat,PFC: coexistence ceiling</text>
<text x="507" y="498.36" font-family="Arial,sans-serif" font-size="17" fill="#E7F0F3">min: choose supply or saturation branch</text>
<text x="32" y="537.28" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2">Small vapor volume can coexist with remaining liquid</text>
<text x="32" y="561.28" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2">A fully vaporized large volume cannot maintain saturation without more PFC</text>
