<title id="title">C4-E07 — The PVC-to-film load follows intermediate-sheet motion and contact.</title>
<desc id="desc">p_liq → PVC; w_P, m_A,P, D_P, T_P — PVC response; t_P→f → contact or bond; w, m_A, D_f, T₀ — film response; t_coh → release interface; No liquid passes through intact PVC.; Transmitted traction is an unknown, not a copied pressure.</desc>
