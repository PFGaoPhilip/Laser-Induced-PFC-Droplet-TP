<title id="title">C2-E23 — A variable vapor mass makes a fixed-mass polytropic shortcut conditional.</title>
<desc id="desc">T_b, Ṫ_b: common vapor temperature; m_v,s, ṁ_v,s: changing species mass; e_s, c_v,s: internal-energy storage; h_v,s: boundary enthalpy; U_b: total stored energy; Q̇_b: conduction; p_b V̇_b: work; s = 1…N_s: summation; The product rule includes both temperature and mass changes; Consistent energy references preserve the balance</desc>
