<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1279.97 720" role="img">
<title>C4-E23</title>
<defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/></marker></defs>
<rect width="1279.97" height="720" fill="#142632"/>
<text id="o000" font-family="Arial,sans-serif" font-size="25.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="30.72" y="35.1733">C4-E23 · Checked teaching substitution</tspan>
</text>
<text id="o001" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="49.92" y="112.68">Teaching calculation, step by step</tspan>
</text>
<rect id="o002" x="48" y="144" width="580.8" height="230.4" rx="18.432" fill="#213E4B" stroke="#7FC8F8" stroke-width="2.13333" opacity="1"/>
<text id="o003" font-family="Arial,sans-serif" font-size="18" fill="#7FC8F8" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="61.44" y="166.44">plate stiffness</tspan>
</text>
<text id="o004" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="64.32" y="208.133">D_f = E_f h_f³ / [12(1 − ν²)]</tspan>
</text>
<text id="o005" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="64.32" y="259.84">E_f = 2.00 GPa, h_f = 10.0 µm, ν = 0.35</tspan>
</text>
<text id="o006" font-family="Arial,sans-serif" font-size="20" fill="#7FC8F8" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="64.32" y="315.92">D_f = 1.899335e-07 N m</tspan>
</text>
<rect id="o007" x="648" y="144" width="580.8" height="230.4" rx="18.432" fill="#213E4B" stroke="#F2B880" stroke-width="2.13333" opacity="1"/>
<text id="o008" font-family="Arial,sans-serif" font-size="18" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="661.44" y="166.44">critical pressure</tspan>
</text>
<text id="o009" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="664.32" y="208.133">p₀,crit = √(128 D_f Γ) / b²</tspan>
</text>
<text id="o010" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="664.32" y="259.84">Γ = 0.10 J/m², b = 100 µm</tspan>
</text>
<text id="o011" font-family="Arial,sans-serif" font-size="20" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="664.32" y="315.92">p₀,crit = 155.921 kPa</tspan>
</text>
<rect id="o012" x="48" y="412.8" width="259.2" height="105.6" rx="8.448" fill="#213E4B" stroke="#B4C7D2" stroke-width="2.13333" opacity="1"/>
<text id="o013" font-family="Arial,sans-serif" font-size="18" fill="#B4C7D2" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="177.6" y="435.24">inputs</tspan>
</text>
<text id="o014" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="177.6" y="462.827">E_f, h_f, ν, Γ, b</tspan>
</text>
<line id="o015" x1="310.08" y1="465.6" x2="352.32" y2="465.6" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="2.93333" opacity="1" marker-end="url(#head)"/>
<rect id="o016" x="355.2" y="412.8" width="259.2" height="105.6" rx="8.448" fill="#213E4B" stroke="#7FC8F8" stroke-width="2.13333" opacity="1"/>
<text id="o017" font-family="Arial,sans-serif" font-size="18" fill="#7FC8F8" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="484.8" y="435.24">D_f</tspan>
</text>
<text id="o018" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="484.8" y="462.827">1.899e-07 N m</tspan>
</text>
<line id="o019" x1="617.28" y1="465.6" x2="659.52" y2="465.6" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="2.93333" opacity="1" marker-end="url(#head)"/>
<rect id="o020" x="662.4" y="412.8" width="259.2" height="105.6" rx="8.448" fill="#213E4B" stroke="#F28BA0" stroke-width="2.13333" opacity="1"/>
<text id="o021" font-family="Arial,sans-serif" font-size="18" fill="#F28BA0" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="792" y="435.24">√(128 D_f Γ)</tspan>
</text>
<text id="o022" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="792" y="462.827">1.5592e-03</tspan>
</text>
<line id="o023" x1="924.48" y1="465.6" x2="966.72" y2="465.6" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="2.93333" opacity="1" marker-end="url(#head)"/>
<rect id="o024" x="969.6" y="412.8" width="259.2" height="105.6" rx="8.448" fill="#213E4B" stroke="#F2B880" stroke-width="2.13333" opacity="1"/>
<text id="o025" font-family="Arial,sans-serif" font-size="18" fill="#F2B880" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="1099.2" y="435.24">÷ b²</tspan>
</text>
<text id="o026" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="1099.2" y="462.827">155.92 kPa</tspan>
</text>
<text id="o027" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="49.92" y="563.333">The 156 kPa threshold is conditional: it holds for this plate, this interface energy and this geometry, with pressure</tspan>
<tspan x="49.92" y="583.787">maintained.</tspan>
</text>
<text id="o028" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="49.92" y="620.387">It is far below the 47 MPa early-contact scale of Chapter 3, but the pulse lasts only nanoseconds.</tspan>
</text>
<text id="o029" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Checked substitution of Eq. C4-E23 (all inputs are declared teaching values).</tspan>
</text>
</svg>
