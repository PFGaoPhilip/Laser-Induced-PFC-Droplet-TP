<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1279.97 720" role="img">
<title>C3-E28</title>
<defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/></marker></defs>
<rect width="1279.97" height="720" fill="#142632"/>
<text id="o000" font-family="Arial,sans-serif" font-size="25.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="30.72" y="35.1733">C3-E28 · Compressible bulk conservation and required constitutive closure</tspan>
</text>
<rect id="o001" x="38.4" y="96" width="1204.8" height="307.2" rx="24.576" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o002" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="51.84" y="118.44">Compressible conservation in a fixed volume</tspan>
</text>
<rect id="o003" x="57.6" y="153.6" width="384" height="230.4" rx="18.432" fill="#213E4B" stroke="#7FC8F8" stroke-width="2.13333" opacity="1"/>
<text id="o004" font-family="Arial,sans-serif" font-size="18.6667" fill="#7FC8F8" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="249.6" y="178.507">Mass</tspan>
</text>
<text id="o005" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="249.6" y="226.787">∂ₜρ + ∇·(ρu) = 0</tspan>
</text>
<text id="o006" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="249.6" y="331.293">what enters equals the change of density</tspan>
</text>
<rect id="o007" x="456" y="153.6" width="384" height="230.4" rx="18.432" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o008" font-family="Arial,sans-serif" font-size="18.6667" fill="#8EDBD4" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="648" y="178.507">Momentum</tspan>
</text>
<text id="o009" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="648" y="226.787">∂ₜ(ρu) + ∇·(ρu⊗u + pI − τ) = 0</tspan>
</text>
<text id="o010" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="648" y="331.293">pressure and viscous traction cross the</tspan>
<tspan x="648" y="349.387">surface</tspan>
</text>
<rect id="o011" x="854.4" y="153.6" width="384" height="230.4" rx="18.432" fill="#213E4B" stroke="#F2B880" stroke-width="2.13333" opacity="1"/>
<text id="o012" font-family="Arial,sans-serif" font-size="18.6667" fill="#F2B880" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="1046.4" y="178.507">Total energy</tspan>
</text>
<text id="o013" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="1046.4" y="226.787">∂ₜ(ρeₜ) + ∇·[(ρeₜ + p)u − τ·u + q] =</tspan>
<tspan x="1046.4" y="246.453">Q_abs</tspan>
</text>
<text id="o014" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="1046.4" y="331.293">pressure work, viscous work, heat, optical</tspan>
<tspan x="1046.4" y="349.387">source</tspan>
</text>
<rect id="o015" x="38.4" y="427.2" width="585.6" height="177.6" rx="14.208" fill="#213E4B" stroke="#F28BA0" stroke-width="2.13333" opacity="1"/>
<text id="o016" font-family="Arial,sans-serif" font-size="17.3333" fill="#F28BA0" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="51.84" y="449.093">Closure still required</tspan>
</text>
<text id="o017" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="54.72" y="486.533">p = 𝒫(ρ, e, {Yₖ}),   eₜ = e + |u|²/2</tspan>
</text>
<text id="o018" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="54.72" y="538.24">An equation of state, species fractions and interface jump</tspan>
<tspan x="54.72" y="557.12">conditions complete the system.</tspan>
</text>
<rect id="o019" x="643.2" y="427.2" width="600" height="177.6" rx="14.208" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o020" font-family="Arial,sans-serif" font-size="17.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="656.64" y="449.093">Why it matters at impact</tspan>
</text>
<text id="o021" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="659.52" y="485.44">Strong compression is not captured by the incompressible potential</tspan>
<tspan x="659.52" y="504.32">model. Optical heating Q_abs is counted once, and the solid</tspan>
<tspan x="659.52" y="523.2">response needs its own law.</tspan>
</text>
<text id="o022" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Compressible bulk conservation of Eq. C3-E28; schematic.</tspan>
</text>
</svg>
