<tspan x="782.88" y="193.216">𝓔_A = J_A² / (2m_A)</tspan>
</text>
<text id="o060" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="600.64">Speed grows linearly with impulse, energy quadratically. Here m_A = ρ_f h_f = 23.3 g/m² (ρ_f = 2330 kg/m³, h_f = 10 µm).</tspan>
</text>
<text id="o061" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="97.92" y="649.187">Valid for a pulse much shorter than the plate response times (next figure); this energy may later feed deformation and fracture.</tspan>
</text>
<text id="o062" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Short-pulse free response of Eq. C4-E09.</tspan>
