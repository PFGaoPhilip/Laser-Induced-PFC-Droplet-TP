<text id="o026" font-family="Arial,sans-serif" font-size="14.6667" fill="#8EDBD4" text-anchor="start" opacity="1">
<tspan x="133.102" y="179.547">κ(z) of Eq. C3-E20 for a = a₀(1 + 0.12 cos kz), k a₀ = 0.7</tspan>
</text>
<text id="o027" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="417.289" y="460.893">dashed: 1/a alone</tspan>
</text>
<text id="o028" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="97.92" y="122.28">Curvature varies along the jet and drives the flow</tspan>
</text>
<rect id="o029" x="710.4" y="96" width="532.8" height="225.6" rx="18.048" fill="#213E4B" stroke="#F2B880" stroke-width="2.13333" opacity="1"/>
<text id="o030" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="723.84" y="117.893">Why the factor is three</tspan>
</text>
<text id="o031" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="726.72" y="159.04">uᵣ = −(r/2) ∂_z v,   τ_zz = 2μ ∂_z v,   τᵣᵣ = −μ ∂_z v</tspan>
</text>
<text id="o032" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="726.72" y="217.187">τ_zz − τᵣᵣ = 3μ ∂_z v:  extensional stress is three times</tspan>
<tspan x="726.72" y="236.853">the shear-viscosity scale.</tspan>
</text>
<text id="o033" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="721.92" y="357.76">simple shear: μ</tspan>
</text>
<rect id="o034" x="950.4" y="340.8" width="49.5" height="38.4" fill="#7FC8F8" stroke="#7FC8F8" stroke-width="1.33333" opacity="0.85"/>
<text id="o035" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="1009.5" y="360.64">1μ</tspan>
</text>
<text id="o036" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="721.92" y="415.36">stretching: 3μ</tspan>
</text>
<rect id="o037" x="950.4" y="398.4" width="148.5" height="38.4" fill="#F2B880" stroke="#F2B880" stroke-width="1.33333" opacity="0.85"/>
<text id="o038" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="1108.5" y="418.24">3μ</tspan>
</text>
<text id="o039" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="721.92" y="485.44">∂ₜv + v∂_z v = −(σⱼ/ρ) ∂_z κ + [3μ/(ρA)] ∂_z(A ∂_z v)</tspan>
</text>
<text id="o040" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="591.04">Where the jet is thinner (a &lt; a₀ with k a₀ &lt; 1) κ is larger, so</tspan>
<tspan x="97.92" y="609.92">pressure pushes liquid toward the thicker parts.</tspan>
</text>
<text id="o041" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="721.92" y="547.293">The slender axial momentum law keeps the full geometric</tspan>
<tspan x="721.92" y="565.387">curvature.</tspan>
</text>
<text id="o042" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Newtonian stress and slender momentum of Eq. C3-E20.</tspan>
</text>
</svg>
