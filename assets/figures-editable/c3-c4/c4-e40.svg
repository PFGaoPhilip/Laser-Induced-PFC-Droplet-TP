<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1279.97 720" role="img">
<title>C4-E40</title>
<defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/></marker></defs>
<rect width="1279.97" height="720" fill="#142632"/>
<text id="o000" font-family="Arial,sans-serif" font-size="25.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="30.72" y="35.1733">C4-E40 · Explicit integration-by-parts boundary terms</tspan>
</text>
<text id="o001" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="49.92" y="112.68">Integrating by parts twice moves derivatives from δw onto the moment tensor</tspan>
</text>
<rect id="o002" x="48" y="148.8" width="1180.8" height="100.8" rx="8.064" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o003" font-family="Arial,sans-serif" font-size="17.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="64.32" y="172.613">Start</tspan>
</text>
<text id="o004" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="174.72" y="173.44">δU_b = ∫ B_αβ ∂α∂β(δw) dA</tspan>
</text>
<text id="o005" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="923.52" y="172.893">derivatives sit on δw</tspan>
</text>
<rect id="o006" x="48" y="264" width="1180.8" height="100.8" rx="8.064" fill="#213E4B" stroke="#F2B880" stroke-width="2.13333" opacity="1"/>
<text id="o007" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="64.32" y="287.813">Once</tspan>
</text>
<text id="o008" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="174.72" y="288.64">= ∮ n_α B_αβ ∂β(δw) dℓ − ∫ (∂α B_αβ) ∂β(δw) dA</tspan>
</text>
<text id="o009" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="923.52" y="288.093">edge moment term appears</tspan>
</text>
<rect id="o010" x="48" y="379.2" width="1180.8" height="100.8" rx="8.064" fill="#213E4B" stroke="#F28BA0" stroke-width="2.13333" opacity="1"/>
<text id="o011" font-family="Arial,sans-serif" font-size="17.3333" fill="#F28BA0" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="64.32" y="403.013">Twice</tspan>
</text>
<text id="o012" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="174.72" y="403.84">= ∮ n_α B_αβ ∂β δw dℓ − ∮ nᵦ ∂αB_αβ δw dℓ + ∫ (∂α∂β B_αβ) δw dA</tspan>
</text>
<text id="o013" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="923.52" y="403.293">edge shear term appears</tspan>
</text>
<rect id="o014" x="48" y="499.2" width="576" height="110.4" rx="8.832" fill="#213E4B" stroke="#F2B880" stroke-width="2.13333" opacity="1"/>
<text id="o015" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="61.44" y="521.093">B_αβ</tspan>
</text>
<text id="o016" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="64.32" y="552.64">B_αβ = D_f[(1−ν_f) w_αβ + ν_f δ_αβ ∇²w]</tspan>
</text>
<rect id="o017" x="652.8" y="499.2" width="576" height="110.4" rx="8.832" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o018" font-family="Arial,sans-serif" font-size="17.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="666.24" y="521.093">Fixed clamp</tspan>
</text>
<text id="o019" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="669.12" y="552.64">w = 0 and ∂ₙw = 0 on the edge ⇒ both boundary terms vanish</tspan>
</text>
<text id="o020" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Boundary terms of Eq. C4-E40 (the term order follows the equation).</tspan>
</text>
</svg>
