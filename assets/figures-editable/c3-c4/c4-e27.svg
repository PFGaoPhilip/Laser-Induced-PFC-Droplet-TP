<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1279.97 720" role="img">
<title>C4-E27</title>
<defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/></marker></defs>
<rect width="1279.97" height="720" fill="#142632"/>
<text id="o000" font-family="Arial,sans-serif" font-size="25.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="30.72" y="35.1733">C4-E27 · Cohesive admissibility teaching calculation</tspan>
</text>
<text id="o001" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="49.92" y="112.68">Cohesive admissibility check with the teaching numbers</tspan>
</text>
<rect id="o002" x="48" y="144" width="379.2" height="201.6" rx="16.128" fill="#213E4B" stroke="#B4C7D2" stroke-width="2.13333" opacity="1"/>
<text id="o003" font-family="Arial,sans-serif" font-size="17.3333" fill="#B4C7D2" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="61.44" y="165.893">given</tspan>
</text>
<text id="o004" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="240" y="217.187">Γ = 0.005 J/m²</tspan>
<tspan x="240" y="236.853">Tₘₐₓ = 0.10 MPa</tspan>
<tspan x="240" y="256.52">Kₙ = 10¹³ Pa/m</tspan>
</text>
<rect id="o005" x="446.4" y="144" width="379.2" height="201.6" rx="16.128" fill="#213E4B" stroke="#7FC8F8" stroke-width="2.13333" opacity="1"/>
<text id="o006" font-family="Arial,sans-serif" font-size="17.3333" fill="#7FC8F8" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="459.84" y="165.893">δ₀ = Tₘₐₓ / Kₙ</tspan>
</text>
<text id="o007" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="638.4" y="217.187">10⁵ / 10¹³ = 1.0×10⁻⁸ m = 10 nm</tspan>
</text>
<rect id="o008" x="844.8" y="144" width="379.2" height="201.6" rx="16.128" fill="#213E4B" stroke="#F28BA0" stroke-width="2.13333" opacity="1"/>
<text id="o009" font-family="Arial,sans-serif" font-size="17.3333" fill="#F28BA0" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="858.24" y="165.893">δ_c = 2Γ / Tₘₐₓ</tspan>
</text>
<text id="o010" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="1036.8" y="217.187">2(0.005) / 10⁵ = 1.0×10⁻⁷ m = 100 nm</tspan>
</text>
<text id="o011" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="49.92" y="401.507">δ₀  (peak)</tspan>
</text>
<rect id="o012" x="259.2" y="384" width="69.6" height="43.2" fill="#F2B880" stroke="#F2B880" stroke-width="1.33333" opacity="0.85"/>
<text id="o013" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="338.4" y="404.387">10 nm</tspan>
</text>
<text id="o014" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="49.92" y="468.707">δ_c  (final)</tspan>
</text>
<rect id="o015" x="259.2" y="451.2" width="696" height="43.2" fill="#F28BA0" stroke="#F28BA0" stroke-width="1.33333" opacity="0.85"/>
<text id="o016" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="964.8" y="471.587">100 nm</tspan>
</text>
<text id="o017" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="49.92" y="534.533">δ_c is ten times δ₀: the law has a distinct softening stage, so it is admissible (δ₀ &lt; δ_c).</tspan>
</text>
<text id="o018" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="49.92" y="591.04">These are stipulated teaching values, not measured properties of a real interface.</tspan>
</text>
<text id="o019" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Admissibility calculation of Eq. C4-E27.</tspan>
</text>
</svg>
