<text id="o040" font-family="Arial,sans-serif" font-size="17.3333" fill="#8EDBD4" text-anchor="start" opacity="1">
<tspan x="175.68" y="204.019">w</tspan>
</text>
<text id="o041" font-family="Arial,sans-serif" font-size="15.3333" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="415.104" y="379.122">w′ = p₀r(r²−b²)</tspan>
<tspan x="415.104" y="397.215">/(16D_f)</tspan>
</text>
<rect id="o042" x="720" y="144" width="523.2" height="374.4" rx="29.952" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o043" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="733.44" y="166.44">Direct verification</tspan>
</text>
<text id="o044" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="736.32" y="207.587">𝓛ᵣ(r²) = 4,   𝓛ᵣ(r⁴) = 16 r²</tspan>
</text>
<text id="o045" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="736.32" y="259.293">𝓛ᵣ w ∝ −8 + 16 r²,  𝓛ᵣ²w ∝ 64  ⇒  D_f 𝓛ᵣ²w = p₀</tspan>
</text>
<text id="o046" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="736.32" y="313.187">w′(r) = p₀ r (r² − b²) / (16D_f)</tspan>
</text>
<text id="o047" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="736.32" y="379.84">Slope zero at r = 0 and r = b; steepest between.</tspan>
</text>
<text id="o048" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="591.587">Differentiating the answer back reproduces the governing equation, so the solution is verified, not assumed.</tspan>
</text>
<text id="o049" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Verification of Eq. C4-E17.</tspan>
</text>
</svg>
