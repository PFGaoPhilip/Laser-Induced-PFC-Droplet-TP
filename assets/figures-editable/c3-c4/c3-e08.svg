<text id="o036" font-family="Arial,sans-serif" font-size="15.3333" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="802.8" y="165.393">(3 + 4SR)/[R(1 + SR)], χ = 1</tspan>
</text>
<text id="o037" font-family="Arial,sans-serif" font-size="16" fill="#8EDBD4" text-anchor="start" opacity="1">
<tspan x="1006.32" y="378.76">3/R</tspan>
</text>
<text id="o038" font-family="Arial,sans-serif" font-size="16" fill="#F28BA0" text-anchor="start" opacity="1">
<tspan x="961.8" y="488.74">S/(1 + SR)</tspan>
</text>
<rect id="o039" x="38.4" y="96" width="633.6" height="508.8" rx="40.704" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o040" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="51.84" y="118.44">Rebuilding the integrating factor</tspan>
</text>
<text id="o041" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="59.52" y="159.587">1  y = Ṙ²,  dy/dR = 2R̈</tspan>
</text>
<text id="o042" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="83.52" y="190.72">turns the radial equation into a first-order ODE for y(R)</tspan>
</text>
<text id="o043" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="59.52" y="244.387">2  y′ + [(3 + 4SR)/(R(1 + SR))] y = −2Δp_c / [ρR(1 + SR)]</tspan>
</text>
<text id="o044" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="83.52" y="291.84">linear first order</tspan>
</text>
<text id="o045" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="59.52" y="345.507">3  (3 + 4SR)/(R(1 + SR)) = 3/R + S/(1 + SR)</tspan>
</text>
<text id="o046" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="83.52" y="376.64">partial fractions: both pieces are logarithmic derivatives</tspan>
</text>
<text id="o047" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="59.52" y="430.307">4  integrating factor R³(1 + SR)</tspan>
</text>
<text id="o048" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="83.52" y="461.44">then d/dR [R³(1 + SR) y] = −(2Δp_c/ρ) R²</tspan>
</text>
<text id="o049" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="702.72" y="615.04">The two dashed pieces add to the solid curve (partial</tspan>
<tspan x="702.72" y="633.92">fractions).</tspan>
</text>
<text id="o050" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Integrating factor of Eq. C3-E08.</tspan>
</text>
</svg>
