<text id="o033" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="412.8" y="572.8">interaction strength χ = S Rₘₐₓ</tspan>
</text>
<text id="o034" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="40.32" y="122.56">C(χ) = t_c / [Rₘₐₓ √(ρ/Δp_c)]</tspan>
</text>
<polyline id="o035" points="96,496.545 112.246,481.346 128.492,467.01 144.738,453.402 160.985,440.418 177.231,427.979 193.477,416.019 209.723,404.487 225.969,393.34 242.215,382.54 258.462,372.057 274.708,361.863 290.954,351.937 307.2,342.258 323.446,332.808 339.692,323.571 355.938,314.533 372.185,305.683 388.431,297.009 404.677,288.5 420.923,280.147 437.169,271.943 453.415,263.879 469.662,255.948 485.908,248.145 502.154,240.462 518.4,232.895 534.646,225.438 550.892,218.087 567.138,210.838 583.385,203.685 599.631,196.626 615.877,189.657 632.123,182.774 648.369,175.975 664.615,169.256 680.862,162.614 697.108,156.048 713.354,149.554" fill="none" stroke="#8EDBD4" stroke-width="4" opacity="1"/>
<ellipse id="o036" cx="96" cy="496.545" rx="7.68" ry="7.68" fill="#F2B880" stroke="#F2B880" stroke-width="1.33333" opacity="1"/>
<text id="o037" font-family="Arial,sans-serif" font-size="16" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="112.32" y="468.385">C(0) = 0.9147: isolated</tspan>
</text>
<ellipse id="o038" cx="201.6" cy="410.203" rx="7.68" ry="7.68" fill="#F28BA0" stroke="#F28BA0" stroke-width="1.33333" opacity="1"/>
<text id="o039" font-family="Arial,sans-serif" font-size="16" fill="#F28BA0" text-anchor="start" opacity="1">
<tspan x="215.04" y="382.043">χ = 1: 1.229</tspan>
</text>
<ellipse id="o040" cx="412.8" cy="284.304" rx="7.68" ry="7.68" fill="#7FC8F8" stroke="#7FC8F8" stroke-width="1.33333" opacity="1"/>
<text id="o041" font-family="Arial,sans-serif" font-size="16" fill="#7FC8F8" text-anchor="start" opacity="1">
<tspan x="426.24" y="256.144">χ = 3: 1.688</tspan>
</text>
<rect id="o042" x="758.4" y="144" width="484.8" height="384" rx="30.72" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o043" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="771.84" y="166.44">Interaction delays the collapse</tspan>
</text>
<text id="o044" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="774.72" y="207.04">C(χ) = √(3/2) ∫₀¹ √[ x³(1 + χx) / (1 − x³) ] dx</tspan>
</text>
<text id="o045" font-family="Arial,sans-serif" font-size="15.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="774.72" y="283.293">C′(χ) = ½√(3/2) ∫₀¹ x^(5/2) / √[(1 − x³)(1 + χx)] dx &gt; 0</tspan>
</text>
<text id="o046" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="795.84" y="351.04">The integrand of C′ is positive, so C always rises</tspan>
<tspan x="795.84" y="369.92">with χ.</tspan>
</text>
<ellipse id="o047" cx="780.48" cy="345.92" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o048" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="795.84" y="399.68">At χ = 3 the formal collapse time is 1.85 times the</tspan>
<tspan x="795.84" y="418.56">isolated one.</tspan>
</text>
<ellipse id="o049" cx="780.48" cy="394.56" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o050" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="617.507">Time to collapse t_c = Rₘₐₓ √(ρ/Δp_c) C(χ): shared liquid inertia makes every bubble slower, never faster.</tspan>
</text>
<text id="o051" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Collapse-time quadrature and sign check of Eq. C3-E10.</tspan>
</text>
