<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1279.97 720" role="img">
<title>C4-E13</title>
<defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/></marker></defs>
<rect width="1279.97" height="720" fill="#142632"/>
<text id="o000" font-family="Arial,sans-serif" font-size="25.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="30.72" y="35.1733">C4-E13 · Quasistatic plate boundary-value model</tspan>
</text>
<rect id="o001" x="38.4" y="96" width="662.4" height="508.8" rx="40.704" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o002" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="51.84" y="118.44">Clamped circular delamination under p₀</tspan>
</text>
<ellipse id="o003" cx="369.6" cy="312" rx="211.2" ry="96" fill="#1E4A5A" stroke="#8EDBD4" stroke-width="2.93333" opacity="1"/>
<line id="o004" x1="158.4" y1="312" x2="580.8" y2="312" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="1.6" opacity="1" stroke-dasharray="6 4"/>
<line id="o005" x1="369.6" y1="432" x2="580.8" y2="432" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="1.73333" opacity="1"/>
<line id="o006" x1="369.6" y1="425.28" x2="369.6" y2="438.72" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="1.73333" opacity="1"/>
<line id="o007" x1="580.8" y1="425.28" x2="580.8" y2="438.72" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="1.73333" opacity="1"/>
<text id="o008" font-family="Arial,sans-serif" font-size="16.6667" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="475.2" y="456.787">b</tspan>
</text>
<line id="o009" x1="254.4" y1="172.8" x2="254.4" y2="225.6" fill="#FFFFFF" stroke="#F28BA0" stroke-width="4" opacity="1" marker-end="url(#head)"/>
<line id="o010" x1="369.6" y1="172.8" x2="369.6" y2="225.6" fill="#FFFFFF" stroke="#F28BA0" stroke-width="4" opacity="1" marker-end="url(#head)"/>
<line id="o011" x1="484.8" y1="172.8" x2="484.8" y2="225.6" fill="#FFFFFF" stroke="#F28BA0" stroke-width="4" opacity="1" marker-end="url(#head)"/>
<text id="o012" font-family="Arial,sans-serif" font-size="16" fill="#F28BA0" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="369.6" y="149.44">uniform pressure p₀</tspan>
</text>
<text id="o013" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="59.52" y="485.987">𝓛ᵣ g = p₀ / D_f,   g = 𝓛ᵣ w,   𝓛ᵣ f = (1/r) d/dr (r df/dr)</tspan>
</text>
<text id="o014" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="59.52" y="533.987">w(b) = 0,  w′(b) = 0 (clamped edge);  fields regular at r = 0</tspan>
</text>
<rect id="o015" x="720" y="96" width="523.2" height="508.8" rx="40.704" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o016" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="733.44" y="118.44">Reading the boundary-value problem</tspan>
</text>
<text id="o017" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="757.44" y="169.187">Axisymmetry: only r matters, the Laplacian 𝓛ᵣ replaces</tspan>
<tspan x="757.44" y="188.853">∇².</tspan>
</text>
<ellipse id="o018" cx="742.08" cy="163.933" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o019" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="757.44" y="219.453">The biharmonic equation D_f ∇⁴w = p₀ becomes two</tspan>
<tspan x="757.44" y="239.12">nested 𝓛ᵣ equations.</tspan>
</text>
<ellipse id="o020" cx="742.08" cy="214.2" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o021" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="757.44" y="269.72">Four constants must be fixed: two by regularity, two</tspan>
<tspan x="757.44" y="289.387">by the clamp.</tspan>
</text>
<ellipse id="o022" cx="742.08" cy="264.467" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o023" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="757.44" y="319.987">Quasistatic: no inertia, so p₀ is applied slowly</tspan>
<tspan x="757.44" y="339.653">(maintained pressure).</tspan>
</text>
<ellipse id="o024" cx="742.08" cy="314.733" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o025" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="736.32" y="456.64">Teaching film: h_f = 10 µm, E_f = 2 GPa, ν = 0.35: D_f =</tspan>
<tspan x="736.32" y="475.52">1.899e-07 N m; b = 100 µm.</tspan>
</text>
<text id="o026" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Quasistatic circular-plate boundary-value problem of Eq. C4-E13.</tspan>
</text>
</svg>
