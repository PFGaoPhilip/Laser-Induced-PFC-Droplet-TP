<tspan x="185.827" y="423.12">3.93 ng, 31.9 m/s: the declared jet</tspan>
</text>
<text id="o036" font-family="Arial,sans-serif" font-size="16" fill="#F28BA0" text-anchor="start" opacity="1">
<tspan x="123.111" y="205.176">fixed impulse J: U = J/m</tspan>
</text>
<text id="o037" font-family="Arial,sans-serif" font-size="16" fill="#8EDBD4" text-anchor="start" opacity="1">
<tspan x="238.748" y="328.376">fixed energy E: U = √(2E/m)</tspan>
</text>
<rect id="o038" x="739.2" y="144" width="504" height="384" rx="30.72" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o039" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="752.64" y="166.44">Two different budgets</tspan>
</text>
<text id="o040" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="755.52" y="207.587">Π(z) = Π₀(1 − z/L),  U = Π₀/(ρL)</tspan>
<tspan x="755.52" y="227.253">m = ρAL,  J = Π₀A = mU</tspan>
</text>
<text id="o041" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="755.52" y="293.987">J = 1.253e-10 N s,   E = 2.00 nJ</tspan>
</text>
<text id="o042" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="776.64" y="346.24">Quarter the mass at fixed J: speed ×4, energy ×4.</tspan>
</text>
<ellipse id="o043" cx="761.28" cy="341.12" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o044" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="776.64" y="375.36">Quarter the mass at fixed E: speed ×2, momentum ÷2.</tspan>
</text>
<ellipse id="o045" cx="761.28" cy="370.24" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o046" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="776.64" y="404.48">The pressure-impulse field and the total energy must</tspan>
<tspan x="776.64" y="423.36">both be satisfied.</tspan>
</text>
<ellipse id="o047" cx="761.28" cy="399.36" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o048" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="617.507">Focusing a given source into a lighter jet buys speed only at a price set by which quantity is conserved.</tspan>
</text>
<text id="o049" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Pressure-impulse column and focusing budgets of Eq. C3-E16 (m = 3.927 ng, E = 2 nJ).</tspan>
</text>
</svg>
