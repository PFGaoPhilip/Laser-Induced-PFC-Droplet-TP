</text>
<rect id="o039" x="739.2" y="144" width="504" height="384" rx="30.72" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o040" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="752.64" y="166.44">Necessary, not sufficient</tspan>
</text>
<text id="o041" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="755.52" y="208.133">E_req(v_f) = Γ A_f + ½ m_f v_f²</tspan>
</text>
<text id="o042" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="755.52" y="256.133">I_req(v_f) = m_f v_f</tspan>
</text>
<text id="o043" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="755.52" y="313.187">pass:  E_solid ≥ E_req  and  Iₙₑₜ ≥ I_req</tspan>
</text>
<text id="o044" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="755.52" y="379.84">The whole release area A_f, not a pressure peak, sets</tspan>
<tspan x="755.52" y="398.72">the fracture energy cost.</tspan>
</text>
<text id="o045" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="617.507">Energy to open the interface (Γ A_f) plus energy to move the released film (½ m_f v_f²).</tspan>
</text>
<text id="o046" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Global screens of Eq. C4-E30 (A_f = 1 mm², m_f = 2.33 µg).</tspan>
</text>
