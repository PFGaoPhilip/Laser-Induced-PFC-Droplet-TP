<ellipse id="o032" cx="446.016" cy="400" rx="7.68" ry="7.68" fill="#F2B880" stroke="#F2B880" stroke-width="1.33333" opacity="1"/>
<text id="o033" font-family="Arial,sans-serif" font-size="16" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="459.456" y="439.04">uniform jet: on the boundary</tspan>
</text>
<ellipse id="o034" cx="341.012" cy="400" rx="7.68" ry="7.68" fill="#F28BA0" stroke="#F28BA0" stroke-width="1.33333" opacity="1"/>
<text id="o035" font-family="Arial,sans-serif" font-size="15.3333" fill="#F28BA0" text-anchor="start" opacity="1">
<tspan x="117.332" y="361.693">spread of velocities:</tspan>
<tspan x="117.332" y="379.787">same E, less P</tspan>
</text>
<text id="o036" font-family="Arial,sans-serif" font-size="16.6667" fill="#8EDBD4" text-anchor="start" opacity="1">
<tspan x="167.04" y="188.387">allowed: E ≥ P²/2m</tspan>
</text>
<text id="o037" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="496.582" y="501.44">forbidden</tspan>
</text>
<rect id="o038" x="739.2" y="144" width="504" height="384" rx="30.72" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o039" font-family="Arial,sans-serif" font-size="17.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="752.64" y="165.893">Cauchy–Schwarz on the jet liquid</tspan>
</text>
<text id="o040" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="755.52" y="207.587">Aⱼ = πdⱼ²/4,  mⱼ = ρA_jLⱼ</tspan>
</text>
<text id="o041" font-family="Arial,sans-serif" font-size="16" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="755.52" y="255.04">mⱼ = 1000 × π(10 µm)²/4 × 50 µm = 3.927 ng</tspan>
</text>
<text id="o042" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="755.52" y="313.187">|Pⱼ|² ≤ (∫dm)(∫u_z² dm) ≤ 2 mⱼ Eⱼ</tspan>
</text>
<text id="o043" font-family="Arial,sans-serif" font-size="16.6667" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="755.52" y="370.787">Uᵣₘₛ ≤ √(2Eₐᵥₐᵢₗ / mⱼ)</tspan>
</text>
<text id="o044" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="755.52" y="427.84">Finite mass turns an energy budget into a bound on both</tspan>
<tspan x="755.52" y="446.72">speed and momentum.</tspan>
</text>
<text id="o045" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="617.507">The jet carries at most P = √(2 m E) of useful momentum; a non-uniform velocity spends energy without adding momentum.</tspan>
</text>
<text id="o046" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Finite-mass definitions and bound of Eq. C3-E18.</tspan>
</text>
</svg>
