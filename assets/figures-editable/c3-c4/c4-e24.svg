<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1279.97 720" role="img">
<title>C4-E24</title>
<defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/></marker></defs>
<rect width="1279.97" height="720" fill="#142632"/>
<text id="o000" font-family="Arial,sans-serif" font-size="25.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="30.72" y="35.1733">C4-E24 · Magnitude, geometric-validity and competing-failure checks</tspan>
</text>
<text id="o001" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="49.92" y="112.68">Three checks on the 156 kPa threshold</tspan>
</text>
<rect id="o002" x="48" y="144" width="384" height="364.8" rx="29.184" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o003" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="61.44" y="166.44">Deflection</tspan>
</text>
<polyline id="o004" points="76.8,345.6 82.3322,345.088 87.8644,343.623 93.3966,341.307 98.9288,338.238 104.461,334.511 109.993,330.218 115.525,325.446 121.058,320.279 126.59,314.797 132.122,309.078 137.654,303.194 143.186,297.214 148.719,291.204 154.251,285.227 159.783,279.34 165.315,273.599 170.847,268.054 176.38,262.753 181.912,257.74 187.444,253.055 192.976,248.734 198.508,244.811 204.041,241.314 209.573,238.27 215.105,235.699 220.637,233.62 226.169,232.049 231.702,230.995 237.234,230.466 242.766,230.466 248.298,230.995 253.831,232.049 259.363,233.62 264.895,235.699 270.427,238.27 275.959,241.314 281.492,244.811 287.024,248.734 292.556,253.055 298.088,257.74 303.62,262.753 309.153,268.054 314.685,273.599 320.217,279.34 325.749,285.227 331.281,291.204 336.814,297.214 342.346,303.194 347.878,309.078 353.41,314.797 358.942,320.279 364.475,325.446 370.007,330.218 375.539,334.511 381.071,338.238 386.603,341.307 392.136,343.623 397.668,345.088 403.2,345.6" fill="none" stroke="#8EDBD4" stroke-width="4" opacity="1"/>
<text id="o005" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="240" y="371.333">w(0) = 1.2827 µm</tspan>
</text>
<text id="o006" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="240" y="419.333">w(0)/h_f = 0.12827</tspan>
</text>
<text id="o007" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="240" y="465.693">small-deflection theory needs w ≪ h_f</tspan>
</text>
<rect id="o008" x="451.2" y="144" width="384" height="364.8" rx="29.184" fill="#213E4B" stroke="#F2B880" stroke-width="2.13333" opacity="1"/>
<text id="o009" font-family="Arial,sans-serif" font-size="18" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="464.64" y="166.44">Blister volume</tspan>
</text>
<text id="o010" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="643.2" y="227.333">V_bl = 1.34324e-14 m³</tspan>
</text>
<text id="o011" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="643.2" y="293.44">= 13.4 pL (about 13 400 µm³)</tspan>
</text>
<text id="o012" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="643.2" y="369.693">the liquid volume needed to inflate the</tspan>
<tspan x="643.2" y="387.787">blister</tspan>
</text>
<rect id="o013" x="854.4" y="144" width="388.8" height="364.8" rx="29.184" fill="#213E4B" stroke="#F28BA0" stroke-width="2.13333" opacity="1"/>
<text id="o014" font-family="Arial,sans-serif" font-size="18" fill="#F28BA0" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="867.84" y="166.44">Edge bending stress</tspan>
</text>
<text id="o015" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="1051.2" y="207.587">|Mᵣ(b)| = p₀,crit b² / 8</tspan>
</text>
<text id="o016" font-family="Arial,sans-serif" font-size="16" fill="#F2B880" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="1051.2" y="274.24">|σᵣᵣ|_edge = 6|Mᵣ|/h_f² = 11.6941 MPa</tspan>
</text>
<text id="o017" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="1051.2" y="360.093">a tensile stress at the clamp: compare with</tspan>
<tspan x="1051.2" y="378.187">the payload strength</tspan>
</text>
<text id="o018" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="49.92" y="562.787">Deflection is only 12.8 % of the thickness, so linear theory holds; edge bending stress of 11.7 MPa must still be checked against the</tspan>
<tspan x="49.92" y="582.453">payload material.</tspan>
</text>
<text id="o019" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="49.92" y="624.64">The payload strength is an input that must be supplied; no value is assumed here.</tspan>
</text>
<text id="o020" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Checks of Eq. C4-E24 at p₀ = p₀,crit.</tspan>
</text>
</svg>
