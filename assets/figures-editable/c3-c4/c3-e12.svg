<tspan x="961.92" y="372.053">t − rᵢ/c</tspan>
</text>
<text id="o077" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="597.12" y="571.84">φ(x,t) ≃ −Σ V̇ᵢ(t − rᵢ/c) / (4π rᵢ),   p′ ≃ Σ ρ V̈ᵢ(t − rᵢ/c) / (4π rᵢ)</tspan>
</text>
<text id="o078" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="597.12" y="620.387">A spatial sum needs source histories and travel times, not just a site</tspan>
<tspan x="597.12" y="640.053">count.</tspan>
</text>
