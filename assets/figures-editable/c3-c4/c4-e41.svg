</text>
<line id="o011" x1="60.48" y1="216" x2="67.2" y2="216" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="1.33333" opacity="1"/>
<line id="o012" x1="67.2" y1="216" x2="576" y2="216" fill="#FFFFFF" stroke="#2E4756" stroke-width="0.8" opacity="1"/>
