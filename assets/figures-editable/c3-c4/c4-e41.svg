<tspan x="55.68" y="220.76">1</tspan>
</text>
<rect id="o014" x="90.944" y="216" width="122.112" height="264" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="0.85"/>
<text id="o015" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="152" y="201.693">1.00</tspan>
</text>
<text id="o016" font-family="Arial,sans-serif" font-size="14.6667" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="152" y="501.627">applied work</tspan>
</text>
<rect id="o017" x="260.544" y="216" width="122.112" height="66" fill="#F2B880" stroke="#F2B880" stroke-width="1.33333" opacity="0.85"/>
<text id="o018" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="321.6" y="201.693">-0.25</tspan>
</text>
<text id="o019" font-family="Arial,sans-serif" font-size="14.6667" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="321.6" y="501.627">− cohesive loss</tspan>
</text>
<rect id="o020" x="430.144" y="282" width="122.112" height="198" fill="#7FC8F8" stroke="#7FC8F8" stroke-width="1.33333" opacity="0.85"/>
<text id="o021" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="491.2" y="267.693">0.75</tspan>
</text>
<text id="o022" font-family="Arial,sans-serif" font-size="14.6667" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="491.2" y="501.627">= stored + moving</tspan>
</text>
<text id="o023" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="59.52" y="537.693">d(K_f + U_b + U_T)/dt = ∫ p_load ẇ dA − ∫ t_coh ẇ dA</tspan>
</text>
<text id="o024" font-family="Arial,sans-serif" font-size="15.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="59.52" y="580.893">Each term has units of watts.</tspan>
</text>
<rect id="o025" x="624" y="96" width="619.2" height="508.8" rx="40.704" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o026" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="637.44" y="118.44">Multiply the balance by ẇ and integrate</tspan>
</text>
<text id="o027" font-family="Arial,sans-serif" font-size="16.6667" fill="#7FC8F8" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="645.12" y="173.987">inertia</tspan>
</text>
<text id="o028" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="769.92" y="173.987">∫ m_A ẅ ẇ dA = dK_f/dt</tspan>
</text>
<text id="o029" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="645.12" y="245.987">bending</tspan>
</text>
<text id="o030" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="769.92" y="245.987">∫ D_f ∇⁴w ẇ dA = dU_b/dt</tspan>
</text>
<text id="o031" font-family="Arial,sans-serif" font-size="16.6667" fill="#F28BA0" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="645.12" y="317.987">tension</tspan>
</text>
<text id="o032" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="769.92" y="317.987">−∫ T₀ ∇²w ẇ dA = dU_T/dt</tspan>
</text>
<text id="o033" font-family="Arial,sans-serif" font-size="16" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="645.12" y="399.04">These identities need the fixed clamp: boundary power terms are zero.</tspan>
</text>
<text id="o034" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="645.12" y="466.787">Reading: the film cannot gain energy except through the work of</tspan>
<tspan x="645.12" y="486.453">the load, minus what the cohesive layer takes.</tspan>
</text>
<text id="o035" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Plate power identity of Eq. C4-E41; waterfall values are illustrative.</tspan>
</text>
</svg>
