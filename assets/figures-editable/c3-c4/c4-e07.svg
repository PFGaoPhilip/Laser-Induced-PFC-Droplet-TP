<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1279.97 720" role="img">
<title>C4-E07</title>
<defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/></marker></defs>
<rect width="1279.97" height="720" fill="#142632"/>
<text id="o000" font-family="Arial,sans-serif" font-size="25.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="30.72" y="35.1733">C4-E07 · Conditional coupled-sheet model</tspan>
</text>
<rect id="o001" x="48" y="96" width="691.2" height="508.8" rx="40.704" fill="#1E4A5A" stroke="#2B6678" stroke-width="1.6" opacity="1"/>
<text id="o002" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="64.32" y="117.48">Two sheets in series</tspan>
</text>
<line id="o003" x1="192" y1="182.4" x2="192" y2="264" fill="#FFFFFF" stroke="#F28BA0" stroke-width="5.33333" opacity="1" marker-end="url(#head)"/>
<text id="o004" font-family="Arial,sans-serif" font-size="15.3333" fill="#F28BA0" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="203.52" y="192.093">p_liq from the liquid</tspan>
</text>
<rect id="o005" x="115.2" y="268.8" width="537.6" height="28.8" fill="#3A5362" stroke="#B4C7D2" stroke-width="2" opacity="1"/>
<text id="o006" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="376.32" y="250.24">PVC sheet (P)</tspan>
</text>
<polyline id="o007" points="288,297.6 288,307.968 278.4,310.704 297.6,316.176 278.4,321.648 297.6,327.12 278.4,332.592 297.6,338.064 278.4,343.536 297.6,349.008 278.4,354.48 297.6,359.952 278.4,365.424 297.6,370.896 288,373.632 288,384" fill="none" stroke="#8EDBD4" stroke-width="2.66667" opacity="1"/>
<polyline id="o008" points="480,297.6 480,307.968 470.4,310.704 489.6,316.176 470.4,321.648 489.6,327.12 470.4,332.592 489.6,338.064 470.4,343.536 489.6,349.008 470.4,354.48 489.6,359.952 470.4,365.424 489.6,370.896 480,373.632 480,384" fill="none" stroke="#8EDBD4" stroke-width="2.66667" opacity="1"/>
<text id="o009" font-family="Arial,sans-serif" font-size="14.6667" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="309.12" y="340.347">contact</tspan>
<tspan x="309.12" y="357.653">load t_P→f</tspan>
</text>
<rect id="o010" x="115.2" y="384" width="537.6" height="28.8" fill="#3A5362" stroke="#B4C7D2" stroke-width="2" opacity="1"/>
<text id="o011" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="117.12" y="437.44">film (f)</tspan>
</text>
<line id="o012" x1="384" y1="499.2" x2="384" y2="422.4" fill="#FFFFFF" stroke="#F2B880" stroke-width="4.66667" opacity="1" marker-end="url(#head)"/>
<text id="o013" font-family="Arial,sans-serif" font-size="15.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="395.52" y="480.093">t_coh (resists)</tspan>
</text>
<text id="o014" font-family="Arial,sans-serif" font-size="16" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="97.92" y="552.64">The film sees t_P→f, not p_liq: the intermediate sheet filters the load.</tspan>
</text>
<rect id="o015" x="758.4" y="96" width="484.8" height="508.8" rx="38.784" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o016" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="771.84" y="118.44">Two coupled plate equations</tspan>
</text>
<text id="o017" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="774.72" y="163.293">m_A,P ẅ_P + D_P∇⁴w_P − T_P∇²w_P = p_liq − t_P→f</tspan>
</text>
<text id="o018" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="774.72" y="259.293">m_A ẅ + D_f∇⁴w − T₀∇²w = t_P→f − t_coh</tspan>
</text>
<text id="o019" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="774.72" y="351.04">The same t_P→f is a loss for P and a load for f</tspan>
<tspan x="774.72" y="369.92">(Newton third law).</tspan>
</text>
<text id="o020" font-family="Arial,sans-serif" font-size="16" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="774.72" y="437.44">Conditional: valid only while the sheets stay in</tspan>
<tspan x="774.72" y="456.32">contact; t_P→f itself needs a contact law.</tspan>
</text>
<text id="o021" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Coupled-sheet model of Eq. C4-E07; schematic.</tspan>
</text>
</svg>
