<tspan x="307.2" y="375.587">gas</tspan>
</text>
<ellipse id="o040" cx="362.263" cy="295.761" rx="8.64" ry="8.64" fill="#F2B880" stroke="#F2B880" stroke-width="1.33333" opacity="1"/>
<text id="o041" font-family="Arial,sans-serif" font-size="15.3333" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="69.12" y="216.093">X: material point on Γ</tspan>
</text>
<line id="o042" x1="362.263" y1="295.761" x2="434.263" y2="242.961" fill="#FFFFFF" stroke="#F2B880" stroke-width="4" opacity="1" marker-end="url(#head)"/>
<text id="o043" font-family="Arial,sans-serif" font-size="16" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="440.983" y="253.201">dX/dt = u(X, t)</tspan>
</text>
<line id="o044" x1="352.663" y1="300.561" x2="304.663" y2="338.961" fill="#FFFFFF" stroke="#8EDBD4" stroke-width="4" opacity="1" marker-end="url(#head)"/>
<text id="o045" font-family="Arial,sans-serif" font-size="15.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="69.12" y="254.493">Vₙ = ∂ₙφ  (normal speed)</tspan>
</text>
<line id="o046" x1="499.2" y1="528" x2="499.2" y2="480" fill="#FFFFFF" stroke="#F28BA0" stroke-width="4" opacity="1" marker-end="url(#head)"/>
<text id="o047" font-family="Arial,sans-serif" font-size="16" fill="#F28BA0" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="515.52" y="471.04">wall: ∂ₙφ = V_w·n</tspan>
</text>
<text id="o048" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="510.72" y="125.44">far field: φ → 0</tspan>
</text>
<text id="o049" font-family="Arial,sans-serif" font-size="16" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="59.52" y="120.64">initial data: (Γ, φ_Γ) at t = 0 = (Γ₀, φ₀)</tspan>
</text>
<rect id="o050" x="825.6" y="96" width="417.6" height="508.8" rx="33.408" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o051" font-family="Arial,sans-serif" font-size="17.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="839.04" y="117.893">Four things a jet prediction needs</tspan>
</text>
<text id="o052" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="863.04" y="169.187">Kinematic condition: the surface moves</tspan>
<tspan x="863.04" y="188.853">with the liquid, dX/dt = u(X, t), and Vₙ =</tspan>
<tspan x="863.04" y="208.52">∂ₙφ.</tspan>
</text>
<ellipse id="o053" cx="847.68" cy="163.933" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o054" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="863.04" y="239.787">Wall condition: the liquid cannot pass</tspan>
<tspan x="863.04" y="259.453">through a moving wall, ∂ₙφ = V_w·n.</tspan>
</text>
<ellipse id="o055" cx="847.68" cy="234.533" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o056" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="863.04" y="290.053">Far field: the liquid is quiescent far</tspan>
<tspan x="863.04" y="309.72">away, φ → 0.</tspan>
</text>
<ellipse id="o057" cx="847.68" cy="284.8" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o058" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="863.04" y="340.32">Initial shape Γ₀ and potential φ₀.</tspan>
</text>
<ellipse id="o059" cx="847.68" cy="335.067" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o060" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="841.92" y="485.987">Without the last item the potential equation</tspan>
<tspan x="841.92" y="505.653">has no starting state, so it cannot predict</tspan>
<tspan x="841.92" y="525.32">a jet.</tspan>
</text>
<text id="o061" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Boundary and initial conditions of Eq. C3-E14.</tspan>
</text>
</svg>
