<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1279.97 720" role="img">
<title>C4-E36</title>
<defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/></marker></defs>
<rect width="1279.97" height="720" fill="#142632"/>
<text id="o000" font-family="Arial,sans-serif" font-size="25.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="30.72" y="35.1733">C4-E36 · Original global screens</tspan>
</text>
<text id="o001" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="49.92" y="112.68">Defence 1: global screens</tspan>
</text>
<rect id="o002" x="48" y="144" width="576" height="220.8" rx="17.664" fill="#213E4B" stroke="#F2B880" stroke-width="2.13333" opacity="1"/>
<text id="o003" font-family="Arial,sans-serif" font-size="18" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="61.44" y="166.44">Energy</tspan>
</text>
<text id="o004" font-family="Arial,sans-serif" font-size="18.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="64.32" y="218.827">E_solid ≥ Γ A_f + ½ m_f v_f²</tspan>
</text>
<text id="o005" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="64.32" y="283.84">fracture cost + kinetic energy of departure</tspan>
</text>
<rect id="o006" x="652.8" y="144" width="576" height="220.8" rx="17.664" fill="#213E4B" stroke="#F28BA0" stroke-width="2.13333" opacity="1"/>
<text id="o007" font-family="Arial,sans-serif" font-size="18" fill="#F28BA0" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="666.24" y="166.44">Momentum</tspan>
</text>
<text id="o008" font-family="Arial,sans-serif" font-size="18.6667" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="669.12" y="218.827">Iₙₑₜ ≥ m_f v_f</tspan>
</text>
<text id="o009" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="669.12" y="283.84">net impulse must carry the film at v_f</tspan>
</text>
<text id="o010" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="49.92" y="420.16">E_solid 10.0 nJ vs Γ A_f 5.0 nJ (passes)</tspan>
</text>
<rect id="o011" x="662.4" y="403.2" width="432" height="38.4" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="0.85"/>
<text id="o012" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="1104" y="423.04">1.00 of need</tspan>
</text>
<text id="o013" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="49.92" y="482.56">E_solid 10.0 nJ vs Γ A_f 20.0 nJ (fails)</tspan>
</text>
<rect id="o014" x="662.4" y="465.6" width="216" height="38.4" fill="#F28BA0" stroke="#F28BA0" stroke-width="1.33333" opacity="0.85"/>
<text id="o015" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="888" y="485.44">0.50 of need</tspan>
</text>
<text id="o016" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="49.92" y="562.787">Both screens must pass for the same Γ, A_f, m_f and v_f; the 20 nJ case already fails the first.</tspan>
</text>
<text id="o017" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Reference formulas of the Defence 1 answer: Eqs. C4-E30 to E33 (bar = budget / need, capped at 1).</tspan>
</text>
</svg>
