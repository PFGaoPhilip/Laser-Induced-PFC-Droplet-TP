<tspan x="736.32" y="373.52">V_bl = π p₀ b⁶ / (192 D_f)</tspan>
</text>
<text id="o036" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="97.92" y="591.587">The volume sums the opening of all concentric annuli; the numerical area under 2π w r reproduces the closed form.</tspan>
</text>
<text id="o037" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Volume integral of Eq. C4-E18 (normalised: w/w(0) = (1 − x²)², x = r/b, area π/3 in units w(0)b²).</tspan>
</text>
</svg>
