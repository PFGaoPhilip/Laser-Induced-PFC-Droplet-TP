<line id="o004" x1="60.48" y1="480" x2="67.2" y2="480" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="1.33333" opacity="1"/>
<line id="o005" x1="67.2" y1="480" x2="643.2" y2="480" fill="#FFFFFF" stroke="#2E4756" stroke-width="0.8" opacity="1"/>
<text id="o006" font-family="Arial,sans-serif" font-size="14" fill="#B4C7D2" text-anchor="end" opacity="1">
<tspan x="55.68" y="484.76">0</tspan>
</text>
<line id="o007" x1="60.48" y1="348" x2="67.2" y2="348" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="1.33333" opacity="1"/>
<line id="o008" x1="67.2" y1="348" x2="643.2" y2="348" fill="#FFFFFF" stroke="#2E4756" stroke-width="0.8" opacity="1"/>
<text id="o009" font-family="Arial,sans-serif" font-size="14" fill="#B4C7D2" text-anchor="end" opacity="1">
<tspan x="55.68" y="352.76">0.5</tspan>
</text>
<line id="o010" x1="60.48" y1="216" x2="67.2" y2="216" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="1.33333" opacity="1"/>
<line id="o011" x1="67.2" y1="216" x2="643.2" y2="216" fill="#FFFFFF" stroke="#2E4756" stroke-width="0.8" opacity="1"/>
<text id="o012" font-family="Arial,sans-serif" font-size="14" fill="#B4C7D2" text-anchor="end" opacity="1">
<tspan x="55.68" y="220.76">1</tspan>
</text>
<rect id="o013" x="83.328" y="216" width="82.944" height="264" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="0.85"/>
<text id="o014" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="124.8" y="201.693">1.00</tspan>
</text>
<text id="o015" font-family="Arial,sans-serif" font-size="14.6667" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="124.8" y="501.627">P_load (power in)</tspan>
</text>
<rect id="o016" x="198.528" y="216" width="82.944" height="118.8" fill="#7FC8F8" stroke="#7FC8F8" stroke-width="1.33333" opacity="0.85"/>
<text id="o017" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="240" y="201.693">-0.45</tspan>
</text>
<text id="o018" font-family="Arial,sans-serif" font-size="14.6667" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="240" y="501.627">− dK/dt − dU/dt</tspan>
</text>
<rect id="o019" x="313.728" y="334.8" width="82.944" height="105.6" fill="#F2B880" stroke="#F2B880" stroke-width="1.33333" opacity="0.85"/>
<text id="o020" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="355.2" y="320.493">-0.40</tspan>
</text>
<text id="o021" font-family="Arial,sans-serif" font-size="14.6667" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="355.2" y="501.627">− Γ v_c ℓ</tspan>
<tspan x="355.2" y="518.933">(fracture)</tspan>
</text>
<rect id="o022" x="428.928" y="440.4" width="82.944" height="39.6" fill="#F28BA0" stroke="#F28BA0" stroke-width="1.33333" opacity="0.85"/>
<text id="o023" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="470.4" y="426.093">-0.15</tspan>
</text>
<text id="o024" font-family="Arial,sans-serif" font-size="14.6667" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="470.4" y="501.627">− Pₒₜₕₑᵣ</tspan>
</text>
<rect id="o025" x="544.128" y="480" width="82.944" height="1.92" fill="#B4C7D2" stroke="#B4C7D2" stroke-width="1.33333" opacity="0.85"/>
<text id="o026" font-family="Arial,sans-serif" font-size="15.3333" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="585.6" y="465.693">0.00</tspan>
</text>
<text id="o027" font-family="Arial,sans-serif" font-size="14.6667" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="585.6" y="501.627">= 0</tspan>
</text>
<rect id="o028" x="691.2" y="96" width="552" height="412.8" rx="33.024" fill="#213E4B" stroke="#8EDBD4" stroke-width="2.13333" opacity="1"/>
<text id="o029" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="704.64" y="118.44">Dynamic balance on a moving crack</tspan>
</text>
<text id="o030" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="707.52" y="163.84">P_load = d(K_f + U_f)/dt + ∫ Γ v_c dℓ + Pₒₜₕₑᵣ</tspan>
</text>
<text id="o031" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="728.64" y="240.64">K_f: motion of the film, U_f: elastic energy.</tspan>
</text>
<ellipse id="o032" cx="713.28" cy="235.52" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o033" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="728.64" y="269.76">Γ v_c along the front length is the fracture power.</tspan>
</text>
<ellipse id="o034" cx="713.28" cy="264.64" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o035" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="728.64" y="298.88">Pₒₜₕₑᵣ: dissipation or radiation not otherwise counted.</tspan>
</text>
<ellipse id="o036" cx="713.28" cy="293.76" rx="4.32" ry="4.32" fill="#8EDBD4" stroke="#8EDBD4" stroke-width="1.33333" opacity="1"/>
<text id="o037" font-family="Arial,sans-serif" font-size="16" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="707.52" y="399.04">Part of the load work is stored as kinetic energy before the</tspan>
<tspan x="707.52" y="417.92">crack moves.</tspan>
</text>
<text id="o038" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="49.92" y="553.187">Quasistatic G ≥ Γ is the slow limit of this balance (K_f → 0).</tspan>
</text>
<text id="o039" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="49.92" y="605.44">Conditional: needs a fracture-resistance law Γ(ψ, Tᵢ, v_c) for the actual interface.</tspan>
</text>
<text id="o040" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Dynamic energy balance of Eq. C4-E12; shares are illustrative.</tspan>
</text>
</svg>
