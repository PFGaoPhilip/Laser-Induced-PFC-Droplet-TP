<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1279.97 720" role="img">
<title>C4-E35</title>
<defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/></marker></defs>
<rect width="1279.97" height="720" fill="#142632"/>
<text id="o000" font-family="Arial,sans-serif" font-size="25.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="30.72" y="35.1733">C4-E35 · Original load, impulse and work formulas</tspan>
</text>
<text id="o001" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="49.92" y="112.68">Defence 1: load, impulse and work are three different quantities</tspan>
</text>
<rect id="o002" x="48" y="144" width="379.2" height="316.8" rx="25.344" fill="#213E4B" stroke="#7FC8F8" stroke-width="2.13333" opacity="1"/>
<text id="o003" font-family="Arial,sans-serif" font-size="18.6667" fill="#7FC8F8" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="61.44" y="166.987">traction</tspan>
</text>
<text id="o004" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="237.6" y="217.733">tₗ = Tₗ n_f</tspan>
</text>
<text id="o005" font-family="Arial,sans-serif" font-size="16.6667" fill="#7FC8F8" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="237.6" y="298.787">unit: Pa (local)</tspan>
</text>
<text id="o006" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="237.6" y="360.64">what the film feels at a point</tspan>
</text>
<rect id="o007" x="446.4" y="144" width="379.2" height="316.8" rx="25.344" fill="#213E4B" stroke="#F2B880" stroke-width="2.13333" opacity="1"/>
<text id="o008" font-family="Arial,sans-serif" font-size="18.6667" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="459.84" y="166.987">impulse</tspan>
</text>
<text id="o009" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="636" y="217.733">Iₗ = ∫∫ tₗ dA dt</tspan>
</text>
<text id="o010" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="636" y="298.787">unit: N s</tspan>
</text>
<text id="o011" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="636" y="360.64">area and time integrated</tspan>
</text>
<rect id="o012" x="844.8" y="144" width="379.2" height="316.8" rx="25.344" fill="#213E4B" stroke="#F28BA0" stroke-width="2.13333" opacity="1"/>
<text id="o013" font-family="Arial,sans-serif" font-size="18.6667" fill="#F28BA0" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="858.24" y="166.987">work</tspan>
</text>
<text id="o014" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="1034.4" y="217.733">Wₗ = ∫∫ tₗ·v_f dA dt</tspan>
</text>
<text id="o015" font-family="Arial,sans-serif" font-size="16.6667" fill="#F28BA0" text-anchor="middle" font-weight="bold" opacity="1">
<tspan x="1034.4" y="298.787">unit: J</tspan>
</text>
<text id="o016" font-family="Arial,sans-serif" font-size="16" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="1034.4" y="360.64">needs surface motion v_f</tspan>
</text>
<text id="o017" font-family="Arial,sans-serif" font-size="17.3333" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="49.92" y="505.733">Pressure alone says nothing about momentum or energy: duration, footprint and motion decide.</tspan>
</text>
<text id="o018" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="49.92" y="562.787">A stiff, immobile wall receives force and impulse but zero work.</tspan>
</text>
<text id="o019" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Reference formulas of the Defence 1 answer: Eqs. C4-E01 and C4-E02.</tspan>
</text>
</svg>
