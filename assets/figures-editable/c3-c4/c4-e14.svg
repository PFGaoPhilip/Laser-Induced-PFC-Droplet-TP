<text id="o033" font-family="Arial,sans-serif" font-size="15.3333" fill="#F28BA0" text-anchor="start" opacity="1">
<tspan x="952.8" y="198.693">C₁/r diverges</tspan>
</text>
<text id="o034" font-family="Arial,sans-serif" font-size="15.3333" fill="#8EDBD4" text-anchor="start" opacity="1">
<tspan x="1036.8" y="352.293">regular: C₁ = 0</tspan>
</text>
<line id="o035" x1="892.8" y1="316.8" x2="1228.8" y2="316.8" fill="#FFFFFF" stroke="#8EDBD4" stroke-width="3.33333" opacity="1"/>
<text id="o036" font-family="Arial,sans-serif" font-size="16.6667" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="59.52" y="529.187">A term C₁/r would make the slope infinite at the centre of a smooth plate; the physical solution cannot contain it.</tspan>
</text>
<text id="o037" font-family="Arial,sans-serif" font-size="16.6667" fill="#F2B880" text-anchor="start" opacity="1">
<tspan x="59.52" y="586.787">C₂ is still free: it will be fixed with the clamp conditions in Eq. C4-E16.</tspan>
</text>
<text id="o038" font-family="Arial,sans-serif" font-size="13.3333" fill="#B4C7D2" text-anchor="start" opacity="1">
<tspan x="35.52" y="696.373">Radial integration of Eq. C4-E14; the right plot is the C₁/r term for C₁ = 0.5 (schematic).</tspan>
</text>
</svg>
