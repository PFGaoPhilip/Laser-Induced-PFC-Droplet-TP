<line id="o015" x1="892.8" y1="153.6" x2="892.8" y2="480" fill="#FFFFFF" stroke="#2E4756" stroke-width="0.8" opacity="1"/>
<text id="o016" font-family="Arial,sans-serif" font-size="14" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="892.8" y="502.04">0</tspan>
</text>
<line id="o017" x1="1060.8" y1="480" x2="1060.8" y2="486.72" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="1.33333" opacity="1"/>
<line id="o018" x1="1060.8" y1="153.6" x2="1060.8" y2="480" fill="#FFFFFF" stroke="#2E4756" stroke-width="0.8" opacity="1"/>
<text id="o019" font-family="Arial,sans-serif" font-size="14" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="1060.8" y="502.04">0.5</tspan>
</text>
<line id="o020" x1="1228.8" y1="480" x2="1228.8" y2="486.72" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="1.33333" opacity="1"/>
<line id="o021" x1="1228.8" y1="153.6" x2="1228.8" y2="480" fill="#FFFFFF" stroke="#2E4756" stroke-width="0.8" opacity="1"/>
<text id="o022" font-family="Arial,sans-serif" font-size="14" fill="#B4C7D2" text-anchor="middle" opacity="1">
<tspan x="1228.8" y="502.04">1</tspan>
</text>
<line id="o023" x1="886.08" y1="480" x2="892.8" y2="480" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="1.33333" opacity="1"/>
<line id="o024" x1="886.08" y1="316.8" x2="892.8" y2="316.8" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="1.33333" opacity="1"/>
<line id="o025" x1="892.8" y1="316.8" x2="1228.8" y2="316.8" fill="#FFFFFF" stroke="#2E4756" stroke-width="0.8" opacity="1"/>
<text id="o026" font-family="Arial,sans-serif" font-size="14" fill="#B4C7D2" text-anchor="end" opacity="1">
<tspan x="881.28" y="321.56">0</tspan>
</text>
<line id="o027" x1="886.08" y1="153.6" x2="892.8" y2="153.6" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="1.33333" opacity="1"/>
<line id="o028" x1="892.8" y1="153.6" x2="1228.8" y2="153.6" fill="#FFFFFF" stroke="#2E4756" stroke-width="0.8" opacity="1"/>
<text id="o029" font-family="Arial,sans-serif" font-size="14" fill="#B4C7D2" text-anchor="end" opacity="1">
<tspan x="881.28" y="158.36">8</tspan>
</text>
<text id="o030" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="middle" opacity="1">
<tspan x="1060.8" y="524.8">r / b</tspan>
</text>
<text id="o031" font-family="Arial,sans-serif" font-size="16" fill="#E7F0F3" text-anchor="start" opacity="1">
<tspan x="837.12" y="132.16">C₁ / r  term</tspan>
</text>
