<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1279.97 720" role="img">
<title>C4-E14</title>
<defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/></marker></defs>
<rect width="1279.97" height="720" fill="#142632"/>
<text id="o000" font-family="Arial,sans-serif" font-size="25.3333" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="30.72" y="35.1733">C4-E14 · Derived first two radial integrations</tspan>
</text>
<text id="o001" font-family="Arial,sans-serif" font-size="18" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="49.92" y="112.68">First pair of integrations: regularity removes C₁</tspan>
</text>
<text id="o002" font-family="Arial,sans-serif" font-size="16" fill="#7FC8F8" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="59.52" y="163.84">start</tspan>
</text>
<text id="o003" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="366.72" y="164.933">d/dr (r g′) = p₀ r / D_f</tspan>
</text>
<text id="o004" font-family="Arial,sans-serif" font-size="16" fill="#7FC8F8" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="59.52" y="232.96">integrate</tspan>
</text>
<text id="o005" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="366.72" y="234.053">r g′ = p₀ r² / (2D_f) + C₁</tspan>
</text>
<text id="o006" font-family="Arial,sans-serif" font-size="16" fill="#F2B880" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="59.52" y="302.08">divide by r</tspan>
</text>
<text id="o007" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="366.72" y="303.173">g′ = p₀ r / (2D_f) + C₁ / r</tspan>
</text>
<text id="o008" font-family="Arial,sans-serif" font-size="16" fill="#F28BA0" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="59.52" y="371.2">regular at r = 0 ⇒ C₁ = 0</tspan>
</text>
<text id="o009" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="366.72" y="372.293">g′ = p₀ r / (2D_f)</tspan>
</text>
<text id="o010" font-family="Arial,sans-serif" font-size="16" fill="#8EDBD4" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="59.52" y="440.32">integrate</tspan>
</text>
<text id="o011" font-family="Arial,sans-serif" font-size="17.3333" fill="#E7F0F3" text-anchor="start" font-weight="bold" opacity="1">
<tspan x="366.72" y="441.413">g(r) = p₀ r² / (4D_f) + C₂</tspan>
</text>
<line id="o012" x1="892.8" y1="480" x2="1228.8" y2="480" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="2" opacity="1"/>
<line id="o013" x1="892.8" y1="153.6" x2="892.8" y2="480" fill="#FFFFFF" stroke="#B4C7D2" stroke-width="2" opacity="1"/>
